<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏行业周报 | 2026-10-23 ~ 2026-10-29</title>
  <style>
    :root {
      --ink:#1a2436; --ink-soft:#3a4862; --muted:#6b7993; --faint:#9aa6bd;
      --accent:#5b6ef5;
      --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78);
      --glass-border:rgba(255,255,255,.7); --line:rgba(31,45,75,.10); --line-strong:rgba(31,45,75,.16);
      --shadow-sm:0 3px 12px rgba(31,45,75,.05);
      --shadow:0 6px 28px rgba(31,45,75,.07);
      --shadow-lg:0 14px 40px rgba(31,45,75,.12);
      --industry:#4f7cff; --industry-soft:rgba(79,124,255,.12); --industry-ink:#2b53c4;
      --ai:#00b3d4; --ai-soft:rgba(0,179,212,.12); --ai-ink:#06748a;
      --release:#16b884; --release-soft:rgba(22,184,132,.13); --release-ink:#0b7a57;
      --discourse:#f0a02a; --discourse-soft:rgba(240,160,42,.15); --discourse-ink:#9a6206;
      --deep:#8b6df0; --deep-soft:rgba(139,109,240,.13); --deep-ink:#5a3fc0;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif; line-height:1.65; -webkit-font-smoothing:antialiased; }
    /* decorative gradient field behind the frosted glass */
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(circle at 12% 18%, rgba(91,110,245,.20), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(0,179,212,.16), transparent 40%),
        radial-gradient(circle at 78% 88%, rgba(139,109,240,.18), transparent 46%),
        radial-gradient(circle at 25% 92%, rgba(22,184,132,.13), transparent 44%),
        linear-gradient(135deg,#eef1fb 0%,#f3effb 48%,#eaf3fc 100%); }
    a { color:inherit; text-decoration:none; }
    button,input { font:inherit; }
    ::selection { background:rgba(91,110,245,.22); }
    .app { min-height:100vh; display:grid; grid-template-columns:264px minmax(0,1fr); transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
    .app.collapsed { grid-template-columns:0 minmax(0,1fr); }

    /* Sidebar — frosted glass */
    aside.sidebar { position:sticky; top:0; height:100vh; padding:24px 18px; color:var(--ink); display:flex; flex-direction:column;
      background:rgba(255,255,255,.48); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
      border-right:1px solid rgba(255,255,255,.55); overflow-y:auto; overflow-x:hidden; transition:transform .25s cubic-bezier(.4,0,.2,1), opacity .2s; }
    .app.collapsed aside.sidebar { transform:translateX(-100%); opacity:0; pointer-events:none; }

    /* Sidebar toggle button (in topbar, always visible) */
    .sidebar-toggle { width:40px; height:40px; border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; border-radius:12px; display:grid; place-items:center; font-size:16px; line-height:1; transition:all .14s; }
    .sidebar-toggle:hover { color:var(--accent); border-color:var(--accent); }
    .sidebar-toggle .icon-open { display:inline; }
    .sidebar-toggle .icon-close { display:none; }
    .app.collapsed .sidebar-toggle .icon-open { display:none; }
    .app.collapsed .sidebar-toggle .icon-close { display:inline; }
    .back-home { width:max-content; display:inline-flex; align-items:center; gap:7px; margin:0 2px 18px; padding:7px 10px; border-radius:9px; color:var(--ink-soft); text-decoration:none; font-size:13px; font-weight:600; transition:background .14s,color .14s,transform .14s; }
    .back-home:hover { background:rgba(255,255,255,.62); color:var(--accent); transform:translateX(-2px); }
    .back-home:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 2px 20px; border-bottom:1px solid var(--line); }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:11px; background:#fff; padding:7px; box-shadow:0 3px 10px rgba(31,45,75,.10); }
    .brand-mark img { width:100%; height:100%; display:block; object-fit:contain; }
    .brand strong { display:block; font-size:15px; line-height:1.1; letter-spacing:.2px; color:var(--ink); }
    .brand span { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
    .nav-title { margin:22px 0 10px; color:var(--faint); font-size:10px; letter-spacing:1.3px; text-transform:uppercase; font-weight:700; }
    .nav { display:grid; gap:3px; }
    .nav button { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; border:0; background:transparent; color:var(--ink-soft); padding:11px 14px; text-align:left; cursor:pointer; border-radius:11px; position:relative; font-size:14px; font-weight:500; transition:all .14s; }
    .nav button:hover { background:rgba(255,255,255,.55); color:var(--ink); }
    .nav button.active { background:rgba(91,110,245,.12); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px rgba(91,110,245,.18); }
    .nav button.active::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--accent2,var(--accent)); }
    .nav button[data-section="industry"] { --accent2:var(--industry); }
    .nav button[data-section="ai"] { --accent2:var(--ai); }
    .nav button[data-section="release"] { --accent2:var(--release); }
    .nav button[data-section="discourse"] { --accent2:var(--discourse); }
    .nav button[data-section="deep"] { --accent2:var(--deep); }
    .count { min-width:24px; padding:1px 9px; color:var(--muted); background:rgba(31,45,75,.07); text-align:center; border-radius:11px; font-size:12px; font-weight:600; }
    .nav button.active .count { background:var(--accent2,var(--accent)); color:#fff; }
    .sidebar-footer { margin:auto -18px -24px; padding:16px 22px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.65; }
    .sidebar-footer .made { color:var(--ink-soft); font-weight:600; }
    .sidebar-footer a { color:var(--accent); }
    .sidebar-footer .stat { margin-top:8px; color:var(--faint); }

    /* Main */
    main { padding:30px 40px 64px; min-width:0; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; line-height:1.25; letter-spacing:-.2px; font-weight:800; color:var(--ink); }
    .subtitle { margin-top:8px; color:var(--muted); font-size:13.5px; }
    .actions { display:flex; gap:10px; align-items:center; }
    .search { width:320px; display:flex; align-items:center; gap:8px; background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); padding:9px 14px; border-radius:12px; transition:border-color .15s, box-shadow .15s; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,110,245,.12); background:#fff; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:13.5px; }
    .search input::placeholder { color:var(--faint); }
    .icon-btn { border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; width:40px; height:40px; border-radius:12px; transition:all .14s; }
    .icon-btn:hover { color:var(--accent); border-color:var(--accent); }

    /* Metrics */
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:30px; }
    .metric { background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); padding:18px 20px; border-radius:18px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden; }
    .metric::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent2,var(--industry)); }
    .metric:nth-child(1) { --accent2:var(--industry); }
    .metric:nth-child(2) { --accent2:var(--release); }
    .metric:nth-child(3) { --accent2:var(--discourse); }
    .metric:nth-child(4) { --accent2:var(--deep); }
    .metric span { color:var(--muted); font-size:12.5px; letter-spacing:.3px; }
    .metric strong { display:block; font-size:26px; line-height:1.1; margin-top:6px; font-weight:800; color:var(--ink); }

    /* Section-head (单 section 视图) */
    .section-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin:6px 0 20px; padding:16px 20px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); border-left:4px solid var(--accent2,var(--industry)); border-radius:18px; box-shadow:var(--shadow-sm); }
    .section-head[data-section="industry"] { --accent2:var(--industry); }
    .section-head[data-section="ai"] { --accent2:var(--ai); }
    .section-head[data-section="release"] { --accent2:var(--release); }
    .section-head[data-section="discourse"] { --accent2:var(--discourse); }
    .section-head[data-section="deep"] { --accent2:var(--deep); }
    h2 { margin:0; font-size:20px; font-weight:700; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .toggle { display:flex; border:1px solid var(--glass-border); background:var(--glass); border-radius:11px; overflow:hidden; }
    .toggle button { padding:8px 15px; border:0; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13px; transition:all .14s; }
    .toggle button.active { background:var(--accent); color:#fff; font-weight:600; }

    /* "全部" 视图下的 section 分块 */
    .section-block { margin-top:38px; min-width:0; }
    .section-block:first-child { margin-top:0; }
    .section-banner { display:flex; align-items:baseline; gap:14px; padding:13px 18px; margin-bottom:16px; background:var(--accent-soft,var(--industry-soft)); border-left:4px solid var(--accent2,var(--industry)); border-radius:14px; }
    .section-banner[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .section-banner[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .section-banner[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .section-banner[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .section-banner[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .section-banner h2 { color:var(--accent-ink); font-size:17px; margin:0; font-weight:700; }
    .section-banner .banner-count { color:var(--accent2); font-weight:700; font-size:13px; }
    .section-banner .banner-desc { color:var(--accent-ink); opacity:.7; font-size:13px; margin-left:auto; }

    /* Cards — glass */
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; min-width:0; }
    .grid.compact { grid-template-columns:1fr; }
    .item { min-width:0; background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); border-left:3px solid var(--accent2,var(--industry)); padding:20px 24px; border-radius:18px; box-shadow:var(--shadow-sm); transition:transform .18s, box-shadow .18s; display:flex; flex-direction:column; }
    .item:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
    .item[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .item[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .item[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .item[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .item[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .item-top { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:11px; }
    .tag { padding:3px 11px; font-size:12px; color:var(--accent-ink); background:var(--accent-soft); border-radius:8px; font-weight:700; letter-spacing:.2px; }
    h3 { margin:2px 0 10px; font-size:17.5px; line-height:1.45; font-weight:700; color:var(--ink); letter-spacing:.1px; }
    .item p { margin:0 0 14px; color:var(--ink-soft); font-size:14.5px; line-height:1.78; }
    .meta-row { display:flex; flex-wrap:wrap; gap:7px; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .meta-row span { padding:3px 10px; background:rgba(31,45,75,.06); border-radius:8px; }
    .item .meta-row span.borderline { background:rgba(240,160,42,.14); color:#a8680a; }
    .source-btn { margin-top:14px; padding:8px 14px; border:1px solid var(--glass-border); background:rgba(255,255,255,.5); color:var(--accent); cursor:pointer; border-radius:11px; font-size:13px; font-weight:600; align-self:flex-start; transition:all .14s; }
    .source-btn:hover { background:var(--accent-soft); border-color:var(--accent2); }
    .ranking-notes { margin:0 0 12px; padding-left:20px; color:var(--ink-soft); line-height:1.55; font-size:13.5px; }
    .ranking-table-wrap { width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.54); }
    .ranking-table { width:100%; min-width:680px; border-collapse:collapse; font-size:12.5px; }
    .ranking-table th,.ranking-table td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    .ranking-table th { color:var(--ink); background:rgba(208,95,63,.08); font-weight:700; }
    .ranking-table td:first-child,.ranking-table th:first-child { text-align:right; }
    .ranking-table tbody tr:last-child td { border-bottom:0; }
    .empty { display:none; padding:48px; border:1px dashed var(--line-strong); color:var(--muted); text-align:center; background:var(--glass); border-radius:18px; }
    .empty.visible { display:block; }

    /* Drawer */
    .overlay { position:fixed; inset:0; display:none; background:rgba(26,36,54,.3); backdrop-filter:blur(3px); }
    .overlay.open { display:block; }
    .drawer { position:fixed; top:0; right:0; width:min(440px,100vw); height:100vh; transform:translateX(100%); transition:.22s cubic-bezier(.4,0,.2,1); background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border-left:1px solid var(--glass-border); box-shadow:-18px 0 44px rgba(31,45,75,.16); padding:24px; overflow:auto; }
    .drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:8px; }
    .drawer h2 { font-size:17px; line-height:1.4; }
    #drawerNote { color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .source-card { border:1px solid var(--glass-border); padding:13px 15px; margin-top:10px; border-radius:12px; background:rgba(255,255,255,.55); }
    .source-card strong { font-size:13px; color:var(--ink); }
    .source-url { display:block; margin-top:6px; color:var(--accent); overflow-wrap:anywhere; user-select:text; font-size:12.5px; text-decoration:none; }
    a.source-url:hover { text-decoration:underline; }
    a.source-url:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

    @media (max-width:900px) {
      .app { grid-template-columns:1fr; }
      aside.sidebar { position:relative; height:auto; }
      .nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
      main { padding:22px 18px 36px; }
      .topbar,.section-head { align-items:stretch; flex-direction:column; }
      .search { width:100%; }
      .metrics,.grid { grid-template-columns:1fr; }
      .section-banner { flex-wrap:wrap; }
      .section-banner .banner-desc { margin-left:0; width:100%; }
    }
    @media print {
      body::before { display:none; }
      aside.sidebar,.actions,.toggle,.source-btn,.drawer,.overlay { display:none!important; }
      .app { display:block; }
      main { padding:0; }
      .item { break-inside:avoid; box-shadow:none; border-color:#bbb; backdrop-filter:none; background:#fff; }
      .section-banner { break-after:avoid; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <a class="back-home" href="../../" aria-label="返回情报站首页">← 返回首页</a>
      <div class="brand" aria-label="沐瞳科技">
        <div class="brand-mark" aria-hidden="true"><img src="../../assets/moonton_logo.png" alt=""></div>
        <div><strong>游戏行业情报站</strong><span>AI 生成 · 每周更新</span></div>
      </div>
      <div class="nav-title">Sections</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="made">Made by 沐瞳科技战略团队</div>
        <div>有问题请联系 <a href="mailto:leelootang@moonton.com">leelootang@moonton.com</a></div>
        <div class="stat">2026-10-23 ~ 2026-10-29 · 71 条动态</div>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <div><h1>游戏行业周报</h1><div class="subtitle">2026-10-23 ~ 2026-10-29 · 行业新闻、AI、产品日历、玩家舆论与精选观察</div></div>
        <div class="actions">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" title="折叠 / 展开侧栏" aria-label="切换侧栏">
            <span class="icon-open">«</span><span class="icon-close">»</span>
          </button>
          <label class="search">⌕<input id="search" type="search" placeholder="搜索条目、公司、产品"></label>

  </div>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="来源详情">
    <div class="drawer-head"><h2 id="drawerTitle"></h2><button class="icon-btn" id="closeDrawer" type="button">×</button></div>
    <p id="drawerNote"></p>
    <div id="sourceList"></div>
  </aside>

    const sections = [{"id": "all", "label": "全部", "desc": "浏览全部内容，或从左侧选择单个板块。"}, {"id": "industry", "label": "行业新闻", "desc": "公司、产品、市场与资本动作。"}, {"id": "ai", "label": "AI 新闻", "desc": "游戏相关的 AI 与开发工具。"}, {"id": "release", "label": "产品日历", "desc": "上线、测试、新版本与重点节点。"}, {"id": "discourse", "label": "玩家舆论", "desc": "社区热点、争议与玩家情绪。"}, {"id": "deep", "label": "深度观察", "desc": "值得内部团队继续跟踪的结构性变化。"}];
    const items = [{"section": "industry", "title": "米哈游《星布谷地》三测开放付费，月卡、季卡与外观抽取分层", "body": "《星布谷地》三测开放付费后，米哈游展示了生活模拟产品的分层商业化安排。测试中，一期季节活动以90天为周期，68元基础季卡主要交付固定服饰与家具，18元月卡面向长期抽取资源积累。服饰池和家具池承接不同深度的收集需求；这些仍是测试规则，尚不能等同于最终上线方案。", "body_html": "<p>《星布谷地》三测开放付费后，米哈游展示了生活模拟产品的分层商业化安排。测试中，一期季节活动以90天为周期，68元基础季卡主要交付固定服饰与家具，18元月卡面向长期抽取资源积累。服饰池和家具池承接不同深度的收集需求；这些仍是测试规则，尚不能等同于最终上线方案。</p>", "meta": ["星布谷地", "米哈游", "生活模拟"], "sources": [["S0901", "年度最卷赛道，腾网米莉到底怎么赚大钱", "https://cgames.com/contents/2/13238.html"]]}, {"section": "industry", "title": "灵犀《篮球少女：飞跃巅峰》开服三天后进入游戏畅销榜第4", "body": "据游戏葡萄报道，灵犀的《篮球少女：飞跃巅峰》开服三天后登上App Store游戏畅销榜第4。产品将篮球题材、少女角色与局内随机养成结合，局外成长又持续影响训练收益，并设置异步PVP竞技场与PVE验证玩法。报道同时指出，单局约20分钟、每日多轮培养的时间负担，仍是长线体验需要面对的问题。", "body_html": "<p>据游戏葡萄报道，灵犀的《篮球少女：飞跃巅峰》开服三天后登上App Store游戏畅销榜第4。产品将篮球题材、少女角色与局内随机养成结合，局外成长又持续影响训练收益，并设置异步PVP竞技场与PVE验证玩法。报道同时指出，单局约20分钟、每日多轮培养的时间负担，仍是长线体验需要面对的问题。</p>", "meta": ["篮球少女：飞跃巅峰", "灵犀", "畅销榜"], "sources": [["S0909", "爆冷登上畅销榜Top4：2026最鸡贼的新游，把两个品类都干沉默了", "https://m.sohu.com/a/1093553849_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.2.1793145934902b2g2z94"]]}, {"section": "industry", "title": "《Marathon》2月压力测试回顾：Steam峰值在线约14万，后续参与度回落", "body": "Bungie新作《Marathon》于2月27日开启免费服务器压力测试。本期文章回顾，Steam测试初期同时在线峰值约14万，预售曾进入Steam畅销榜前三；第二、第三天的同时在线规模随后明显回落。 文章把资源控制与交火作为搜打撤体验的重点，同时记录玩家对界面和单人体验的不同看法。这是早期免费测试表现，不能据此推定正式发售后的销量或留存。", "body_html": "<p>Bungie新作《Marathon》于2月27日开启免费服务器压力测试。本期文章回顾，Steam测试初期同时在线峰值约14万，预售曾进入Steam畅销榜前三；第二、第三天的同时在线规模随后明显回落。</p><p>文章把资源控制与交火作为搜打撤体验的重点，同时记录玩家对界面和单人体验的不同看法。这是早期免费测试表现，不能据此推定正式发售后的销量或留存。</p>", "meta": ["Marathon", "搜打撤", "畅销榜"], "sources": [["S0119", "Entre os três mais vendidos do Steam, com 150 mil jogadores online durante a fase de testes, mas este novo jogo AAA da Search & Strike está a caminhar sobre gelo fino.", "https://youxichaguan.com/pt/archives/214706"]]}, {"section": "industry", "title": "吉比特披露代号M98已立项并确定制作人", "body": "吉比特10月23日业绩说明会披露，代号M98已正式立项并确定制作人。据介绍，制作人从项目初期就有独立想法，并非简单承接管理层构想。卢竑岩表示，公司不倾向以内部赛马决定团队淘汰，同一领域可以允许不同制作人并行探索，再各自接受市场检验。", "body_html": "<p>吉比特10月23日业绩说明会披露，代号M98已正式立项并确定制作人。据介绍，制作人从项目初期就有独立想法，并非简单承接管理层构想。卢竑岩表示，公司不倾向以内部赛马决定团队淘汰，同一领域可以允许不同制作人并行探索，再各自接受市场检验。</p>", "meta": [], "sources": [["S0039", "《杖剑传说》16个月流水破48亿元，卢竑岩：我们不赛马，只养马群​", "https://www.youxituoluo.com/534990.html"]]}, {"section": "industry", "title": "雷霆游戏投资上海火因山风网络，持股约30%", "body": "据游戏新知10月26日报道，雷霆游戏近日投资上海火因山风网络，持股约30%。该公司成立于2024年10月，报道援引企查查信息称，其名下已有6款软件著作权。报道列出的大股东为田佳佳；关于其是否为前阿哇龙COO，报道仍使用“疑似”措辞。", "body_html": "<p>据游戏新知10月26日报道，雷霆游戏近日投资上海火因山风网络，持股约30%。该公司成立于2024年10月，报道援引企查查信息称，其名下已有6款软件著作权。报道列出的大股东为田佳佳；关于其是否为前阿哇龙COO，报道仍使用“疑似”措辞。</p>", "meta": [], "sources": [["S0757", "雷霆游戏投资一家上海游戏公司，疑似前阿哇龙COO创业？", "https://new.qq.com/rain/a/20261026A0BKBT00"]]}, {"section": "industry", "title": "《蔚蓝档案》日服将于2027年1月转交NEXON运营", "body": "悠星日本社长李衡达在10月25日特别视频中宣布，自2027年1月起，《蔚蓝档案》日本地区发行与运营将由悠星移交开发商NEXON。报道指出，调整合作的意向约在一年前由NEXON提出，双方经过长期协商后确定移交。此次变更仅涉及日本地区，国服不受影响。", "body_html": "<p>悠星日本社长李衡达在10月25日特别视频中宣布，自2027年1月起，《蔚蓝档案》日本地区发行与运营将由悠星移交开发商NEXON。报道指出，调整合作的意向约在一年前由NEXON提出，双方经过长期协商后确定移交。此次变更仅涉及日本地区，国服不受影响。</p>", "meta": ["蔚蓝档案"], "sources": [["S0904", "上线5年，千亿流水，上海头部二游发行权被放弃了", "https://cgames.com/contents/2/13253.html"]]}, {"section": "industry", "title": "Xbox首任首席运营官Helen Chiang任职三个月后离职", "body": "Game Developer援引内部备忘录报道，Xbox首任首席运营官Helen Chiang已离开微软，距离该职位设立约三个月。她此前在微软工作21年，曾长期负责Minecraft，出任COO后承担端到端盈亏职责并向Asha Sharma汇报。报道指公司当时尚未确定继任安排，离职原因没有得到微软确认。", "body_html": "<p>Game Developer援引内部备忘录报道，Xbox首任首席运营官Helen Chiang已离开微软，距离该职位设立约三个月。她此前在微软工作21年，曾长期负责Minecraft，出任COO后承担端到端盈亏职责并向Asha Sharma汇报。报道指公司当时尚未确定继任安排，离职原因没有得到微软确认。</p>", "meta": [], "sources": [["S0942", "Xbox's first-ever COO is out after just three months", "https://www.gamedeveloper.com/console/xbox-coo-helen-chiang-leaves-role-shortly-after-its-creation"]]}, {"section": "industry", "title": "据报Xbox拒绝Netflix的5亿美元影视改编提案", "body": "Game Developer援引Puck报道，Netflix曾提出以5亿美元取得Xbox旗下IP七年的影视独家改编权。报道指Xbox希望将价格提高到8亿美元，Netflix随后退出谈判；这是一项未达成的提案。双方仍有其他改编项目合作，因此该报道并不意味着两家公司终止全部合作。", "body_html": "<p>Game Developer援引Puck报道，Netflix曾提出以5亿美元取得Xbox旗下IP七年的影视独家改编权。报道指Xbox希望将价格提高到8亿美元，Netflix随后退出谈判；这是一项未达成的提案。双方仍有其他改编项目合作，因此该报道并不意味着两家公司终止全部合作。</p>", "meta": [], "sources": [["S0943", "Xbox reportedly turned down a $500 million deal from Netflix to adapt its video game properties", "https://www.gamedeveloper.com/business/xbox-reportedly-turned-down-a-500-million-deal-from-netflix-for-adapting-gaming-properties"]]}, {"section": "industry", "title": "《宝可梦大集结》制作人杨思勤已转岗腾讯魔方", "body": "游戏新知报道，《宝可梦大集结》制作人杨思勤已转岗至腾讯魔方工作室群。他曾参与《元梦之星》大世界捉宠模式与《合金弹头：觉醒》开发，并在《魂斗罗：归来》担任助理制作人。", "body_html": "<p>游戏新知报道，《宝可梦大集结》制作人杨思勤已转岗至腾讯魔方工作室群。他曾参与《元梦之星》大世界捉宠模式与《合金弹头：觉醒》开发，并在《魂斗罗：归来》担任助理制作人。</p>", "meta": ["宝可梦大集结", "元梦之星", "腾讯"], "sources": [["S1249", "天美《宝可梦大集结》官宣停运，制作人已转岗至魔方工作室群", "https://new.qq.com/rain/a/20261028A0BKC000"]]}, {"section": "industry", "title": "Dan Ayoub升任威世智与孩之宝数字游戏负责人", "body": "Dan Ayoub从数字游戏高级副总裁升任Wizards of the Coast与Hasbro Digital Games负责人，接替7月离职的John Hight，职责覆盖《万智牌》《龙与地下城》《Duel Masters》及数字游戏。他将统筹在研科幻RPG《Exodus》和动作冒险游戏《Warlock: Dungeons and Dragons》。孩之宝称，他是首位内部晋升至该职位的人选。", "body_html": "<p>Dan Ayoub从数字游戏高级副总裁升任Wizards of the Coast与Hasbro Digital Games负责人，接替7月离职的John Hight，职责覆盖《万智牌》《龙与地下城》《Duel Masters》及数字游戏。他将统筹在研科幻RPG《Exodus》和动作冒险游戏《Warlock: Dungeons and Dragons》。孩之宝称，他是首位内部晋升至该职位的人选。</p>", "meta": ["万智牌", "龙与地下城"], "sources": [["S1328", "Former Halo boss is now in charge of Wizards of the Coast and Hasbro Digital Games", "https://www.pcgamer.com/gaming-industry/former-halo-boss-is-now-in-charge-of-wizards-of-the-coast-and-hasbro-digital-games/"]]}, {"section": "industry", "title": "前《Moore Manor》制作人加入网易《Eggy Party》团队，负责副玩法内容", "body": "本期报道回顾，前《Moore Manor》制作人、Qutang Network创始人Zheng Zhouri已于报道所述上月加入网易杭州《Eggy Party》项目组，负责副玩法内容。原文未给入职绝对日期，不能按采集日倒推月份。Qutang曾获FunPlus支持，其后进入破产清算；管理人正公开遴选资产评估机构，评估以游戏为主的无形资产。", "body_html": "<p>本期报道回顾，前《Moore Manor》制作人、Qutang Network创始人Zheng Zhouri已于报道所述上月加入网易杭州《Eggy Party》项目组，负责副玩法内容。原文未给入职绝对日期，不能按采集日倒推月份。Qutang曾获FunPlus支持，其后进入破产清算；管理人正公开遴选资产评估机构，评估以游戏为主的无形资产。</p>", "meta": ["Moore Manor", "Eggy Party", "网易"], "sources": [["S0658", "Tras el fracaso de «Mim», el antiguo productor de «Moore Manor» se ha incorporado al equipo de «Danzai» de NetEase.", "https://youxichaguan.com/es/archives/215425"]]}, {"section": "industry", "title": "腾讯魔方3月《Roco Kingdom》试玩回顾：围绕收集、培养与战斗构建开放世界", "body": "本期文章回顾，腾讯魔方开发的《Roco Kingdom》于3月12日开启为期三天的线下试玩，当时公布的全平台上线日为3月26日，预约量超过5000万。这里描述的是3月测试阶段，不能当作本周开测。 试玩把精灵收集、培养、战斗与开放世界探索结合，强调精灵作为冒险伙伴的关系。与本期另一篇2027年西方发行规划相比，这条材料对应的是较早的产品验证阶段。", "body_html": "<p>本期文章回顾，腾讯魔方开发的《Roco Kingdom》于3月12日开启为期三天的线下试玩，当时公布的全平台上线日为3月26日，预约量超过5000万。这里描述的是3月测试阶段，不能当作本周开测。</p><p>试玩把精灵收集、培养、战斗与开放世界探索结合，强调精灵作为冒险伙伴的关系。与本期另一篇2027年西方发行规划相比，这条材料对应的是较早的产品验证阶段。</p>", "meta": ["Roco Kingdom", "腾讯", "King"], "sources": [["S0715", "Con una base de 350 millones de usuarios, pero sin querer «ganar dinero rápido», este producto de Tencent pretende redefinir el futuro de su categoría.", "https://youxichaguan.com/es/archives/215215"]]}, {"section": "industry", "title": "Xbox在3月公开下一代主机代号Project Helix，计划兼容PC游戏", "body": "本期转载的3月10日报道称，Xbox负责人Asha Sharma公开了下一代主机代号Project Helix，计划同时运行Xbox游戏并原生兼容PC游戏。这个项目当时仍在开发，不能把兼容目标当作已交付能力。 报道中的双系统、模块化硬件等细节属于分析者推测，尚无完整技术披露。相比此前单纯销售主机的边界，该项目提出了连接PC与主机游戏库的方向，但落地规格与商业模式仍待正式确认。", "body_html": "<p>本期转载的3月10日报道称，Xbox负责人Asha Sharma公开了下一代主机代号Project Helix，计划同时运行Xbox游戏并原生兼容PC游戏。这个项目当时仍在开发，不能把兼容目标当作已交付能力。</p><p>报道中的双系统、模块化硬件等细节属于分析者推测，尚无完整技术披露。相比此前单纯销售主机的边界，该项目提出了连接PC与主机游戏库的方向，但落地规格与商业模式仍待正式确认。</p>", "meta": [], "sources": [["S0727", "Microsoft presenta «Project Helix», una revolucionaria consola de videojuegos que romperá las barreras entre el PC y las consolas", "https://youxichaguan.com/es/archives/215151"]]}, {"section": "industry", "title": "网易《遗忘之海》2月测试回顾：以海上探索和多种小游戏扩展开放世界", "body": "本期转载回顾，网易Joker团队的《遗忘之海》于2月5日开启新一轮测试。文章记录，游戏以风格化木偶角色、海上探索和多种小游戏呈现开放世界，而非只延续单一战斗循环。 测试体验包括海上巨型怪物、区域解谜与多样任务，作者据此讨论玩法组合的方向。这是2月开发验证阶段的记录，不能取代后续正式发行后的运营数据。", "body_html": "<p>本期转载回顾，网易Joker团队的《遗忘之海》于2月5日开启新一轮测试。文章记录，游戏以风格化木偶角色、海上探索和多种小游戏呈现开放世界，而非只延续单一战斗循环。</p><p>测试体验包括海上巨型怪物、区域解谜与多样任务，作者据此讨论玩法组合的方向。这是2月开发验证阶段的记录，不能取代后续正式发行后的运营数据。</p>", "meta": ["遗忘之海", "网易", "小游戏"], "sources": [["S0222", "Depois de ter sido o grande destaque no final do ano passado, «O Mar Esquecido» traz desta vez mais do que apenas surpresas", "https://youxichaguan.com/pt/archives/214562"]]}, {"section": "industry", "title": "腾讯发行的《Kaeth's Dream》3月二测回顾：把卡组构筑与角色养成结合", "body": "本期报道回顾，腾讯发行、Smilegate旗下SUPER CREATIVE开发的手游《Kaeth's Dream》于3月11日启动第二轮付费测试，当时海外版本已在运营。其设计通过保存roguelike对局成果，把局内构筑与后续角色战斗相连，并结合资源管理、路线选择及队伍配置；这些设计尚不能证明国内长期商业成功。", "body_html": "<p>本期报道回顾，腾讯发行、Smilegate旗下SUPER CREATIVE开发的手游《Kaeth's Dream》于3月11日启动第二轮付费测试，当时海外版本已在运营。其设计通过保存roguelike对局成果，把局内构筑与后续角色战斗相连，并结合资源管理、路线选择及队伍配置；这些设计尚不能证明国内长期商业成功。</p>", "meta": ["腾讯"], "sources": [["S0657", "El nuevo juego de Tencent dedicado al mundo del anime: ¿por qué se trata de un juego de cartas?", "https://youxichaguan.com/es/archives/215183"]]}, {"section": "industry", "title": "天美三款王者IP产品同时占据iOS免费榜前三", "body": "据游戏葡萄10月25日报道，三款王者IP产品在前一日同时占据iOS免费榜前三，形成同一IP产品矩阵集中进入榜单头部的局面。在同期周年共创之夜，天美还披露了新英雄、两部衍生番剧，以及《王者荣耀：世界》《王者万象棋》等产品动态。本次变化体现为王者IP多产品同时获得用户关注；周年内容更新与衍生企划共同构成其IP扩展背景。", "body_html": "<p>据游戏葡萄10月25日报道，三款王者IP产品在前一日同时占据iOS免费榜前三，形成同一IP产品矩阵集中进入榜单头部的局面。在同期周年共创之夜，天美还披露了新英雄、两部衍生番剧，以及《王者荣耀：世界》《王者万象棋》等产品动态。本次变化体现为王者IP多产品同时获得用户关注；周年内容更新与衍生企划共同构成其IP扩展背景。</p>", "meta": ["王者荣耀：世界", "王者万象棋"], "sources": [["S0529", "天美三王史无前例包揽Top 3：国民游戏还是太懂了", "https://m.sohu.com/a/1092587377_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.1.17929729179434zs8r11"]]}, {"section": "industry", "title": "《宝可梦大集结》公布停运安排，国际服将于2027年3月关闭", "body": "由宝可梦公司与天美工作室群共同研发的《宝可梦大集结》公布停运安排：国际服的Switch与手机版将于2027年3月23日停止服务，国服公告则定于2027年1月停运。国际服自10月27日起停止出售亿奥斯宝石，并暂停新会员及自动续订；已有宝石可在停服前使用。停止服务器后，玩家将不能登录或参加对战。", "body_html": "<p>由宝可梦公司与天美工作室群共同研发的《宝可梦大集结》公布停运安排：国际服的Switch与手机版将于2027年3月23日停止服务，国服公告则定于2027年1月停运。国际服自10月27日起停止出售亿奥斯宝石，并暂停新会员及自动续订；已有宝石可在停服前使用。停止服务器后，玩家将不能登录或参加对战。</p>", "meta": ["宝可梦大集结", "停服"], "sources": [["S0906", "《宝可梦大集结》官宣将停运，世界第一IP也做不好MOBA？", "https://m.sohu.com/a/1093431195_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.3.1793145934902b2g2z94"], ["S0929", "TiMi Studio Group's Pokémon Unite to shut down on March 23, 2027", "https://www.gamesindustry.biz/timi-studio-groups-pokemon-unite-to-shut-down-on-march-23-2027"], ["S0959", "Pokemon Unite Is Shutting Down After Nearly Six Years", "https://www.gamespot.com/articles/pokemon-unite-is-shutting-down-after-nearly-six-years/"]]}, {"section": "industry", "title": "微软确认《Call of Duty》系列累计收入超过400亿美元", "body": "Xbox负责人Asha Sharma确认，《Call of Duty》系列累计收入超过400亿美元。其在10月23日《Modern Warfare 4》发售后披露这一里程碑，但未说明新作销售情况，也未确认是否由新作直接推动跨过该门槛。 该系列于2003年推出，此后扩展到移动端与《Warzone》等产品。系列累计收入不能当作《Modern Warfare 4》的收入，更不能据此计算单款利润。", "body_html": "<p>Xbox负责人Asha Sharma确认，《Call of Duty》系列累计收入超过400亿美元。其在10月23日《Modern Warfare 4》发售后披露这一里程碑，但未说明新作销售情况，也未确认是否由新作直接推动跨过该门槛。</p><p>该系列于2003年推出，此后扩展到移动端与《Warzone》等产品。系列累计收入不能当作《Modern Warfare 4》的收入，更不能据此计算单款利润。</p>", "meta": ["Call of Duty", "Warzone"], "sources": [["S0960", "Call Of Duty Lifetime Revenue Surges Past $40 Billion, Microsoft Confirms", "https://www.gamespot.com/articles/call-of-duty-lifetime-revenue-surges-past-40-billion-microsoft-confirms/"]]}, {"section": "industry", "title": "《王者荣耀：世界》3月定档回顾：PC版4月10日上线，公布两种PVP模式", "body": "本期转载回顾，《王者荣耀：世界》在3月20日发布会上宣布，PC版定于4月10日上线，移动版随后推出。发布会同时介绍上线英雄、成长系统与商业化方式。 官方当时公布的PVP包括1对1与4对4模式，前者允许组合两种英雄共鸣，后者围绕多人护送与拦截展开。外观销售被确认为主要商业化方式；这些是发布会阶段的产品设计与档期信息。", "body_html": "<p>本期转载回顾，《王者荣耀：世界》在3月20日发布会上宣布，PC版定于4月10日上线，移动版随后推出。发布会同时介绍上线英雄、成长系统与商业化方式。</p><p>官方当时公布的PVP包括1对1与4对4模式，前者允许组合两种英雄共鸣，后者围绕多人护送与拦截展开。外观销售被确认为主要商业化方式；这些是发布会阶段的产品设计与档期信息。</p>", "meta": ["王者荣耀：世界"], "sources": [["S0680", "『왕자영예 월드』 PC 버전, 4월 10일 출시 확정… 텐센트의 가장 “야심 찬” 비장의 카드", "https://youxichaguan.com/ko/archives/215399"], ["S0677", "O lançamento da versão para PC de «Honor of Kings World» está marcado para 10 de abril: o trunfo mais «ambicioso» da Tencent", "https://youxichaguan.com/pt/archives/215395"]]}, {"section": "industry", "title": "三七互娱《Last Asylum: Plague》首月收入回顾：估算超过2500万元", "body": "本期文章回顾，三七互娱《Last Asylum: Plague》于2月11日上线，首月收入估算超过2500万元，报道时累计收入接近3000万元，数据来自点点出海。 这款休闲SLG以欧洲黑死病和瘟疫医生为题材，在模拟经营、策略成长的框架内寻求视觉差异。这里保留上线首月的人民币口径，与此前8月榜单的美元收入及环比指标分别理解。", "body_html": "<p>本期文章回顾，三七互娱《Last Asylum: Plague》于2月11日上线，首月收入估算超过2500万元，报道时累计收入接近3000万元，数据来自点点出海。</p><p>这款休闲SLG以欧洲黑死病和瘟疫医生为题材，在模拟经营、策略成长的框架内寻求视觉差异。这里保留上线首月的人民币口径，与此前8月榜单的美元收入及环比指标分别理解。</p>", "meta": ["三七互娱", "点点", "模拟经营"], "sources": [["S0694", "Lucro astronómico de 25 milhões no primeiro mês após o lançamento: será que o sucesso do início do ano é mais um SLG?", "https://youxichaguan.com/pt/archives/215411"]]}, {"section": "industry", "title": "Shiyue Network复盘《Dream Guardians》3月上线，强化阵容与局内构筑", "body": "游戏茶馆当期译稿回顾，Shiyue Network的《Dream Guardians》于3月17日上线；据文中引用的点点数据，截至3月29日，iOS累计下载约360万次、收入超过1300万元。产品削减前作的随机召唤与融合设计，转向固定英雄阵容和技能模块搭配，并提供PvP对战。上述数据属于3月的早期表现。", "body_html": "<p>游戏茶馆当期译稿回顾，Shiyue Network的《Dream Guardians》于3月17日上线；据文中引用的点点数据，截至3月29日，iOS累计下载约360万次、收入超过1300万元。产品削减前作的随机召唤与融合设计，转向固定英雄阵容和技能模块搭配，并提供PvP对战。上述数据属于3月的早期表现。</p>", "meta": ["点点"], "sources": [["S1148", "After its previous title surpassed 400 million in revenue, has this Guangzhou-based company created a new hit using the same old formula?", "https://youxichaguan.com/en/archives/216144"], ["S1149", "前作が4億を突破した後、この広州の企業は定番の手法で新たなヒット作を生み出したのか？", "https://youxichaguan.com/ja/archives/216146"], ["S1150", "Tras superar los 400 millones en la entrega anterior, ¿esta empresa de Guangzhou ha conseguido un nuevo éxito con la misma fórmula de siempre?", "https://youxichaguan.com/es/archives/216148"], ["S1151", "Depois de o jogo anterior ter ultrapassado os 400 milhões, será que esta empresa de Guangzhou conseguiu criar um novo sucesso com a mesma fórmula de sempre?", "https://youxichaguan.com/pt/archives/216150"], ["S1152", "Nachdem der Vorgänger 400 Millionen umgesetzt hatte: Hat dieses Unternehmen aus Guangzhou mit altbewährten Methoden einen neuen Hit gelandet?", "https://youxichaguan.com/de/archives/216152"], ["S1153", "전작이 4억을 돌파한 후, 이 광저우 기업은 익숙한 전략으로 새로운 히트작을 만들어 냈을까?", "https://youxichaguan.com/ko/archives/216154"]]}, {"section": "industry", "title": "微软将Arkane Lyon寻找买家的协商期延长一个月", "body": "微软将Arkane Lyon寻找买家的协商期再延长一个月，并探索寻找合作方，支持工作室完成《漫威刀锋战士》的后续开发。此前报道的原截止日为11月13日；微软强调此次延期有明确期限，并承诺持续向职工委员会通报进展。工作室217名员工的去向仍与谈判结果相关。", "body_html": "<p>微软将Arkane Lyon寻找买家的协商期再延长一个月，并探索寻找合作方，支持工作室完成《漫威刀锋战士》的后续开发。此前报道的原截止日为11月13日；微软强调此次延期有明确期限，并承诺持续向职工委员会通报进展。工作室217名员工的去向仍与谈判结果相关。</p>", "meta": ["漫威刀锋战士"], "sources": [["S0761", "Microsoft extends consultation period for Arkane Lyon as it continues development on Marvel's Blade", "https://www.gamesindustry.biz/microsoft-extends-consultation-period-for-arkane-lyon-as-it-continues-development-on-marvels-blade"], ["S0969", "微软为《漫威刀锋战士》寻合作方，协商时间再延长一个月", "https://www.ign.com.cn/man-wei-dao-feng-zhan-shi/63633/wei-ruan-wei-man-wei-dao-feng-zhan-shi-xun-he-zuo-fang-xie-shang-shi-jian-zai-yan-chang-yi-ge-yue"]]}, {"section": "industry", "title": "腾讯魔方筹划《Roco Kingdom》2027年西方市场发行", "body": "Mobilegamer本期报道提到，腾讯旗下魔方工作室的《Roco Kingdom》此前已在科隆游戏展面向西方市场亮相，团队正筹划2027年发行。报道将其与该工作室的《Arena Breakout: Infinite》并列介绍；当前材料没有给出具体上线日期。", "body_html": "<p>Mobilegamer本期报道提到，腾讯旗下魔方工作室的《Roco Kingdom》此前已在科隆游戏展面向西方市场亮相，团队正筹划2027年发行。报道将其与该工作室的《Arena Breakout: Infinite》并列介绍；当前材料没有给出具体上线日期。</p>", "meta": ["Roco Kingdom", "腾讯", "King"], "sources": [["S0947", "Tencent-owned Morefun wants to make Roco Kingdom a Pokémon-sized hit in the west", "https://mobilegamer.biz/tencent-owned-morefun-wants-to-make-roco-kingdom-a-pokemon-sized-hit-in-the-west/"]]}, {"section": "industry", "title": "9月手游出海榜呈现多产品竞争，点点互动包揽收入榜第2至4名", "body": "Sensor Tower的2026年9月中国手游出海榜显示，点点互动三款产品包揽收入榜第2至4名，《Tasty Travels》截至发稿的累计海外收入估算已超过4.5亿美元。增长榜方面，益世界《疯狂水世界》位居首位；《Bus Fever Party!》当月超过1500万次下载，环比增长330%。收入榜按应用商店内购预估，不含广告变现、中国大陆地区及第三方安卓渠道。", "body_html": "<p>Sensor Tower的2026年9月中国手游出海榜显示，点点互动三款产品包揽收入榜第2至4名，《Tasty Travels》截至发稿的累计海外收入估算已超过4.5亿美元。增长榜方面，益世界《疯狂水世界》位居首位；《Bus Fever Party!》当月超过1500万次下载，环比增长330%。收入榜按应用商店内购预估，不含广告变现、中国大陆地区及第三方安卓渠道。</p>", "meta": ["疯狂水世界", "点点", "市场数据"], "sources": [["S0912", "出海榜：点点《Tasty Travels》累计破30亿，益世界《疯狂水世界》领跑增长榜", "https://www.youxituoluo.com/534998.html"], ["S1086", "2026年9月成功出海的中国手游", "https://sensortower.com/zh-CN/blog/2026-9-tasty-travels"]]}, {"section": "industry", "title": "QuestMobile：手机游戏占抖音小程序分类数量60%", "body": "QuestMobile秋季全景生态报告摘要显示，抖音小程序中手机游戏与移动视频的数量占比分别为60.0%和22.0%。同一摘要称，截至2026年8月，中国移动互联网月活用户规模为12.78亿，同比增长0.9%。前一组衡量小程序供给分类，后一组衡量全移动互联网用户规模，二者不能混算为游戏渗透率。", "body_html": "<p>QuestMobile秋季全景生态报告摘要显示，抖音小程序中手机游戏与移动视频的数量占比分别为60.0%和22.0%。同一摘要称，截至2026年8月，中国移动互联网月活用户规模为12.78亿，同比增长0.9%。前一组衡量小程序供给分类，后一组衡量全移动互联网用户规模，二者不能混算为游戏渗透率。</p>", "meta": [], "sources": [["S1085", "QuestMobile 2026全景生态流量秋季报告：AI时代流量逻辑变革已至，多场景、全链路闭环形成，以意图为锚点的跨端续接和跨场景交付模式形成", "https://www.questmobile.com.cn/research/report/2114988800581107713"]]}, {"section": "industry", "title": "7月收入回顾：中国38家手游发行商占全球百强收入42.6%", "body": "Sensor Tower的2026年7月发行商收入回顾显示，当月38个中国厂商进入全球手游发行商收入前100，合计收入预估23亿美元，占百强42.6%。该口径覆盖App Store与Google Play，不含第三方安卓商店，中国大陆只计iOS。上述数字对应7月统计期，与9月榜单分别陈述。", "body_html": "<p>Sensor Tower的2026年7月发行商收入回顾显示，当月38个中国厂商进入全球手游发行商收入前100，合计收入预估23亿美元，占百强42.6%。该口径覆盖App Store与Google Play，不含第三方安卓商店，中国大陆只计iOS。上述数字对应7月统计期，与9月榜单分别陈述。</p>", "meta": ["市场数据"], "sources": [["S1087", "2026年7月中国手游发行商全球收入排行榜", "https://sensortower.com/zh-CN/blog/2026-7-top-30"]]}, {"section": "industry", "title": "据报《寂静岭》初代重制版以2027年发售为目标", "body": "科乐美与Bloober Team去年已确认重制初代《寂静岭》。据IGN中文转述MP1ST爆料，该项目自2022年起开发，以2027年发售为目标，选角代号为“Project Noise”。这些开发时间和目标档期来自报道，尚不能写成官方正式定档。", "body_html": "<p>科乐美与Bloober Team去年已确认重制初代《寂静岭》。据IGN中文转述MP1ST爆料，该项目自2022年起开发，以2027年发售为目标，选角代号为“Project Noise”。这些开发时间和目标档期来自报道，尚不能写成官方正式定档。</p>", "meta": ["寂静岭"], "sources": [["S1295", "曝《寂静岭》重制版拟于2027年发售", "https://www.ign.com.cn/jjlgame/63662/pu-ji-jing-ling-zhong-zhi-ban-ni-yu-2027nian-fa-shou"]]}, {"section": "industry", "title": "Discord拟于12月中旬开放部分公共服务器消息的网页搜索", "body": "Discord计划从12月中旬起，让指定“Discoverable Servers”频道中的问答出现在网页搜索中，涉及至少1000名用户的部分大型公共服务器。管理员可退出或限定可搜索频道，用户也可在隐私设置中退出；用户名与头像不会随消息显示。邀请制服务器和私信不在此次调整范围内，相关控制设置已开放。", "body_html": "<p>Discord计划从12月中旬起，让指定“Discoverable Servers”频道中的问答出现在网页搜索中，涉及至少1000名用户的部分大型公共服务器。管理员可退出或限定可搜索频道，用户也可在隐私设置中退出；用户名与头像不会随消息显示。邀请制服务器和私信不在此次调整范围内，相关控制设置已开放。</p>", "meta": [], "sources": [["S1330", "Messages in certain large public Discord servers will be searchable on the web after December", "https://www.pcgamer.com/software/platforms/messages-in-certain-large-public-discord-servers-will-be-searchable-on-the-web-after-december/"]]}, {"section": "industry", "title": "据报澳大利亚法院要求《堡垒之夜》重返当地iOS商店", "body": "GameDiscoverCo当期简报记载，澳大利亚法院已要求《堡垒之夜》重新进入当地iOS App Store。该信息描述的是法院要求，不能等同于游戏已完成重新上架。", "body_html": "<p>GameDiscoverCo当期简报记载，澳大利亚法院已要求《堡垒之夜》重新进入当地iOS App Store。该信息描述的是法院要求，不能等同于游戏已完成重新上架。</p>", "meta": ["堡垒之夜"], "sources": [["S1435", "Who ‘won’ October 2026’s Steam Next Fest?", "https://newsletter.gamediscover.co/p/who-won-october-2026s-steam-next"]]}, {"section": "industry", "title": "暴雪回顾《Project Titan》取消：七年研发后以六周重提新方案", "body": "暴雪回顾《守望先锋》的起点：MMO项目《Project Titan》在研发七年后被取消，团队随后只有六周提出新方案。Keller认为，这段经历从一开始就让团队形成谦逊与韧性，并延续到《守望先锋》十年的运营中。这是对历史项目取舍与组织经验的复盘。", "body_html": "<p>暴雪回顾《守望先锋》的起点：MMO项目《Project Titan》在研发七年后被取消，团队随后只有六周提出新方案。Keller认为，这段经历从一开始就让团队形成谦逊与韧性，并延续到《守望先锋》十年的运营中。这是对历史项目取舍与组织经验的复盘。</p>", "meta": ["守望先锋"], "sources": [["S1333", "Project Titan's end 'immediately instilled a culture of humility' in the Overwatch team which has helped them see the last decade through", "https://www.pcgamer.com/games/fps/project-titans-end-immediately-instilled-a-culture-of-humility-in-the-overwatch-team-which-has-helped-them-see-the-last-decade-through/"]]}, {"section": "industry", "title": "莉莉丝《塔塔冒险队》累计下载超1800万次，双平台收入估算超9500万美元", "body": "据罗斯基引用点点数据，莉莉丝《塔塔冒险队》自5月21日起量至本期发稿，累计下载超过1800万次，海外iOS、海外安卓及国内iOS合计收入超过9500万美元。文中另将国内安卓收入作推估后给出APP总收入约1.1亿美元，不能把这一推估与前述口径混用。产品以弹珠抽宠、塔防战斗和营地经营组成循环，近期投放仍在迭代素材。", "body_html": "<p>据罗斯基引用点点数据，莉莉丝《塔塔冒险队》自5月21日起量至本期发稿，累计下载超过1800万次，海外iOS、海外安卓及国内iOS合计收入超过9500万美元。文中另将国内安卓收入作推估后给出APP总收入约1.1亿美元，不能把这一推估与前述口径混用。产品以弹珠抽宠、塔防战斗和营地经营组成循环，近期投放仍在迭代素材。</p>", "meta": ["塔塔冒险队", "点点", "莉莉丝"], "sources": [["S1320", "莉莉丝这款新游《塔塔冒险队》，悄悄赚了7个多亿", "https://www.sohu.com/a/1094002134_100136645"]]}, {"section": "industry", "title": "卡普空确认Capcom ID数据泄露涉及逾1170万账户", "body": "卡普空确认，10月19日的数据泄露影响超过1170万个Capcom ID账户，系统覆盖《Street Fighter 6》《Monster Hunter》《Resident Evil》等产品。10月23日更新称，196个账户的密码曾被擅改，其中19个账户的日本e-Capcom页面遭访问；相关信息包括姓名、联系方式和购买记录。信用卡信息未受影响，相关游戏服务仍然可用。", "body_html": "<p>卡普空确认，10月19日的数据泄露影响超过1170万个Capcom ID账户，系统覆盖《Street Fighter 6》《Monster Hunter》《Resident Evil》等产品。10月23日更新称，196个账户的密码曾被擅改，其中19个账户的日本e-Capcom页面遭访问；相关信息包括姓名、联系方式和购买记录。信用卡信息未受影响，相关游戏服务仍然可用。</p>", "meta": [], "sources": [["S0263", "Capcom affected by data breach, over 11.7m Capcom ID accounts compromised", "https://www.gamesindustry.biz/capcom-affected-by-data-breach-over-117m-capcom-id-accounts-compromised"]]}, {"section": "industry", "title": "SYBO称《地铁跑酷》月活仍在1亿至1.5亿之间，长期基本未做买量", "body": "SYBO负责人Mathias Gredal Nørvig在访谈中估计，《地铁跑酷》的月活用户仍在1亿至1.5亿之间，累计下载约49亿次。其称长期基本没有投入买量，偶尔会花1500美元做小测试，产品约90%的收入来自广告。 团队把《地铁跑酷：城市》定位为更适合深入参与的另一种体验，以较短跑酷循环、角色成长与资源选择提供更高难度。上述月活与零买量口径来自经营者自述，不能据此推导其他跑酷游戏的获客成本。", "body_html": "<p>SYBO负责人Mathias Gredal Nørvig在访谈中估计，《地铁跑酷》的月活用户仍在1亿至1.5亿之间，累计下载约49亿次。其称长期基本没有投入买量，偶尔会花1500美元做小测试，产品约90%的收入来自广告。</p><p>团队把《地铁跑酷：城市》定位为更适合深入参与的另一种体验，以较短跑酷循环、角色成长与资源选择提供更高难度。上述月活与零买量口径来自经营者自述，不能据此推导其他跑酷游戏的获客成本。</p>", "meta": ["地铁跑酷", "买量"], "sources": [["S0029", "《地铁跑酷》老板分享：15年，零买量，为何还能有1.5亿MAU？", "http://www.gamelook.com.cn/2026/10/604597/"]]}, {"section": "industry", "title": "抖音小游戏白皮书回顾2025年流水近翻倍，内容渠道用户LTV提高约50%", "body": "《2026抖音小游戏行业白皮书》回顾称，2025年抖音小游戏总流水增长近100%，活跃用户规模增长超过120%，在小游戏市场的份额接近30%。这是2025年的平台统计，不能当作10月单月变化。 白皮书称，内容渠道进入的玩家LTV提升约50%，2025年第四季度短视频和直播内容直接转化收入同比增长160%。在小游戏内购与混合变现扩张的同时，平台把内容传播和社交互动作为延长产品经营周期的主要路径。", "body_html": "<p>《2026抖音小游戏行业白皮书》回顾称，2025年抖音小游戏总流水增长近100%，活跃用户规模增长超过120%，在小游戏市场的份额接近30%。这是2025年的平台统计，不能当作10月单月变化。</p><p>白皮书称，内容渠道进入的玩家LTV提升约50%，2025年第四季度短视频和直播内容直接转化收入同比增长160%。在小游戏内购与混合变现扩张的同时，平台把内容传播和社交互动作为延长产品经营周期的主要路径。</p>", "meta": ["小游戏"], "sources": [["S0109", "抖音，正在重新定义游戏市场", "https://youxichaguan.com/es/archives/214786"]]}, {"section": "industry", "title": "微信小游戏回顾2025年生态：逾300款产品季度流水超过千万元", "body": "微信小游戏在2026公开课的生态回顾中披露，平台月活稳定在5亿以上，2025年业务规模增长接近20%。逾300款产品的季度流水超过千万元，数据反映的是2025年生态规模。 回顾同时提到，平台日活同比增长10%，每月活跃至少10天的高黏性用户同比增长27%。这些指标分别描述活跃频次与留存人群，不能直接等同为单款游戏的留存改善。", "body_html": "<p>微信小游戏在2026公开课的生态回顾中披露，平台月活稳定在5亿以上，2025年业务规模增长接近20%。逾300款产品的季度流水超过千万元，数据反映的是2025年生态规模。</p><p>回顾同时提到，平台日活同比增长10%，每月活跃至少10天的高黏性用户同比增长27%。这些指标分别描述活跃频次与留存人群，不能直接等同为单款游戏的留存改善。</p>", "meta": ["小游戏"], "sources": [["S0131", "300 produtos com volume de negócios trimestral superior a 10 milhões: divulgados os resultados dos minijogos do WeChat ao longo de 25 anos", "https://youxichaguan.com/pt/archives/214322"]]}, {"section": "industry", "title": "卡普空3月销量回顾：《Resident Evil 9》五天销量超过500万份", "body": "本期文章回顾，卡普空在3月4日公告《Resident Evil 9: Requiem》销量超过500万份，达成这一销量用了五天。报道指出，其销售速度超过《Resident Evil 8》和《Resident Evil 4: Remake》。 这是系列三十周年背景下的历史销量节点。正文对双主角、恐怖与动作体验的评价属于作者判断，销量表现本身不能证明所有设计变化均获得玩家认可。", "body_html": "<p>本期文章回顾，卡普空在3月4日公告《Resident Evil 9: Requiem》销量超过500万份，达成这一销量用了五天。报道指出，其销售速度超过《Resident Evil 8》和《Resident Evil 4: Remake》。</p><p>这是系列三十周年背景下的历史销量节点。正文对双主角、恐怖与动作体验的评价属于作者判断，销量表现本身不能证明所有设计变化均获得玩家认可。</p>", "meta": [], "sources": [["S0249", "Após ter vendido 5 milhões de exemplares, «Resident Evil 9» não conseguiu sair do impasse das pequenas inovações próprias de uma franquia antiga", "https://youxichaguan.com/pt/archives/214772"]]}, {"section": "industry", "title": "原神UGC开发复盘：截至1月累计游玩超过1.5亿次，吸引逾3万创作者", "body": "在本期刊载的GDC开发复盘中，米哈游披露，《原神》UGC模块截至1月累计游玩超过1.5亿次，吸引国内外超过3万名创作者。模块于2025年10月推出，相关数字保留原有统计时点。 分享回顾，团队从2022年开始关注UGC，系统经历约两年研发，并准备继续提供内容支持。它反映的是玩家从消费内容转向参与制作的规模，游玩次数不能直接换算为独立用户或商业收入。", "body_html": "<p>在本期刊载的GDC开发复盘中，米哈游披露，《原神》UGC模块截至1月累计游玩超过1.5亿次，吸引国内外超过3万名创作者。模块于2025年10月推出，相关数字保留原有统计时点。</p><p>分享回顾，团队从2022年开始关注UGC，系统经历约两年研发，并准备继续提供内容支持。它反映的是玩家从消费内容转向参与制作的规模，游玩次数不能直接换算为独立用户或商业收入。</p>", "meta": ["原神", "米哈游", "UGC"], "sources": [["S0673", "Más de 150 millones en tres meses desde su lanzamiento; miHoYo comenta: «A diferencia de Genshin Impact, sé que lo hemos hecho bien».", "https://youxichaguan.com/es/archives/215231"]]}, {"section": "industry", "title": "EA确认关闭BioWare并取消开发中的《Mass Effect》新作", "body": "EA于10月21日宣布重大内部重组，包括关闭BioWare并取消多个项目，《质量效应5》亦被取消。该工作室以《质量效应》《龙腾世纪》等角色扮演系列闻名，已有逾30年历史。分析师认为，商业表现、开发成本和收购债务共同构成压力；这些原因判断保留分析师归因。", "body_html": "<p>EA于10月21日宣布重大内部重组，包括关闭BioWare并取消多个项目，《质量效应5》亦被取消。该工作室以《质量效应》《龙腾世纪》等角色扮演系列闻名，已有逾30年历史。分析师认为，商业表现、开发成本和收购债务共同构成压力；这些原因判断保留分析师归因。</p>", "meta": ["Mass Effect", "质量效应5", "并购"], "sources": [["S0788", "分析师称BioWare关闭早可预见", "https://www.ign.com.cn/zlxygame/63612/fen-xi-shi-cheng-biowareguan-bi-zao-ke-yu-jian"]]}, {"section": "industry", "title": "网易回顾《天下：万象》跨端上线后表现，PCU达到近十年高点", "body": "网易《天下》在2025年12月17日升级为《天下：万象》后，推出跨平台版本。本期复盘称，跨端版本上线后PCU达到近十年高点，付费用户数与付费率亦创纪录；2025年端游收入达到近十年最高水平。 团队围绕老玩家回归负担调整产品，并加入满足登录天数条件后返还礼包费用的机制。该案例反映成熟IP试图降低回归投入的不确定性，所列经营表现保留原有年度和阶段口径。", "body_html": "<p>网易《天下》在2025年12月17日升级为《天下：万象》后，推出跨平台版本。本期复盘称，跨端版本上线后PCU达到近十年高点，付费用户数与付费率亦创纪录；2025年端游收入达到近十年最高水平。</p><p>团队围绕老玩家回归负担调整产品，并加入满足登录天数条件后返还礼包费用的机制。该案例反映成熟IP试图降低回归投入的不确定性，所列经营表现保留原有年度和阶段口径。</p>", "meta": ["天下：万象", "网易"], "sources": [["S0177", "Receitas a atingirem novos máximos, número de jogadores online a atingirem novos picos: o que é que este MMO da NetEase tem para vencer em 2026?", "https://youxichaguan.com/pt/archives/214602"]]}, {"section": "industry", "title": "米哈游参投的奥秘游戏首曝多人合作新作《潜梦者》", "body": "获得米哈游投资的奥秘游戏在本期公开自研新作《潜梦者》的首曝PV，定位为多人合作“搜躲撤”，玩家潜入梦境并探索做梦者的记忆。团队在立项中从Unity转向UE5，并围绕“抓取”设计物品组合、伙伴互动与解谜，尽量减少战斗以避开自身短板。创始人徐奥林表示，关卡环节会尽量解耦，以距离、高度差、温度、水位等环境条件容纳不同解法，而不要求玩家完成唯一预设流程。", "body_html": "<p>获得米哈游投资的奥秘游戏在本期公开自研新作《潜梦者》的首曝PV，定位为多人合作“搜躲撤”，玩家潜入梦境并探索做梦者的记忆。团队在立项中从Unity转向UE5，并围绕“抓取”设计物品组合、伙伴互动与解谜，尽量减少战斗以避开自身短板。创始人徐奥林表示，关卡环节会尽量解耦，以距离、高度差、温度、水位等环境条件容纳不同解法，而不要求玩家完成唯一预设流程。</p>", "meta": ["潜梦者", "米哈游"], "sources": [["S0528", "米哈游投资，前沐瞳CEO公司发行：被大伟哥指点后，他们做了款搜躲撤", "https://m.sohu.com/a/1092517721_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.4.17929729179434zs8r11"]]}, {"section": "industry", "title": "世佳、朗新与AlipayHK合作，LumiGames承接海外钱包小游戏业务", "body": "世佳网络、朗新科技集团与AlipayHK在香港启动合作，联合品牌LumiGames成为内容与运营载体。AlipayHK提供流量入口、用户场景及支付能力，世佳负责游戏引入、发行运营与本地化，朗新提供钱包客户基础及平台商业化协同。项目计划先验证香港市场的内容需求与商业化，再扩大供给和用户规模。", "body_html": "<p>世佳网络、朗新科技集团与AlipayHK在香港启动合作，联合品牌LumiGames成为内容与运营载体。AlipayHK提供流量入口、用户场景及支付能力，世佳负责游戏引入、发行运营与本地化，朗新提供钱包客户基础及平台商业化协同。项目计划先验证香港市场的内容需求与商业化，再扩大供给和用户规模。</p>", "meta": ["小游戏"], "sources": [["S1119", "世佳与AlipayHK官宣合作，小游戏出海迈入「生态共建」阶段", "https://m.sohu.com/a/1094039408_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.3.1793232248602I2syOkV"]]}, {"section": "industry", "title": "Charu Desodt出任BAFTA游戏委员会主席", "body": "Interior Night工作室负责人Charu Desodt获任BAFTA游戏委员会主席，接替已加入Lego Digital Play的Tara Saunders。她拥有超过25年行业经验，曾在微软、索尼欧洲及Preloaded担任高级制作职务，也是英国电子游戏委员会成员。", "body_html": "<p>Interior Night工作室负责人Charu Desodt获任BAFTA游戏委员会主席，接替已加入Lego Digital Play的Tara Saunders。她拥有超过25年行业经验，曾在微软、索尼欧洲及Preloaded担任高级制作职务，也是英国电子游戏委员会成员。</p>", "meta": [], "sources": [["S1253", "Interior Night studio head Charu Desodt appointed chair of BAFTA Games Committee", "https://www.gamesindustry.biz/interior-night-studio-head-charu-desodt-appointed-chair-of-bafta-games-committee"]]}, {"section": "industry", "title": "GOG与Retrovibe联合发行，提供资金、营销与跨平台认证支持", "body": "GOG与独立发行商Retrovibe启动“Retrovibe by GOG”，面向PC商店和主机平台支持独立开发者。服务包括资金、营销、内容创作者与媒体沟通，以及发行认证；已列入阵容的作品有《Cop Bastard》和《Project Warlock: Lost Chapters》。两款游戏也有Steam页面，并非GOG独占。", "body_html": "<p>GOG与独立发行商Retrovibe启动“Retrovibe by GOG”，面向PC商店和主机平台支持独立开发者。服务包括资金、营销、内容创作者与媒体沟通，以及发行认证；已列入阵容的作品有《Cop Bastard》和《Project Warlock: Lost Chapters》。两款游戏也有Steam页面，并非GOG独占。</p>", "meta": ["Cop Bastard"], "sources": [["S1340", "GOG's getting into publishing in its new, post-CD-Projekt life, and it already has games on the way", "https://www.pcgamer.com/gaming-industry/gogs-getting-into-publishing-in-its-new-post-cd-projekt-life-and-it-already-has-games-on-the-way/"]]}, {"section": "industry", "title": "Zero Creation Games回顾《Ai Hong》首日回本，AVG投入上限仍受市场约束", "body": "游戏茶馆当期译稿刊载了一场清明假期后的访谈：Zero Creation Games制作人Ji Ling称，《Ai Hong》首日约售出4万份并收回成本，采访时累计销量已超过8万份；前作销量则已超过百万。尽管新作同期销售领先前作，他仍预计未来两年的销售总量会稍低，并认为高投入AVG可能只会尝试这一次。这里记录的是该次访谈时点的数据与判断。", "body_html": "<p>游戏茶馆当期译稿刊载了一场清明假期后的访谈：Zero Creation Games制作人Ji Ling称，《Ai Hong》首日约售出4万份并收回成本，采访时累计销量已超过8万份；前作销量则已超过百万。尽管新作同期销售领先前作，他仍预计未来两年的销售总量会稍低，并认为高投入AVG可能只会尝试这一次。这里记录的是该次访谈时点的数据与判断。</p>", "meta": ["Ai Hong"], "sources": [["S1224", "Recuperação do investimento logo no lançamento: o produtor de «Ai Hong» enfrenta tudo em meio à confusão: dá o seu melhor e mergulha de cabeça na controvérsia", "https://youxichaguan.com/pt/archives/216102"], ["S1225", "初版で元を取った。『哀鴻』のプロデューサーが混乱の中、すべてと向き合う：全力を尽くし、物議を醸す渦中へと突き進む", "https://youxichaguan.com/ja/archives/216098"], ["S1226", "Recuperación de la inversión tras el estreno: el productor de «Ai Hong» afronta todo en medio del caos: da lo mejor de sí mismo y se adentra en la polémica", "https://youxichaguan.com/es/archives/216100"], ["S1227", "Mit der Erstveröffentlichung die Kosten wieder hereinholen: Der Produzent von „Ai Hong“ stellt sich inmitten des Chaos allem: Er gibt sein Bestes und stürzt sich in die Kontroverse", "https://youxichaguan.com/de/archives/216104"], ["S1228", "첫 출시로 투자금 회수, 《애홍》 제작자가 혼란 속에서도 모든 것을 정면으로 마주하다: 온 힘을 다해 논란 속으로 뛰어들다", "https://youxichaguan.com/ko/archives/216106"], ["S1246", "Breaking Even on Day One: The Producer of *Aihong* Faces It All Head-On Amid the Chaos—Giving It His All and Charging Into the Controversy", "https://youxichaguan.com/en/archives/216096"]]}, {"section": "industry", "title": "《Raccoon Coin Pusher》发售复盘：三人团队首日销量10万份", "body": "游戏茶馆当期译稿回顾，《Raccoon Coin Pusher》由三名2024届毕业生组成的团队开发，发售首日销量10万份、同时在线峰值11500人。发行商Playstack此前发行过获得TGA最佳独立游戏奖的作品，此次是其首次与中国开发者合作。制作人表示，发售前约40万份愿望单中，美国地区占比最高；这些是稿件所记录的发售初期数据。", "body_html": "<p>游戏茶馆当期译稿回顾，《Raccoon Coin Pusher》由三名2024届毕业生组成的团队开发，发售首日销量10万份、同时在线峰值11500人。发行商Playstack此前发行过获得TGA最佳独立游戏奖的作品，此次是其首次与中国开发者合作。制作人表示，发售前约40万份愿望单中，美国地区占比最高；这些是稿件所记录的发售初期数据。</p>", "meta": [], "sources": [["S1229", "졸업생 3명이 출시 첫날 10만 건의 다운로드를 기록한 게임을 만들었다고? 《너구리 코인 슬롯머신》 팀과 이야기를 나눠보았다", "https://youxichaguan.com/ko/archives/216082"], ["S1230", "Ein Spiel, das drei Absolventen entwickelt haben und das am ersten Tag 100.000 Mal verkauft wurde? Wir haben uns mit dem Team von „Raccoon Coin Machine“ unterhalten.", "https://youxichaguan.com/de/archives/216080"], ["S1231", "Três recém-licenciados criaram um jogo que vendeu 100 mil cópias no primeiro dia? Conversámos com a equipa do «Raccoon Coin Pusher»", "https://youxichaguan.com/pt/archives/216078"], ["S1232", "¿Tres recién graduados han creado un juego que vendió 100 000 copias el primer día? Hemos hablado con el equipo de «Raccoon Coin Pusher».", "https://youxichaguan.com/es/archives/216076"], ["S1233", "たった3人の卒業生が、初日に10万本売れたゲームを作った？『アライグマのコインプッシャー』チームに話を聞いた", "https://youxichaguan.com/ja/archives/216074"], ["S1234", "Three Graduates Created a Game That Sold 100,000 Copies on Its First Day? We Chatted with the Team Behind *Raccoon Coin Pusher*", "https://youxichaguan.com/en/archives/216072"]]}, {"section": "industry", "title": "RocketWerkz开源BRUTAL框架，商业游戏可免版税使用", "body": "据indienova汇编，RocketWerkz与Ahwoo于10月20日宣布开源C#游戏开发框架BRUTAL，将C#、.NET、C++库和底层图形访问结合，供团队构建和维护自己的开发工具。框架可免费用于商业游戏、不收版税或分成，但需遵守开源许可并展示版权声明与标志。报道还以《边缘世界》迁移至基于BRUTAL的自研引擎为采用案例。", "body_html": "<p>据indienova汇编，RocketWerkz与Ahwoo于10月20日宣布开源C#游戏开发框架BRUTAL，将C#、.NET、C++库和底层图形访问结合，供团队构建和维护自己的开发工具。框架可免费用于商业游戏、不收版税或分成，但需遵守开源许可并展示版权声明与标志。报道还以《边缘世界》迁移至基于BRUTAL的自研引擎为采用案例。</p>", "meta": ["边缘世界"], "sources": [["S1318", "NOVA海外独立游戏见闻 Vol.158", "https://indienova.com/indie-game-news/news-of-overseas-indie-games-and-industry-vol-158/"]]}, {"section": "industry", "title": "Don't Nod工会警告年内清算风险，重组方案进入11月裁定节点", "body": "《奇异人生》早期作品开发商Don't Nod的工会员工于10月27日声明，公司处于避免无力偿债的保障程序中，管理层讨论的最坏财务情形包括2026年内清算。工会称，拟裁撤岗位覆盖多个研发职能，并质疑以外包承接工作是否可行。报道列出的下一节点是11月3日有关机构裁定；若方案获批，员工可能于11月25日收到解雇通知。", "body_html": "<p>《奇异人生》早期作品开发商Don't Nod的工会员工于10月27日声明，公司处于避免无力偿债的保障程序中，管理层讨论的最坏财务情形包括2026年内清算。工会称，拟裁撤岗位覆盖多个研发职能，并质疑以外包承接工作是否可行。报道列出的下一节点是11月3日有关机构裁定；若方案获批，员工可能于11月25日收到解雇通知。</p>", "meta": ["奇异人生"], "sources": [["S1300", "《奇异人生》开发商遭工会员工指控违法", "https://www.ign.com.cn/life-is-strange/63667/qi-yi-ren-sheng-kai-fa-shang-zao-gong-hui-yuan-gong-zhi-kong-wei-fa"]]}, {"section": "industry", "title": "Side收购成都美术工作室Roboto，并任命全球美术负责人", "body": "Side于10月21日宣布收购成都美术工作室Roboto Entertainment，并据此成立成都工作室。Roboto创始人Andrea Cordella同时出任Side全球美术主管与成都工作室负责人，统筹跨地区美术团队。 成都为Side继上海之后在中国大陆的第二个站点。Roboto专长是环境与世界构建美术，与Side此前偏角色美术的能力互补；这笔交易将中国团队的职责从交付扩展到全球美术管理。", "body_html": "<p>Side于10月21日宣布收购成都美术工作室Roboto Entertainment，并据此成立成都工作室。Roboto创始人Andrea Cordella同时出任Side全球美术主管与成都工作室负责人，统筹跨地区美术团队。</p><p>成都为Side继上海之后在中国大陆的第二个站点。Roboto专长是环境与世界构建美术，与Side此前偏角色美术的能力互补；这笔交易将中国团队的职责从交付扩展到全球美术管理。</p>", "meta": ["并购"], "sources": [["S0141", "Side收购成都美术工作室Roboto，这个全球游戏服务商把美术决策中枢放到中国西部", "https://youxichaguan.com/archives/214914"], ["S0764", "Side expands presence in China, opens new studio and acquires art outsourcing provider Roboto Entertainment", "https://www.gamesindustry.biz/side-expands-presence-in-china-opens-new-studio-and-acquires-art-outsourcing-provider-roboto-entertainment"]]}, {"section": "industry", "title": "网易与哔哩哔哩参投的Nekoday以新作众筹缓解开发资金压力", "body": "Nekoday在《Bubble Winter Scenery》之后获得哔哩哔哩与网易投资，但其后经历项目取消、亏损与团队缩减。团队与原有伙伴合作开发续作《Poema do Fim do Século》，并在春节前启动众筹。 本期访谈回顾，众筹上线不足一个月获得约1800人支持、筹款超过60万元，超过目标十倍。负责人称资金不再是当前开发的主要障碍，团队计划年内完成作品；这是项目方计划，尚非发售结果。", "body_html": "<p>Nekoday在《Bubble Winter Scenery》之后获得哔哩哔哩与网易投资，但其后经历项目取消、亏损与团队缩减。团队与原有伙伴合作开发续作《Poema do Fim do Século》，并在春节前启动众筹。</p><p>本期访谈回顾，众筹上线不足一个月获得约1800人支持、筹款超过60万元，超过目标十倍。负责人称资金不再是当前开发的主要障碍，团队计划年内完成作品；这是项目方计划，尚非发售结果。</p>", "meta": ["网易"], "sources": [["S0167", "Após receber investimento da NetEase e da Bilibili, quando a situação estava no seu pior, só tinha 30 mil na conta, mas o veterano do mundo dos animes e mangás «Tiexue» vai regressar num piscar de olhos", "https://youxichaguan.com/pt/archives/214756"]]}, {"section": "industry", "title": "《Slay the Spire 2》3月EA发售回顾：Steam峰值在线超过28万", "body": "《Slay the Spire 2》于3月6日凌晨2点进入Steam抢先体验。报道回顾，发售初期同时在线峰值超过28万，全语言好评率为97%，并曾登上Steam畅销榜首位。 文章记录，发售前后平台出现购买与入库异常，部分玩家重复付款后仍未收到游戏。这些是当时的发售现象，不能据本期转载推断Steam目前仍存在同样故障。", "body_html": "<p>《Slay the Spire 2》于3月6日凌晨2点进入Steam抢先体验。报道回顾，发售初期同时在线峰值超过28万，全语言好评率为97%，并曾登上Steam畅销榜首位。</p><p>文章记录，发售前后平台出现购买与入库异常，部分玩家重复付款后仍未收到游戏。这些是当时的发售现象，不能据本期转载推断Steam目前仍存在同样故障。</p>", "meta": ["畅销榜"], "sources": [["S0722", "The previous installment sold 9 million copies; the new release crashed servers upon launch and topped the best-seller charts at No. 1.", "https://youxichaguan.com/en/archives/215129"]]}, {"section": "industry", "title": "《Witchbrook》定档2027年1月28日，生活模拟扩展到全平台", "body": "首次曝光八年后，生活模拟游戏《Witchbrook》确定于2027年1月28日登陆PS5、Xbox Series X|S、PC、Switch与Switch 2。玩家在魔法学校学习，与镇民建立关系，也可邀请三名朋友共同经营、布置房屋或参加扫帚竞速。此次发布明确了正式发售日与平台范围。", "body_html": "<p>首次曝光八年后，生活模拟游戏《Witchbrook》确定于2027年1月28日登陆PS5、Xbox Series X|S、PC、Switch与Switch 2。玩家在魔法学校学习，与镇民建立关系，也可邀请三名朋友共同经营、布置房屋或参加扫帚竞速。此次发布明确了正式发售日与平台范围。</p>", "meta": ["Witchbrook", "生活模拟"], "sources": [["S1290", "Witchbrook Is Stardew Valley Meets Kiki’s Delivery Service, And It Finally Has A Release Date", "https://www.gamespot.com/articles/witchbrook-is-stardew-valley-meets-kikis-delivery-service-and-it-finally-has-a-release-date/"]]}, {"section": "industry", "title": "《Highguard》停运复盘：3月公告关闭服务器，未达到持续经营所需用户规模", "body": "本期报道回顾，《Highguard》在3月4日宣布将于3月12日关闭服务器。Wildlight开发的这款FPS于1月27日上线Steam；官方称累计吸引超过200万玩家，但未能形成支持长期运营的用户基础。 报道援引前员工采访称，团队早期希望避开拥挤的大逃杀市场，后从生存玩法转向更快节奏的竞技射击，部分生存机制被简化。团队对资金、留存与产品方向的判断来自受访者复盘，不能归结为单一玩法导致停运。", "body_html": "<p>本期报道回顾，《Highguard》在3月4日宣布将于3月12日关闭服务器。Wildlight开发的这款FPS于1月27日上线Steam；官方称累计吸引超过200万玩家，但未能形成支持长期运营的用户基础。</p><p>报道援引前员工采访称，团队早期希望避开拥挤的大逃杀市场，后从生存玩法转向更快节奏的竞技射击，部分生存机制被简化。团队对资金、留存与产品方向的判断来自受访者复盘，不能归结为单一玩法导致停运。</p>", "meta": ["Highguard"], "sources": [["S0184", "Apenas 37 días después de su lanzamiento, «Highguard», que en su día recibió inversión de Tencent, anuncia el cese de sus servicios", "https://youxichaguan.com/es/archives/214738"]]}, {"section": "industry", "title": "益世界《疯狂水世界》1月上线回顾：休闲SLG进入小游戏畅销榜前十", "body": "益世界《疯狂水世界》在2025年12月先推出小游戏版本，2026年1月8日推出手游版本。本期复盘记录，其微信小游戏畅销榜曾升至第7、抖音小游戏畅销榜第8。 产品以洪水末日题材和明亮卡通风格切入休闲SLG，把模拟经营与策略成长结合。上述排名对应年初上线阶段，不能当作10月现时榜单表现。", "body_html": "<p>益世界《疯狂水世界》在2025年12月先推出小游戏版本，2026年1月8日推出手游版本。本期复盘记录，其微信小游戏畅销榜曾升至第7、抖音小游戏畅销榜第8。</p><p>产品以洪水末日题材和明亮卡通风格切入休闲SLG，把模拟经营与策略成长结合。上述排名对应年初上线阶段，不能当作10月现时榜单表现。</p>", "meta": ["疯狂水世界", "模拟经营", "SLG"], "sources": [["S0062", "Top 10 das vendas mais populares: será que esta marca de longa data está a começar o ano em grande?", "https://youxichaguan.com/pt/archives/214414"]]}, {"section": "ai", "title": "《全面战争：幕府将军2》完全版下架后，Creative Assembly承认外包审核失守", "body": "《全面战争：幕府将军2》完全版因生成式AI疑虑及性能问题于上周下架后，《全面战争》系列副总裁Roger Collum进一步说明，该版本由外部团队开发，未经过与内部项目相同的审查和质量保证。公司已组织一支资深开发者小组，与Sega及外部开发者商议后续处理。Collum表示，公司不使用生成式AI制作游戏资产，并要求外部合作方遵循相同标准，但允许工具辅助分析、调试与快速原型制作。", "body_html": "<p>《全面战争：幕府将军2》完全版因生成式AI疑虑及性能问题于上周下架后，《全面战争》系列副总裁Roger Collum进一步说明，该版本由外部团队开发，未经过与内部项目相同的审查和质量保证。公司已组织一支资深开发者小组，与Sega及外部开发者商议后续处理。Collum表示，公司不使用生成式AI制作游戏资产，并要求外部合作方遵循相同标准，但允许工具辅助分析、调试与快速原型制作。</p>", "meta": ["全面战争：幕府将军2"], "sources": [["S0760", "Shogun 2 – Complete Edition was \"not a Creative Assembly developed game,\" says Total War VP after it was pulled amid generative AI concerns", "https://www.gamesindustry.biz/shogun-2-complete-edition-was-not-a-creative-assembly-developed-game-says-total-war-vp-after-it-was-pulled-amid-generative-ai-concerns"], ["S0621", "Creative Assembly：《全面战争：幕府将军2》完全版系纯外包作品", "https://www.gcores.com/articles/221467"]]}, {"section": "ai", "title": "Epic称已用AI开发UE6与《堡垒之夜》，工程师保留架构与性能控制", "body": "Epic开发负责人Marcus Wassmer表示，工程师已不再编写大部分代码，而是指导AI工具并持续迭代，确保引擎满足内存、性能与扩展性约束。当前相关开发流连接《堡垒之夜》、UEFN和UE6，使用工具包括Claude Code与Codex。他举例称，原估单名工程师需三至六周的D3D12渲染层部分重写，实际约一周完成；这是厂商披露的具体任务结果。", "body_html": "<p>Epic开发负责人Marcus Wassmer表示，工程师已不再编写大部分代码，而是指导AI工具并持续迭代，确保引擎满足内存、性能与扩展性约束。当前相关开发流连接《堡垒之夜》、UEFN和UE6，使用工具包括Claude Code与Codex。他举例称，原估单名工程师需三至六周的D3D12渲染层部分重写，实际约一周完成；这是厂商披露的具体任务结果。</p>", "meta": ["堡垒之夜", "AI渲染"], "sources": [["S1336", "'Yes, we are vibe-coding things': Epic confirms it's using AI tools to code Unreal Engine 6, Fortnite, and more", "https://www.pcgamer.com/software/ai/yes-we-are-vibe-coding-things-epic-confirms-its-using-ai-tools-to-code-unreal-engine-6-fortnite-and-more/"]]}, {"section": "ai", "title": "Epic拟解除UE与MetaHuman输出的AI训练限制，具体游戏授权仍由开发者决定", "body": "Tim Sweeney表示，Epic正在推进修改许可条款，移除使用虚幻引擎与MetaHuman输出训练AI的限制，现行条款目前仍有限制。他同时强调，采用这些工具制作的每款游戏，仍可由开发者自行选择允许或禁止AI训练。工具许可的调整计划因此不等于所有游戏资产都已开放训练。", "body_html": "<p>Tim Sweeney表示，Epic正在推进修改许可条款，移除使用虚幻引擎与MetaHuman输出训练AI的限制，现行条款目前仍有限制。他同时强调，采用这些工具制作的每款游戏，仍可由开发者自行选择允许或禁止AI训练。工具许可的调整计划因此不等于所有游戏资产都已开放训练。</p>", "meta": [], "sources": [["S1114", "Epic宣布将允许AI使用虚幻引擎和MetaHuman输出训练", "https://www.gcores.com/articles/221590"], ["S1265", "Epic is updating its EULA to allow AI training on outputs from Unreal Engine and MetaHuman", "https://www.gamedeveloper.com/programming/epic-is-updating-the-eula-to-allow-ai-training-on-outputs-from-unreal-engine-and-metahuman"]]}, {"section": "ai", "title": "《爱哩爱哩》以自主AI居民替代直接控制，付费对应内容生成频率", "body": "制作人Sea团队曝光AI新品《爱哩爱哩》：角色自行生活、发布图文或视频，玩家通过投喂道具与MOD间接影响行为，产品不提供直接打字聊天。团队用分层日志组织角色记忆，并称已建立多Agent循环审核的资产生产管线。Sea表示，视频生成成本使产品选择F2P，付费主要增加生活内容的产出频率；这些仍需通过早期测试验证。", "body_html": "<p>制作人Sea团队曝光AI新品《爱哩爱哩》：角色自行生活、发布图文或视频，玩家通过投喂道具与MOD间接影响行为，产品不提供直接打字聊天。团队用分层日志组织角色记忆，并称已建立多Agent循环审核的资产生产管线。Sea表示，视频生成成本使产品选择F2P，付费主要增加生活内容的产出频率；这些仍需通过早期测试验证。</p>", "meta": ["爱哩爱哩"], "sources": [["S1118", "做过畅销榜Top 1的制作人狂蹬AI两年，首曝了一款AI新品", "https://m.sohu.com/a/1094041153_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.2.1793232248602I2syOkV"]]}, {"section": "ai", "title": "米哈游团队相关研究开源游戏操作模型，比较模型规模、数据量与实时表现", "body": "10月22日晚，米哈游崩坏AI研发团队相关研究者与高校作者发布Scaling in Games开源项目，论文仍为arXiv预印本。研究以Qwen3.5视觉语言模型为基础，用游戏画面与键鼠操作记录训练，并以28款未进入训练数据的游戏检验陌生操作预测能力。测试比较不同模型规模、游戏数据量和实时条件，显示更大模型的样本效率优势仍受推理速度约束；这属于研究试验，尚不能视为公司已在商业游戏中部署通用玩家AI。", "body_html": "<p>10月22日晚，米哈游崩坏AI研发团队相关研究者与高校作者发布Scaling in Games开源项目，论文仍为arXiv预印本。研究以Qwen3.5视觉语言模型为基础，用游戏画面与键鼠操作记录训练，并以28款未进入训练数据的游戏检验陌生操作预测能力。测试比较不同模型规模、游戏数据量和实时条件，显示更大模型的样本效率优势仍受推理速度约束；这属于研究试验，尚不能视为公司已在商业游戏中部署通用玩家AI。</p>", "meta": ["米哈游", "大模型"], "sources": [["S0035", "米哈游项目组联手清北高材生，开源游戏操作AI模型：字节也做过", "https://m.sohu.com/a/1091675950_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.2.1792800276878hRfKTKC_324"]]}, {"section": "ai", "title": "Genie 4研究预览支持实时场景修改与原生音频，游戏开发者测试交互原型", "body": "Google DeepMind发布Genie 4研究预览，支持通过自然语言实时改变场景，并同步生成环境声音与交互式对话。受信任的游戏开发者和创意技术人员正在测试把初步想法快速变成可探索的原型，在编写引擎代码之前验证视觉风格、材质和交互机制。该模型仍处早期阶段，长时一致性、复杂物理、可读文字与空间准确性存在限制，不能据短时演示认定其已能替代完整游戏引擎。", "body_html": "<p>Google DeepMind发布Genie 4研究预览，支持通过自然语言实时改变场景，并同步生成环境声音与交互式对话。受信任的游戏开发者和创意技术人员正在测试把初步想法快速变成可探索的原型，在编写引擎代码之前验证视觉风格、材质和交互机制。该模型仍处早期阶段，长时一致性、复杂物理、可读文字与空间准确性存在限制，不能据短时演示认定其已能替代完整游戏引擎。</p>", "meta": [], "sources": [["S1353", "Google DeepMind 发布实时交互世界模型 Genie 4", "https://aihot.news/items/l74eacnb38ytvm5hm8om7h7cs"]]}, {"section": "release", "title": "篮球少女：飞跃巅峰", "body": "灵犀互娱研运和发行的篮球策略养成手游《篮球少女：飞跃巅峰》于10月23日开启全平台公测；玩家以教练身份安排训练，在多周目循环中培养球员。", "body_html": "<p>灵犀互娱研运和发行的篮球策略养成手游《篮球少女：飞跃巅峰》于10月23日开启全平台公测；玩家以教练身份安排训练，在多周目循环中培养球员。</p>", "meta": ["篮球少女：飞跃巅峰", "灵犀", "上线"], "sources": [["S0255", "NBA联动新游！教练，快来和篮球美少女们一起飞跃巅峰", "https://youxichaguan.com/archives/215084"], ["S0417", "篮球少女：飞跃巅峰 - 10:00 正式上线", "https://www.3839.com/a/181765.htm"], ["S0632", "灵犀还灵么？美少女二游《篮球少女》免费榜夺冠，还跟“NBA猛男”好上了！", "http://www.gamelook.com.cn/2026/10/604719/"], ["S1349", "原 , ["S0609", "[新瓜] [鸣潮] 鸣潮在前瞻说过的签到活动奖励与实际发放不足", "https://bbs.nga.cn/read.php?tid=47771885&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《明日方舟：终末地》活动立绘被指两次修改后仍留错误，玩家追问修复质量", "body": "《明日方舟：终末地》小葱活动立绘被玩家质疑龙尾结构异常并疑似使用AI生成，争议随后延伸到修复是否彻底。原帖始于10月20日；10月26日新增回复称，图片已先后修改尾巴错位及头发从袖子穿出的错误，但头饰仍未修正。玩家批评的重点由生成方式，转向连续修改后能否完成基本校对；帖内也有人因先前未察觉头发问题而重新检查图片。", "body_html": "<p>《明日方舟：终末地》小葱活动立绘被玩家质疑龙尾结构异常并疑似使用AI生成，争议随后延伸到修复是否彻底。原帖始于10月20日；10月26日新增回复称，图片已先后修改尾巴错位及头发从袖子穿出的错误，但头饰仍未修正。玩家批评的重点由生成方式，转向连续修改后能否完成基本校对；帖内也有人因先前未察觉头发问题而重新检查图片。</p>", "meta": ["明日方舟：终末地"], "sources": [["S0861", "[鹰角][厂商]明日方舟终末地新活动小葱立绘疑似使用ai生成(更新，已修复)", "https://bbs.nga.cn/read.php?tid=47751423&_fp=2&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《三角洲行动》“惊喜渡鸦”随机复制收藏品，玩家争论收益差距", "body": "《三角洲行动》“惊喜渡鸦”活动被玩家描述为可使当局收藏品升级、降级、消失、不变或复制，稀有收藏品也可能进入这一循环。10月25日开启的讨论中，争议集中在随机收益是否放大玩家资产差距；支持者则认为触发机会和可用物资本就受限，不能用少数高收益视频代表常态。到10月28日，仍有玩家以资产消耗速度反驳“经济失衡”的判断。", "body_html": "<p>《三角洲行动》“惊喜渡鸦”活动被玩家描述为可使当局收藏品升级、降级、消失、不变或复制，稀有收藏品也可能进入这一循环。10月25日开启的讨论中，争议集中在随机收益是否放大玩家资产差距；支持者则认为触发机会和可用物资本就受限，不能用少数高收益视频代表常态。到10月28日，仍有玩家以资产消耗速度反驳“经济失衡”的判断。</p>", "meta": ["三角洲行动"], "sources": [["S1434", "[腾讯]话说回来瓜版这边没人讨论吗，三角洲那边出了个很逆天的活动", "https://bbs.nga.cn/read.php?tid=47783517&forder_by=postdatedesc"]]}, {"section": "deep", "title": "Steam新品节Demo增至7300多款，同等排名带来的新增关注明显减少", "body": "观察：GameDiscoverCo的跨期比较显示，Demo供给增加时，同等排名的新增关注反而减少；活动更像放大已有兴趣，不能把参展当成曝光保证。 分析： 10月前10%作品新增关注者门槛为63，6月为121、去年10月为173；这是关注者比较，不能精确换算愿望单。 机构跟踪的Demo超过7300款，6月约4400款；分母变化会影响百分位，不能据此断言每款作品都同比下滑。 Probably Stolen、Character House等此前已在试玩榜靠前；作者据此把活动理解为兴趣放大，仍有临近活动才突围的例外。 新增愿望单前十中位数由6月约14.3万降至10月约8万；机构估算支持调整活动预期，不证明拥挤全部由AI造成。", "body_html": "<p>观察：GameDiscoverCo的跨期比较显示，Demo供给增加时，同等排名的新增关注反而减少；活动更像放大已有兴趣，不能把参展当成曝光保证。</p><p>分析：</p><p>10月前10%作品新增关注者门槛为63，6月为121、去年10月为173；这是关注者比较，不能精确换算愿望单。 机构跟踪的Demo超过7300款，6月约4400款；分母变化会影响百分位，不能据此断言每款作品都同比下滑。</p><p>Probably Stolen、Character House等此前已在试玩榜靠前；作者据此把活动理解为兴趣放大，仍有临近活动才突围的例外。 新增愿望单前十中位数由6月约14.3万降至10月约8万；机构估算支持调整活动预期，不证明拥挤全部由AI造成。</p>", "meta": [], "sources": [["S1435", "Who ‘won’ October 2026’s Steam Next Fest?", "https://newsletter.gamediscover.co/p/who-won-october-2026s-steam-next"]]}, {"section": "deep", "title": "《塔塔冒险队》缩短随机奖励链路，也让消耗速度和宠物养成价值更难平衡", "body": "观察：罗斯基对《塔塔冒险队》的拆解认为，弹珠并行反馈降低操作负担，也加快资源消耗；能否让玩家理解宠物成长价值，比只增加奖励速度更关键。 分析： 文章对比Monopoly Go逐步掷骰、升级和估算缺口，与塔塔多个档位并行反馈、直接对比进度，解释体验节奏变化。 文章观察到塔塔降低掠夺、提高活动积分事件权重并增加护盾容错；适配国内用户偏好是作者判断，未给人群实验。 作者认为更快消耗叠加倍率会扩大不利结果的缺口，而养成收益不够直观时玩家可能主动降倍数；没有披露付费因果对照。 后台战斗每10关要求手动挑战，用失败列提示玩家调整，再返回弹珠循环，避免一侧玩法持续占用体验。", "body_html": "<p>观察：罗斯基对《塔塔冒险队》的拆解认为，弹珠并行反馈降低操作负担，也加快资源消耗；能否让玩家理解宠物成长价值，比只增加奖励速度更关键。</p><p>分析：</p><p>文章对比Monopoly Go逐步掷骰、升级和估算缺口，与塔塔多个档位并行反馈、直接对比进度，解释体验节奏变化。 文章观察到塔塔降低掠夺、提高活动积分事件权重并增加护盾容错；适配国内用户偏好是作者判断，未给人群实验。</p><p>作者认为更快消耗叠加倍率会扩大不利结果的缺口，而养成收益不够直观时玩家可能主动降倍数；没有披露付费因果对照。 后台战斗每10关要求手动挑战，用失败列提示玩家调整，再返回弹珠循环，避免一侧玩法持续占用体验。</p>", "meta": ["塔塔冒险队"], "sources": [["S1320", "莉莉丝这款新游《塔塔冒险队》，悄悄赚了7个多亿", "https://www.sohu.com/a/1094002134_100136645"]]}];
    const sectionLabels = Object.fromEntries(sections.map(s => [s.id, s.label]));
    const sectionDescs = Object.fromEntries(sections.map(s => [s.id, s.desc]));
    const orderedSectionIds = sections.filter(s => s.id !== "all").map(s => s.id);
    let currentSection = "all";
    let compact = false;
    const nav = document.getElementById("nav");
    const content = document.getElementById("content");
    const sectionHead = document.getElementById("sectionHead");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    function matches(item, query) {
      if (!query) return true;
      const text = [item.title,item.body,item.meta.join(" "),item.sources.map(s => s.join(" ")).join(" ")].join(" ").toLowerCase();
      return text.includes(query.toLowerCase());
    }
    function isBorderline(m) {
      return /borderline/i.test(m);
    }
    function renderNav() {
      nav.innerHTML = "";
      sections.forEach(section => {
        const count = section.id === "all" ? items.length : items.filter(item => item.section === section.id).length;
        const button = document.createElement("button");
        button.dataset.section = section.id;
        if (section.id === currentSection) button.classList.add("active");
        button.innerHTML = `<span>${section.label}</span><span class="count">${count}</span>`;
        button.addEventListener("click", () => { currentSection = section.id; render(); });
        nav.appendChild(button);
      });
    }
    function renderItem(item) {
      const node = document.createElement("article");
      node.className = "item";
      node.dataset.section = item.section;
      const metaTags = item.meta.map(m => {
        const cls = isBorderline(m) ? "borderline" : "";
        return `<span class="${cls}">${m}</span>`;
      }).join("");
      const bodyMarkup = item.body_html || `<p>${item.body}</p>`;
      node.innerHTML = `<div class="item-top"><span class="tag">${sectionLabels[item.section]}</span></div><h3>${item.title}</h3>${bodyMarkup}<div class="meta-row">${metaTags}</div><button class="source-btn" type="button">查看来源 →</button>`;
      node.querySelector(".source-btn").addEventListener("click", () => openDrawer(item));
      return node;
    }
    function buildGrid(itemList) {
      const grid = document.createElement("section");
      grid.className = compact ? "grid compact" : "grid";
      itemList.forEach(item => grid.appendChild(renderItem(item)));
      return grid;
    }
    function buildSectionBlock(sectionId, itemList) {
      const block = document.createElement("div");
      block.className = "section-block";
      const banner = document.createElement("div");
      banner.className = "section-banner";
      banner.dataset.section = sectionId;
      banner.innerHTML = `<h2>${sectionLabels[sectionId]}</h2><span class="banner-count">${itemList.length} 条</span><span class="banner-desc">${sectionDescs[sectionId]}</span>`;
      block.appendChild(banner);
      block.appendChild(buildGrid(itemList));
      return block;
    }
    function render() {
      renderNav();
      const query = search.value.trim();
      const filtered = items.filter(item => (currentSection === "all" || item.section === currentSection) && matches(item, query));
      content.innerHTML = "";
      if (currentSection === "all") {
        sectionHead.style.display = "none";
        orderedSectionIds.forEach(sid => {
          const sectionItems = filtered.filter(it => it.section === sid);
          if (sectionItems.length > 0) content.appendChild(buildSectionBlock(sid, sectionItems));
        });
      } else {
        sectionHead.style.display = "flex";
        sectionHead.dataset.section = currentSection;
        document.getElementById("sectionTitle").textContent = sectionLabels[currentSection];
        document.getElementById("sectionDesc").textContent = sectionDescs[currentSection];
        content.appendChild(buildGrid(filtered));
      }
      empty.classList.toggle("visible", filtered.length === 0);
    }
    function openDrawer(item) {
      document.getElementById("drawerTitle").textContent = item.title;
      document.getElementById("drawerNote").textContent = item.body;
      document.getElementById("sourceList").innerHTML = item.sources.map(([id,name,url]) => {
        const safeUrl = String(url || "");
        const isHttp = /^https?:\/\//i.test(safeUrl);
        const linkAttrs = isHttp ? `href="${safeUrl}" target="_blank" rel="noopener noreferrer"` : "";
        const urlEl = isHttp
          ? `<a class="source-url" ${linkAttrs}>${safeUrl} ↗</a>`
          : `<span class="source-url">${safeUrl}</span>`;
        return `<div class="source-card"><strong>${id} · ${name}</strong>${urlEl}</div>`;
      }).join("");
      drawer.classList.add("open"); overlay.classList.add("open");
    }
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
    search.addEventListener("input", render);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    // Sidebar collapse — state persists in localStorage
    const app = document.getElementById("app");
    const SIDEBAR_KEY = "report-sidebar-collapsed";
    try { if (localStorage.getItem(SIDEBAR_KEY) === "1") app.classList.add("collapsed"); } catch (e) {}
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      app.classList.toggle("collapsed");
      try { localStorage.setItem(SIDEBAR_KEY, app.classList.contains("collapsed") ? "1" : "0"); } catch (e) {}
    });
    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("viewGrid").addEventListener("click", () => { compact = false; document.getElementById("viewGrid").classList.add("active"); document.getElementById("viewList").classList.remove("active"); render(); });
    document.getElementById("viewList").addEventListener("click", () => { compact = true; document.getElementById("viewList").classList.add("active"); document.getElementById("viewGrid").classList.remove("active"); render(); });
    render();
  </script>
</body>
</html>
