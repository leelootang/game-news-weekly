<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏行业周报 | 2026-06-19 ~ 2026-06-25</title>
  <style>
    :root {
      --ink:#1a2436; --ink-soft:#3a4862; --muted:#6b7993; --faint:#9aa6bd;
      --accent:#5b6ef5;
      --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78);
      --glass-border:rgba(255,255,255,.7); --line:rgba(31,45,75,.10); --line-strong:rgba(31,45,75,.16);
      --shadow-sm:0 3px 12px rgba(31,45,75,.05);
      --shadow:0 6px 28px rgba(31,45,75,.07);
      --shadow-lg:0 14px 40px rgba(31,45,75,.12);
      --industry:#4f7cff; --industry-soft:rgba(79,124,255,.12); --industry-ink:#2b53c4;
      --ai:#00b3d4; --ai-soft:rgba(0,179,212,.12); --ai-ink:#06748a;
      --release:#16b884; --release-soft:rgba(22,184,132,.13); --release-ink:#0b7a57;
      --rankings:#d05f3f; --rankings-soft:rgba(208,95,63,.13); --rankings-ink:#93402b;
      --discourse:#f0a02a; --discourse-soft:rgba(240,160,42,.15); --discourse-ink:#9a6206;
      --deep:#8b6df0; --deep-soft:rgba(139,109,240,.13); --deep-ink:#5a3fc0;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif; line-height:1.65; -webkit-font-smoothing:antialiased; }
    /* decorative gradient field behind the frosted glass */
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(circle at 12% 18%, rgba(91,110,245,.20), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(0,179,212,.16), transparent 40%),
        radial-gradient(circle at 78% 88%, rgba(139,109,240,.18), transparent 46%),
        radial-gradient(circle at 25% 92%, rgba(22,184,132,.13), transparent 44%),
        linear-gradient(135deg,#eef1fb 0%,#f3effb 48%,#eaf3fc 100%); }
    a { color:inherit; text-decoration:none; }
    button,input { font:inherit; }
    ::selection { background:rgba(91,110,245,.22); }
    .app { min-height:100vh; display:grid; grid-template-columns:264px minmax(0,1fr); transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
    .app.collapsed { grid-template-columns:0 minmax(0,1fr); }

    /* Sidebar — frosted glass */
    aside.sidebar { position:sticky; top:0; height:100vh; padding:24px 18px; color:var(--ink); display:flex; flex-direction:column;
      background:rgba(255,255,255,.48); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
      border-right:1px solid rgba(255,255,255,.55); overflow-y:auto; overflow-x:hidden; transition:transform .25s cubic-bezier(.4,0,.2,1), opacity .2s; }
    .app.collapsed aside.sidebar { transform:translateX(-100%); opacity:0; pointer-events:none; }

    /* Sidebar toggle button (in topbar, always visible) */
    .sidebar-toggle { width:40px; height:40px; border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; border-radius:12px; display:grid; place-items:center; font-size:16px; line-height:1; transition:all .14s; }
    .sidebar-toggle:hover { color:var(--accent); border-color:var(--accent); }
    .sidebar-toggle .icon-open { display:inline; }
    .sidebar-toggle .icon-close { display:none; }
    .app.collapsed .sidebar-toggle .icon-open { display:none; }
    .app.collapsed .sidebar-toggle .icon-close { display:inline; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 2px 20px; border-bottom:1px solid var(--line); }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:11px; background:#fff; padding:7px; box-shadow:0 3px 10px rgba(31,45,75,.10); }
    .brand-mark img { width:100%; height:100%; display:block; object-fit:contain; }
    .brand strong { display:block; font-size:15px; line-height:1.1; letter-spacing:.2px; color:var(--ink); }
    .brand span { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
    .nav-title { margin:22px 0 10px; color:var(--faint); font-size:10px; letter-spacing:1.3px; text-transform:uppercase; font-weight:700; }
    .nav { display:grid; gap:3px; }
    .nav button { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; border:0; background:transparent; color:var(--ink-soft); padding:11px 14px; text-align:left; cursor:pointer; border-radius:11px; position:relative; font-size:14px; font-weight:500; transition:all .14s; }
    .nav button:hover { background:rgba(255,255,255,.55); color:var(--ink); }
    .nav button.active { background:rgba(91,110,245,.12); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px rgba(91,110,245,.18); }
    .nav button.active::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--accent2,var(--accent)); }
    .nav button[data-section="industry"] { --accent2:var(--industry); }
    .nav button[data-section="ai"] { --accent2:var(--ai); }
    .nav button[data-section="release"] { --accent2:var(--release); }
    .nav button[data-section="rankings"] { --accent2:var(--rankings); }
    .nav button[data-section="discourse"] { --accent2:var(--discourse); }
    .nav button[data-section="deep"] { --accent2:var(--deep); }
    .count { min-width:24px; padding:1px 9px; color:var(--muted); background:rgba(31,45,75,.07); text-align:center; border-radius:11px; font-size:12px; font-weight:600; }
    .nav button.active .count { background:var(--accent2,var(--accent)); color:#fff; }
    .sidebar-footer { margin:auto -18px -24px; padding:16px 22px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.65; }
    .sidebar-footer .made { color:var(--ink-soft); font-weight:600; }
    .sidebar-footer a { color:var(--accent); }
    .sidebar-footer .stat { margin-top:8px; color:var(--faint); }

    /* Main */
    main { padding:30px 40px 64px; min-width:0; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; line-height:1.25; letter-spacing:-.2px; font-weight:800; color:var(--ink); }
    .subtitle { margin-top:8px; color:var(--muted); font-size:13.5px; }
    .actions { display:flex; gap:10px; align-items:center; }
    .search { width:320px; display:flex; align-items:center; gap:8px; background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); padding:9px 14px; border-radius:12px; transition:border-color .15s, box-shadow .15s; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,110,245,.12); background:#fff; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:13.5px; }
    .search input::placeholder { color:var(--faint); }
    .icon-btn { border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; width:40px; height:40px; border-radius:12px; transition:all .14s; }
    .icon-btn:hover { color:var(--accent); border-color:var(--accent); }

    /* Metrics */
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:30px; }
    .metric { background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); padding:18px 20px; border-radius:18px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden; }
    .metric::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent2,var(--industry)); }
    .metric:nth-child(1) { --accent2:var(--industry); }
    .metric:nth-child(2) { --accent2:var(--release); }
    .metric:nth-child(3) { --accent2:var(--discourse); }
    .metric:nth-child(4) { --accent2:var(--deep); }
    .metric span { color:var(--muted); font-size:12.5px; letter-spacing:.3px; }
    .metric strong { display:block; font-size:26px; line-height:1.1; margin-top:6px; font-weight:800; color:var(--ink); }

    /* Section-head (单 section 视图) */
    .section-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin:6px 0 20px; padding:16px 20px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); border-left:4px solid var(--accent2,var(--industry)); border-radius:18px; box-shadow:var(--shadow-sm); }
    .section-head[data-section="industry"] { --accent2:var(--industry); }
    .section-head[data-section="ai"] { --accent2:var(--ai); }
    .section-head[data-section="release"] { --accent2:var(--release); }
    .section-head[data-section="rankings"] { --accent2:var(--rankings); }
    .section-head[data-section="discourse"] { --accent2:var(--discourse); }
    .section-head[data-section="deep"] { --accent2:var(--deep); }
    h2 { margin:0; font-size:20px; font-weight:700; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .toggle { display:flex; border:1px solid var(--glass-border); background:var(--glass); border-radius:11px; overflow:hidden; }
    .toggle button { padding:8px 15px; border:0; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13px; transition:all .14s; }
    .toggle button.active { background:var(--accent); color:#fff; font-weight:600; }

    /* "全部" 视图下的 section 分块 */
    .section-block { margin-top:38px; min-width:0; }
    .section-block:first-child { margin-top:0; }
    .section-banner { display:flex; align-items:baseline; gap:14px; padding:13px 18px; margin-bottom:16px; background:var(--accent-soft,var(--industry-soft)); border-left:4px solid var(--accent2,var(--industry)); border-radius:14px; }
    .section-banner[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .section-banner[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .section-banner[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .section-banner[data-section="rankings"] { --accent2:var(--rankings); --accent-soft:var(--rankings-soft); --accent-ink:var(--rankings-ink); }
    .section-banner[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .section-banner[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .section-banner h2 { color:var(--accent-ink); font-size:17px; margin:0; font-weight:700; }
    .section-banner .banner-count { color:var(--accent2); font-weight:700; font-size:13px; }
    .section-banner .banner-desc { color:var(--accent-ink); opacity:.7; font-size:13px; margin-left:auto; }

    /* Cards — glass */
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; min-width:0; }
    .grid.compact { grid-template-columns:1fr; }
    .item { min-width:0; background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); border-left:3px solid var(--accent2,var(--industry)); padding:20px 24px; border-radius:18px; box-shadow:var(--shadow-sm); transition:transform .18s, box-shadow .18s; display:flex; flex-direction:column; }
    .item:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
    .item[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .item[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .item[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .item[data-section="rankings"] { --accent2:var(--rankings); --accent-soft:var(--rankings-soft); --accent-ink:var(--rankings-ink); grid-column:1 / -1; }
    .item[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .item[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .item-top { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:11px; }
    .tag { padding:3px 11px; font-size:12px; color:var(--accent-ink); background:var(--accent-soft); border-radius:8px; font-weight:700; letter-spacing:.2px; }
    h3 { margin:2px 0 10px; font-size:17.5px; line-height:1.45; font-weight:700; color:var(--ink); letter-spacing:.1px; }
    .item p { margin:0 0 14px; color:var(--ink-soft); font-size:14.5px; line-height:1.78; }
    .meta-row { display:flex; flex-wrap:wrap; gap:7px; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .meta-row span { padding:3px 10px; background:rgba(31,45,75,.06); border-radius:8px; }
    .item .meta-row span.borderline { background:rgba(240,160,42,.14); color:#a8680a; }
    .source-btn { margin-top:14px; padding:8px 14px; border:1px solid var(--glass-border); background:rgba(255,255,255,.5); color:var(--accent); cursor:pointer; border-radius:11px; font-size:13px; font-weight:600; align-self:flex-start; transition:all .14s; }
    .source-btn:hover { background:var(--accent-soft); border-color:var(--accent2); }
    .ranking-notes { margin:0 0 12px; padding-left:20px; color:var(--ink-soft); line-height:1.55; font-size:13.5px; }
    .ranking-table-wrap { width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.54); }
    .ranking-table { width:100%; min-width:680px; border-collapse:collapse; font-size:12.5px; }
    .ranking-table th,.ranking-table td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    .ranking-table th { color:var(--ink); background:rgba(208,95,63,.08); font-weight:700; }
    .ranking-table td:first-child,.ranking-table th:first-child { text-align:right; }
    .ranking-table tbody tr:last-child td { border-bottom:0; }
    .empty { display:none; padding:48px; border:1px dashed var(--line-strong); color:var(--muted); text-align:center; background:var(--glass); border-radius:18px; }
    .empty.visible { display:block; }

    /* Drawer */
    .overlay { position:fixed; inset:0; display:none; background:rgba(26,36,54,.3); backdrop-filter:blur(3px); }
    .overlay.open { display:block; }
    .drawer { position:fixed; top:0; right:0; width:min(440px,100vw); height:100vh; transform:translateX(100%); transition:.22s cubic-bezier(.4,0,.2,1); background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border-left:1px solid var(--glass-border); box-shadow:-18px 0 44px rgba(31,45,75,.16); padding:24px; overflow:auto; }
    .drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:8px; }
    .drawer h2 { font-size:17px; line-height:1.4; }
    #drawerNote { color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .source-card { border:1px solid var(--glass-border); padding:13px 15px; margin-top:10px; border-radius:12px; background:rgba(255,255,255,.55); }
    .source-card strong { font-size:13px; color:var(--ink); }
    .source-url { display:block; margin-top:6px; color:var(--accent); overflow-wrap:anywhere; user-select:text; font-size:12.5px; text-decoration:none; }
    a.source-url:hover { text-decoration:underline; }
    a.source-url:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

    @media (max-width:900px) {
      .app { grid-template-columns:1fr; }
      aside.sidebar { position:relative; height:auto; }
      .nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
      main { padding:22px 18px 36px; }
      .topbar,.section-head { align-items:stretch; flex-direction:column; }
      .search { width:100%; }
      .metrics,.grid { grid-template-columns:1fr; }
      .section-banner { flex-wrap:wrap; }
      .section-banner .banner-desc { margin-left:0; width:100%; }
    }
    @media print {
      body::before { display:none; }
      aside.sidebar,.actions,.toggle,.source-btn,.drawer,.overlay { display:none!important; }
      .app { display:block; }
      main { padding:0; }
      .item { break-inside:avoid; box-shadow:none; border-color:#bbb; backdrop-filter:none; background:#fff; }
      .section-banner { break-after:avoid; }
    }
  .rank-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}.rank-table th,.rank-table td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;}.rank-table th{color:var(--rankings-ink);background:var(--rankings-soft);font-weight:600;}.rank-table tbody tr:hover{background:rgba(208,95,63,.05);}.rank-table tr.hl td{background:rgba(208,95,63,.13);}.rank-table tr.hl td strong{color:var(--rankings-ink,#93402b);font-weight:700;}.new-tag{display:inline-block;background:var(--rankings);color:#fff;padding:1px 7px;border-radius:7px;font-size:11px;}
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand" aria-label="沐瞳科技">
        <div class="brand-mark" aria-hidden="true"><img src="../../assets/moonton_logo.png" alt=""></div>

    <main>
      <div class="topbar">
        <div><h1>游戏行业周报</h1><div class="subtitle">2026-06-19 ~ 2026-06-25 · steam周榜、行业新闻、AI、产品日历、玩家舆论与精选观察</div></div>
        <div class="actions">

eport-tencent-mulling-exits-from-multiple-japanese-studios"], ["S0921", "中日关系迷局，腾讯“盘整”日本游戏资产：赔本出售日本Marvelous股权", "http://www.gamelook.com.cn/2026/06/596088/"], ["S0940", "消息称腾讯拟退出对多家日本游戏工作室的投资，《牧场物语》开发商在列", "http://www.yystv.net/p/14093"]]}, {"section": "industry", "title": "快手《诡秘之主》MMO 公开千人团队规格，祖龙《愚者》首曝引 IP 双线竞争", "body": "6月22日，快手弹指宇宙《诡秘之主》官方公开团队规格：制作人为原网易雷火《逆水寒》制作人徐杰，团队 624 人、2022 年立项、UE5 PC/移动双端，总成本超十亿元，IP 授权费占比极低。这场\"自证\"被解读为对二测招募及\"学生军\"\"人力不足\"质疑的回应。直接刺激点是 6月17日祖龙娱乐首曝同 IP 卡牌 RPG《诡秘之主：愚者》（小说+动画双授权，B站 PV 破百万），令诡秘 IP 游戏从独占变为\"二选一\"。", "body_html": "<p>6月22日，快手弹指宇宙《诡秘之主》官方公开团队规格：制作人为原网易雷火《逆水寒》制作人徐杰，团队 624 人、2022 年立项、UE5 PC/移动双端，总成本超十亿元，IP 授权费占比极低。这场\"自证\"被解读为对二测招募及\"学生军\"\"人力不足\"质疑的回应。直接刺激点是 6月17日祖龙娱乐首曝同 IP 卡牌 RPG《诡秘之主：愚者》（小说+动画双授权，B站 PV 破百万），令诡秘 IP 游戏从独占变为\"二选一\"。</p>", "meta": ["诡秘之主", "愚者", "网易"], "sources": [["S0521", "快手自曝新游阵容：原《逆水寒》制作人带队，624人团队，开发成本超十亿", "https://www.youxituoluo.com/534602.html"], ["S0702", "《诡秘之主》MMO急了？自证实力：624人花了10亿，制作人“真·前网易大佬”", "http://www.gamelook.com.cn/2026/06/595963/"], ["S0335", "“二游《诡秘之主》首曝，这个可以有”！UE5女性向新作之后，祖龙放新大招", "http://www.gamelook.com.cn/2026/06/595748/"]]}, {"section": "industry", "title": "字节朝夕光年动作搜打撤新作《雾影猎人》定档 7 月 30 日", "body": "朝夕光年发行、Bellring 工作室开发的黑暗奇幻动作搜打撤游戏《雾影猎人》完成新一轮公测，预计 7月30日发售。团队约 70 人，将\"动作、黑暗奇幻、搜打撤循环\"定为三大支柱，把传统射击搜打撤的枪线、掩体替换为近战距离、攻击朝向与翻滚时机。该赛道此前已有北极光 Dungeonborne、KRAFTON DaDM、鹰角\"湍流\"、网易《诡影藏锋》等多方试水，仍未跑出稳定样本，字节以小团队抢跑动作向细分。", "body_html": "<p>朝夕光年发行、Bellring 工作室开发的黑暗奇幻动作搜打撤游戏《雾影猎人》完成新一轮公测，预计 7月30日发售。团队约 70 人，将\"动作、黑暗奇幻、搜打撤循环\"定为三大支柱，把传统射击搜打撤的枪线、掩体替换为近战距离、攻击朝向与翻滚时机。该赛道此前已有北极光 Dungeonborne、KRAFTON DaDM、鹰角\"湍流\"、网易《诡影藏锋》等多方试水，仍未跑出稳定样本，字节以小团队抢跑动作向细分。</p>", "meta": ["雾影猎人", "诡影藏锋", "网易"], "sources": [["S0513", "字节游戏70人抢跑动作搜打撤，制作人：赛道没有标准答案", "https://cgames.com/contents/2/11959.html"]]}, {"section": "industry", "title": "B站首入 CCG 赛道，《激战：大牌英雄》全球首曝", "body": "6月21日，《激战》衍生 CCG 新游《激战：大牌英雄》全球首曝、国服开放预约。该作获《激战》正版授权，由韩国 NC 研发、ArenaNet 监修、bilibili 全球发行。玩法跳出\"固定站位、回合对打\"框架，采用 5×3 网格动态战场，指挥官与手牌同场可移动走位，引入 MMO 的拉扯、集火、击飞，独创\"指挥官×职业\"双轴构筑。这是 B站首次布局 CCG 即挑战全球发行，背靠 ArenaNet 新作《激战3》官宣热度。", "body_html": "<p>6月21日，《激战》衍生 CCG 新游《激战：大牌英雄》全球首曝、国服开放预约。该作获《激战》正版授权，由韩国 NC 研发、ArenaNet 监修、bilibili 全球发行。玩法跳出\"固定站位、回合对打\"框架，采用 5×3 网格动态战场，指挥官与手牌同场可移动走位，引入 MMO 的拉扯、集火、击飞，独创\"指挥官×职业\"双轴构筑。这是 B站首次布局 CCG 即挑战全球发行，背靠 ArenaNet 新作《激战3》官宣热度。</p>", "meta": ["激战：大牌英雄", "激战3"], "sources": [["S0261", "CCG新游《激战：大牌英雄》全球首曝，国服预约抢先开启！", "https://youxichaguan.com/archives/200318"], ["S0344", "暴雪出走的技术骨干，要和B站一起打破CCG祖宗之法", "https://youxichaguan.com/archives/200325"]]}, {"section": "industry", "title": "Newzoo：2025 年全球游戏收入首破 2000 亿美元，移动端 1133 亿", "body": "Newzoo 报告显示，2025 年全球游戏市场收入达 2016 亿美元，首次突破 2000 亿、同比增长 9.1%。移动端收入 1133 亿美元、同比增长 10.7%，占比过半，但全球下载量下滑，增长更多来自变现强度而非用户扩张，CPI 同比涨 30% 至 0.56 美元。PC 端 436 亿美元、同比增长 12%，创 Newzoo 史上最高年增速；主机端仅微增 2.8%，微交易收入下滑 4.6%，AI 推高存储芯片价格正令硬件涨价。", "body_html": "<p>Newzoo 报告显示，2025 年全球游戏市场收入达 2016 亿美元，首次突破 2000 亿、同比增长 9.1%。移动端收入 1133 亿美元、同比增长 10.7%，占比过半，但全球下载量下滑，增长更多来自变现强度而非用户扩张，CPI 同比涨 30% 至 0.56 美元。PC 端 436 亿美元、同比增长 12%，创 Newzoo 史上最高年增速；主机端仅微增 2.8%，微交易收入下滑 4.6%，AI 推高存储芯片价格正令硬件涨价。</p>", "meta": ["市场数据"], "sources": [["S0039", "Global Games revenue surpasses $200bn for the first time, mobile generates $113bn", "https://www.pocketgamer.biz/global-games-revenue-surpasses-200bn-for-the-first-time-mobile-generates-113bn/"], ["S0004", "Newzoo 报告：2025 年全球游戏市场收入首次突破 2000 亿美元，移动端与 PC 增长强劲", "https://www.gcores.com/articles/216109"], ["S0524", "2025年全球游戏营收首破2000亿美元大关，PC狂飙、AI致硬件暴涨", "https://www.youxituoluo.com/534604.html"]]}, {"section": "industry", "title": "GTA6 定价 79.99 美元，实体版无碟仅含\"盒内兑换码\"", "body": "Rockstar 确认《GTA6》标准版售 79.99 美元、终极版 99.99 美元，6月25日开启预购，11月19日登陆 PS5 与 Xbox Series X|S，11月12日开放预载。实体版不含光盘，盒内仅为下载兑换码，被认为意在防泄露，多家零售商已就此下架实体版，港区预购 568 港币起。分析师预计首 12 个月售 3000-3800 万份、逾 30 亿美元；定价站上 79.99 美元，进一步抬高 3A 单机全球定价基准。", "body_html": "<p>Rockstar 确认《GTA6》标准版售 79.99 美元、终极版 99.99 美元，6月25日开启预购，11月19日登陆 PS5 与 Xbox Series X|S，11月12日开放预载。实体版不含光盘，盒内仅为下载兑换码，被认为意在防泄露，多家零售商已就此下架实体版，港区预购 568 港币起。分析师预计首 12 个月售 3000-3800 万份、逾 30 亿美元；定价站上 79.99 美元，进一步抬高 3A 单机全球定价基准。</p>", "meta": ["GTA6"], "sources": [["S0726", "GTA 6 will launch at $79.99 and will be download only", "https://www.gamesindustry.biz/gta-6-will-launch-at-7999-and-will-be-download-only"], ["S0746", "Rockstar confirms Grand Theft Auto 6 Ultimate Edition and pre-order bonuses as well as price", "https://www.videogameschronicle.com/news/rockstar-confirms-grand-theft-auto-6-ultimate-edition-and-pre-order-bonuses-but-still-no-price/"], ["S0747", "Rockstar confirms there will be no disc version of GTA 6 at launch", "https://www.videogameschronicle.com/news/rockstar-confirms-there-will-be-no-disc-version-of-gta6-at-launch/"], ["S0696", "《GTA VI》售价公布：标准版 79.99 美元，终极版 99.99 美元", "https://www.gcores.com/articles/216345"], ["S0950", "GTA 6 sales predictions: how many copies will Rockstar sell at $80?", "https://www.gamesindustry.biz/gta-6-sales-predictions-how-many-copies-will-rockstar-sell-at-80"], ["S0981", "GTA 6 disc version will reportedly be coming in December, insider claims", "https://www.videogameschronicle.com/news/gta-6-disc-version-will-reportedly-be-coming-in-december-insider-claims/"], ["S0884", "568港币起：《GTA6》港区预购现已开启，多人模式或将拆分推出", "https://www.gcores.com/articles/216346"], ["S0910", "多家零售商下架《GTA 6》实体版，因确认实体版为盒内兑换码", "https://www.gcores.com/articles/216392"]]}, {"section": "industry", "title": "Steam Machine 定价 1049 美元起，AI 致硬件涨价令原定价\"无法实现\"", "body": "Valve 公布 Steam Machine 定价：512GB 版 1049 美元、2TB 版 1349 美元，配手柄再加 75 美元，抽签预约、6月29日起首批发货。Valve 称原定目标售价因硬件价格与供货\"已无法实现\"，当前定价反映过去六个月采购成本，近月内存与存储价格暴涨源于 AI 超算企业买断库存。该机比涨价后 PS5 数字版贵约 75%，性能约与普通版 PS5 持平；同步放出可在任意 PC 运行的 SteamOS 3.8。", "body_html": "<p>Valve 公布 Steam Machine 定价：512GB 版 1049 美元、2TB 版 1349 美元，配手柄再加 75 美元，抽签预约、6月29日起首批发货。Valve 称原定目标售价因硬件价格与供货\"已无法实现\"，当前定价反映过去六个月采购成本，近月内存与存储价格暴涨源于 AI 超算企业买断库存。该机比涨价后 PS5 数字版贵约 75%，性能约与普通版 PS5 持平；同步放出可在任意 PC 运行的 SteamOS 3.8。</p>", "meta": [], "sources": [["S0535", "Valve's Steam Machine price starts at $1049 / £879; original pricing \"no longer viable\" due to hardware supply issues", "https://www.gamesindustry.biz/valves-steam-machine-price-starts-at-1049-879-original-pricing-no-longer-viable-due-to-hardware-supply-issues"], ["S0539", "\"This is going to be a niche device\" – Analysts react to the $1,000+ Steam Machine price reveal", "https://www.gamesindustry.biz/this-is-going-to-be-a-niche-device-analysts-react-to-the-1000-steam-machine-price-reveal"], ["S0698", "Steam主机“太贵”玩家吵翻天！比PS5价格高75%、配置更低！", "http://www.gamelook.com.cn/2026/06/595941/"], ["S0942", "V社新主机正式公布：7000元“低配机”，玩家风评急转直下", "http://www.yystv.net/p/14088"], ["S0504", "Steam Machine 售价超 1000 欧元，Valve 透露内存厂商定价压力", "https://www.gcores.com/articles/216276"]]}, {"section": "industry", "title": "巴西因开箱机制重罚多家平台与大厂，腾讯及拳头被罚约 8500 万元", "body": "6月17日，巴西联邦法院判罚苹果、谷歌、微软、索尼、任天堂、Valve、EA、育碧、腾讯等合计 2.98 亿雷亚尔，其中腾讯及子公司拳头合计被罚 6500 万雷亚尔（约 8500 万元）。判决依据\"ECA Digital\"数字儿童和青少年法，该法将开箱机制限为仅 18 岁以上可用；法官援引现行消费者与儿童保护法，认定这种\"数字轮盘赌\"机制即可能构成虐待。从法规生效到开罚不足三个月，远短于通常 12-24 个月缓冲期。", "body_html": "<p>6月17日，巴西联邦法院判罚苹果、谷歌、微软、索尼、任天堂、Valve、EA、育碧、腾讯等合计 2.98 亿雷亚尔，其中腾讯及子公司拳头合计被罚 6500 万雷亚尔（约 8500 万元）。判决依据\"ECA Digital\"数字儿童和青少年法，该法将开箱机制限为仅 18 岁以上可用；法官援引现行消费者与儿童保护法，认定这种\"数字轮盘赌\"机制即可能构成虐待。从法规生效到开罚不足三个月，远短于通常 12-24 个月缓冲期。</p>", "meta": ["腾讯", "Apple"], "sources": [["S0334", "巴西处罚“抽卡开箱游戏”！腾讯拳头被罚8500万元，苹果谷歌V社索尼任天堂在列", "http://www.gamelook.com.cn/2026/06/595742/"]]}, {"section": "industry", "title": "Google Play 自 6 月 30 日起下调抽成并开放计费选择", "body": "Google 宣布自 6月30日起（先在美英及欧洲经济区）调整 Google Play 商业模式：将服务费与计费费分离，首 100 万美元年收入的服务费降至 10%，自动续订订阅同样适用 10%。开发者可提供替代计费或将用户引导至自有网站购买，并按指引自建计费界面。该变化源于今年 3 月 Google 与 Epic 的和解；据测算多数规模开发者抽成实际约降至 25%，加入 9月30日上线的\"Level Up\"计划可再降 5%。", "body_html": "<p>Google 宣布自 6月30日起（先在美英及欧洲经济区）调整 Google Play 商业模式：将服务费与计费费分离，首 100 万美元年收入的服务费降至 10%，自动续订订阅同样适用 10%。开发者可提供替代计费或将用户引导至自有网站购买，并按指引自建计费界面。该变化源于今年 3 月 Google 与 Epic 的和解；据测算多数规模开发者抽成实际约降至 25%，加入 9月30日上线的\"Level Up\"计划可再降 5%。</p>", "meta": [], "sources": [["S0971", "Google Play expands billing options and lowers fees for developers", "https://www.pocketgamer.biz/google-play-expands-billing-options-and-lowers-fees-for-developers/"], ["S0979", "Google Play opens up billing options and lowers store fees from June 30", "https://mobilegamer.biz/google-play-opens-up-billing-options-and-drops-store-fees-from-june-30/"]]}, {"section": "industry", "title": "EA 推出游戏内置广告平台 EA Advertising", "body": "EA 公布游戏内广告平台 EA Advertising，以动态植入将现实品牌实时融入《EA SPORTS FC》《Madden NFL》《模拟人生》等旗下游戏。已合作品牌包括 Visa、红牛、State Farm、Coach、Vans 等，形式涵盖体育场标识与记分牌广告位、定制球衣礼包、联名服饰家具。与此同时，Kotaku 报道 EA 正再次裁减招聘、客服、信任与安全及 IT 团队，距其 550 亿美元私有化协议约八个月。", "body_html": "<p>EA 公布游戏内广告平台 EA Advertising，以动态植入将现实品牌实时融入《EA SPORTS FC》《Madden NFL》《模拟人生》等旗下游戏。已合作品牌包括 Visa、红牛、State Farm、Coach、Vans 等，形式涵盖体育场标识与记分牌广告位、定制球衣礼包、联名服饰家具。与此同时，Kotaku 报道 EA 正再次裁减招聘、客服、信任与安全及 IT 团队，距其 550 亿美元私有化协议约八个月。</p>", "meta": ["EA SPORTS FC", "Madden NFL"], "sources": [["S0699", "EA“想赚钱”！高调公布“3A游戏内置广告系统”，玩家集体说不！", "http://www.gamelook.com.cn/2026/06/595950/"], ["S0371", "Hot Five: EA Advertising, Roblox Kids accounts, and six months of Where Winds Meet on mobile", "https://www.pocketgamer.biz/hot-five-ea-advertising-roblox-kids-accounts-and-six-months-of-where-winds-meet-on-mobile/"], ["S0538", "EA is reportedly laying off recruitment, customer support, safety, and IT staff", "https://www.gamesindustry.biz/ea-is-reportedly-laying-off-recruitment-customer-support-safety-and-it-staff"], ["S0499", "EA 被曝再次裁员，涉及招聘、客服、安全与 IT 团队", "https://www.gcores.com/articles/216249"]]}, {"section": "ai", "title": "Game Oracle 报告：声明使用 AI 的 Steam 游戏首月评论数降约 52.6%", "body": "游戏数据机构 Game Oracle 分析了 2025 年 1 至 10 月 Steam 上 9879 款商业游戏（剔除免费与垃圾游戏后），其中 17.9% 披露使用了 AI。在用因果模型控制开发者经验、发行商支持、品类与发布月份等变量后，声明使用 AI 的一方首月评论数平均减少约 52.6%（即非 AI 游戏获 100 条时 AI 游戏约 47 条），关注者中位数也仅为非 AI 游戏的约一半。研究称这种\"AI 污名\"对低质游戏几乎无影响，却严重惩罚高潜力游戏；由于 Valve 要求开发者披露 AI 使用，该结论在海外社区引发逾万赞、1300 余条评论的热议。", "body_html": "<p>游戏数据机构 Game Oracle 分析了 2025 年 1 至 10 月 Steam 上 9879 款商业游戏（剔除免费与垃圾游戏后），其中 17.9% 披露使用了 AI。在用因果模型控制开发者经验、发行商支持、品类与发布月份等变量后，声明使用 AI 的一方首月评论数平均减少约 52.6%（即非 AI 游戏获 100 条时 AI 游戏约 47 条），关注者中位数也仅为非 AI 游戏的约一半。研究称这种\"AI 污名\"对低质游戏几乎无影响，却严重惩罚高潜力游戏；由于 Valve 要求开发者披露 AI 使用，该结论在海外社区引发逾万赞、1300 余条评论的热议。</p>", "meta": [], "sources": [["S0900", "AI披露导致Steam游戏销量跌超50%，游戏调研公司警告「灾难性」后果", "https://www.gcores.com/articles/216351"], ["S0919", "数据报告实锤：“游戏用AI、游戏Steam销量少50%”！玩家乐了、开发者怕了", "http://www.gamelook.com.cn/2026/06/596076/"], ["S0939", "对近万款Steam游戏的统计显示，使用AI确实会影响销量", "http://www.yystv.net/p/14085"]]}, {"section": "ai", "title": "米哈游上线 AI 陪伴应用《BSide: Olivia Lin》", "body": "6月18日，米哈游在 Steam 上线《BSide: Olivia Lin》，其类型标注为 Application 而非 Game，是一款围绕虚拟角色\"林离\"的桌面陪伴软件，提供钢琴演奏、上传 MIDI 自动生成音乐视频、书信互动等功能。该产品由 2025 年 9 月成立的上海米哈游稻海桑田科技开发，2025 年 11 月注册商标，并自 2025 年 8 月起在 B站铺垫角色运营近一年。这被视为米哈游\"未来三年最多投入 1000 亿元深耕 AI\"后的具体落子；同期蔡浩宇旗下 Anuttacon 公开 arXiv 论文，让 100 个 AI 角色在三个虚构社会各生活十年以训练更擅长角色扮演的模型。", "body_html": "<p>6月18日，米哈游在 Steam 上线《BSide: Olivia Lin》，其类型标注为 Application 而非 Game，是一款围绕虚拟角色\"林离\"的桌面陪伴软件，提供钢琴演奏、上传 MIDI 自动生成音乐视频、书信互动等功能。该产品由 2025 年 9 月成立的上海米哈游稻海桑田科技开发，2025 年 11 月注册商标，并自 2025 年 8 月起在 B站铺垫角色运营近一年。这被视为米哈游\"未来三年最多投入 1000 亿元深耕 AI\"后的具体落子；同期蔡浩宇旗下 Anuttacon 公开 arXiv 论文，让 100 个 AI 角色在三个虚构社会各生活十年以训练更擅长角色扮演的模型。</p>", "meta": ["米哈游"], "sources": [["S0325", "米哈游公布PC应用《BSide：Olivia Lin》，为AI陪伴型软件", "https://www.gcores.com/articles/216213"], ["S0397", "米哈游千亿豪赌AI后，拿出了一款新作", "https://cgames.com/contents/2/11948.html"], ["S0519", "只是一个音乐播放器？米哈游AI新作Steam页面今日上线", "https://www.youxituoluo.com/534600.html"], ["S0704", "米哈游的“AI狂想”：AI女友成真，100个角色在3个世界“活了十年”", "http://www.gamelook.com.cn/2026/06/595961/"]]}, {"section": "release", "title": "弧光猎人（ARC Raiders）", "body": "腾讯发行的搜打撤射击游戏《弧光猎人（ARC Raiders）》于 6 月 24 日在 PC/主机开启国服限量删档不付费测试；该作国服首测踩中当前最热的搜打撤赛道，是腾讯在该品类的关键卡位。", "body_html": "<p>腾讯发行的搜打撤射击游戏《弧光猎人（ARC Raiders）》于 6 月 24 日在 PC/主机开启国服限量删档不付费测试；该作国服首测踩中当前最热的搜打撤赛道，是腾讯在该品类的关键卡位。</p>", "meta": ["腾讯", "搜打撤"], "sources": [["S0413", "弧光猎人（ARC Raiders） PC/主机 - 测试预下载开启,6月24日开测", "https://www.3839.com/a/181984.htm"], ["S0777", "弧光猎人（ARC Raiders） - 限量删档不付费 的关键测试。</p>", "meta": ["三国志：王道天下", "自走棋", "SLG"], "sources": [["S0705", "我实在想不到，B站第二款SLG竟敢这么玩", "https://cgames.com/contents/2/11971.html"], ["S0721", "当SLG走向数值膨胀的瓶颈，B站的新作想从底层破局", "https://new.qq.com/rain/a/20260624A0AZNP00"]]}, {"section": "release", "title": "三国火凤燎原", "body": "bilibili 发行的策略战棋手游《三国火凤燎原》于 6 月 24 日首曝并开启测试招募；改编自连载二十余年、B站动画播放破 1.5 亿的漫画《火凤燎原》，以\"谋士卡牌+战棋\"切入少见的智谋向战棋。", "body_html": "<p>bilibili 发行的策略战棋手游《三国火凤燎原》于 6 月 24 日首曝并开启测试招募；改编自连载二十余年、B站动画播放破 1.5 亿的漫画《火凤燎原》，以\"谋士卡牌+战棋\"切入少见的智谋向战棋。</p>", "meta": ["三国火凤燎原", "卡牌"], "sources": [["S0947", "B站又曝光了一款三国游戏，这次是战棋？", "https://new.qq.com/rain/a/20260625A08WQN00"]]}, {"section": "release", "title": "代号：新生—动物搜打撤新游", "body": "一款搜打撤射击手游《代号：新生—动物搜打撤新游》于 6 月 23 日追加测试资格并定档 7 月 2 日开启首测；以动物题材切入搜打撤赛道，是该热门品类的又一新进入者。", "body_html": "<p>一款搜打撤射击手游《代号：新生—动物搜打撤新游》于 6 月 23 日追加测试资格并定档 7 月 2 日开启首测；以动物题材切入搜打撤赛道，是该热门品类的又一新进入者。</p>", "meta": ["搜打撤"], "sources": [["S0601", "代号：新生-动物搜打撤新游 招募中 - 资格追加！定档7月2日开启首测", "https://www.3839.com/a/195725.htm"]]}, {"section": "release", "title": "闪之轨迹：北方战役", "body": "杭州凤侠网络发行的二次元 RPG 手游《闪之轨迹：北方战役》于 6 月 25 日正式上线；Falcom\"轨迹\"系列 IP 的授权手游落地，面向系列剧情粉丝。", "body_html": "<p>杭州凤侠网络发行的二次元 RPG 手游《闪之轨迹：北方战役》于 6 月 25 日正式上线；Falcom\"轨迹\"系列 IP 的授权手游落地，面向系列剧情粉丝。</p>", "meta": ["闪之轨迹：北方战役", "二游"], "sources": [["S1013", "闪之轨迹：北方战役 - 上线", "https://www.16p.com/1945787.html"], ["S1044", "闪之轨迹：北方战役 - 11:00 正式上线", "https://www.3839.com/a/187721.htm"], ["S1085", "闪之轨迹：北方战役 - 首发 (11:00 开始)", "https://www.taptap.cn/app/777971"]]}, {"section": "discourse", "title": "《恋与深空》第六男主\"狼人\"敖尹空降，建模与产能分配引发玩家差评", "body": "6月22日傍晚，叠纸通过临时安排的\"超级圆月倒计时\"直播公开《恋与深空》第六位男主、代号\"狼人\"的敖尹（设定为 EonCore 科技董事长、拥有\"金属化\"Evol 能力），概念 PV《逐夜》当晚 19:30 公开，角色将随 7 月 9 日 6.0 版本上线。玩家不满的核心有两点：一是从超级圆月、兽类脚印到 PV 不足一天的\"空降\"宣发缺乏铺垫，\"是狼人就叫嗷噫\"被讽名字敷衍、建模\"太丑\"、\"兽耳董事长太抽象\"；二是更深层的产能焦虑——每增加一名男主就挤占已有角色排期，有玩家称\"夏以昼主线已 500 天未更\"，敖尹恰好撞在用户对内容排期长期不满的枪口上。事件当晚冲上微博热搜第一，PV 评论一小时近 20 万，NGA 主帖从 64 回复扩至 6 月 25 日的 147 回复/8 页，争论持续两极；GameLook 等媒体跟进分析，官方微博大量回复安抚并暗示敖尹或有\"反差萌\"，但需待 7 月 9 日实装验证。", "body_html": "<p>6月22日傍晚，叠纸通过临时安排的\"超级圆月倒计时\"直播公开《恋与深空》第六位男主、代号\"狼人\"的敖尹（设定为 EonCore 科技董事长、拥有\"金属化\"Evol 能力），概念 PV《逐夜》当晚 19:30 公开，角色将随 7 月 9 日 6.0 版本上线。玩家不满的核心有两点：一是从超级圆月、兽类脚印到 PV 不足一天的\"空降\"宣发缺乏铺垫，\"是狼人就叫嗷噫\"被讽名字敷衍、建模\"太丑\"、\"兽耳董事长太抽象\"；二是更深层的产能焦虑——每增加一名男主就挤占已有角色排期，有玩家称\"夏以昼主线已 500 天未更\"，敖尹恰好撞在用户对内容排期长期不满的枪口上。事件当晚冲上微博热搜第一，PV 评论一小时近 20 万，NGA 主帖从 64 回复扩至 6 月 25 日的 147 回复/8 页，争论持续两极；GameLook 等媒体跟进分析，官方微博大量回复安抚并暗示敖尹或有\"反差萌\"，但需待 7 月 9 日实装验证。</p>", "meta": ["恋与深空", "逐夜", "叠纸"], "sources": [["S0452", "[新瓜]恋与深空上线第六位男主，但社区反响较差", "https://bbs.nga.cn/read.php?tid=47033220&forder_by=postdatedesc"], ["S1094", "[新瓜]恋与深空上线第六位男主，但社区反响较差", "https://bbs.nga.cn/read.php?tid=47033220&forder_by=postdatedesc"], ["S0703", "《恋与深空》第六男主“狼人”，玩家不买单？", "http://www.gamelook.com.cn/2026/06/595992/"], ["S0522", "热搜第一，叠纸《恋与深空》首曝新男主“狼人”敖尹", "https://www.youxituoluo.com/534603.html"]]}, {"section": "discourse", "title": "《尘白禁区》新版本延期至 7 月 16 日，玩家以\"欢呼胜利\"反讽自嘲", "body": "6月17日，《尘白禁区》游戏内通告显示当前版本至少延期至 7 月 16 日。该消息在社区引发的不是单纯抗议，而是粉丝以反讽口吻\"欢呼胜利\"\"赢赢赢\"，自我安慰延期意味着周年庆将\"端出顶级饺子\"、质量精益求精、甚至可能与周年庆合并推出。被指自欺的情绪集中在高赞回复\"其实男生很单纯，他们会自己骗自己\"\"臣等正欲死战，陛下何故先降\"等调侃中，本质是用自嘲消解对版本停滞与运营状况的不满。主帖热度持续走高，从 6 月 19 日的 101 回复/6 页扩至 6 月 24 日的 135 回复/7 页，后段开始出现\"都开始裁员了还搁这胜利\"等转向质疑的声音；截至本地窗口内未见官方对延期给出新说明或补偿。", "body_html": "<p>6月17日，《尘白禁区》游戏内通告显示当前版本至少延期至 7 月 16 日。该消息在社区引发的不是单纯抗议，而是粉丝以反讽口吻\"欢呼胜利\"\"赢赢赢\"，自我安慰延期意味着周年庆将\"端出顶级饺子\"、质量精益求精、甚至可能与周年庆合并推出。被指自欺的情绪集中在高赞回复\"其实男生很单纯，他们会自己骗自己\"\"臣等正欲死战，陛下何故先降\"等调侃中，本质是用自嘲消解对版本停滞与运营状况的不满。主帖热度持续走高，从 6 月 19 日的 101 回复/6 页扩至 6 月 24 日的 135 回复/7 页，后段开始出现\"都开始裁员了还搁这胜利\"等转向质疑的声音；截至本地窗口内未见官方对延期给出新说明或补偿。</p>", "meta": ["尘白禁区", "裁员"], "sources": [["S0141", "[新瓜] 尘白禁区新版本至少延期至7月16日，尘白禁区粉丝全面欢呼胜利", "https://bbs.nga.cn/read.php?tid=47002622&forder_by=postdatedesc"], ["S0648", "[新瓜] 尘白禁区新版本至少延期至7月16日，尘白禁区粉丝全面欢呼胜利", "https://bbs.nga.cn/read.php?tid=47002622&_fp=2&forder_by=postdatedesc"], ["S0868", "[新瓜] 尘白禁区新版本至少延期至7月16日，尘白禁区粉丝全面欢呼胜利", "https://bbs.nga.cn/read.php?tid=47002622&_fp=2&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《卡厄斯梦境》国服开服一月追平国际服半年进度且 0 补偿，玩家质疑腾讯代理", "body": "6月16日，玩家爆料腾讯代理的《卡厄斯梦境》国服将于下月上旬把卡池与国际服同步（帖内更精确称内容与卡池在 21+21 天后完全同步），而玩家因追进度被跳过的大量日常与版本活动抽卡资源，官方目前并未做任何补偿。玩家不满的核心在于国服压缩进度却\"0 补偿\"，\"不愧是 tx 完全不装\"；有老玩家称腾讯代理游戏惯于通过改角色、改技能让国际服攻略（玩家称的\"千里眼\"）失效、\"当私服玩\"，讨论一度定调为\"不买初始、不去国际服\"。主帖从 6 月 19 日的 48 回复/3 页扩至 6 月 22 日的 56 回复，后段转入对游戏角色强度的讨论；上述同步压缩与失效手法均为玩家说法，截至本地窗口内未见官方就补偿事宜回应。", "body_html": "<p>6月16日，玩家爆料腾讯代理的《卡厄斯梦境》国服将于下月上旬把卡池与国际服同步（帖内更精确称内容与卡池在 21+21 天后完全同步），而玩家因追进度被跳过的大量日常与版本活动抽卡资源，官方目前并未做任何补偿。玩家不满的核心在于国服压缩进度却\"0 补偿\"，\"不愧是 tx 完全不装\"；有老玩家称腾讯代理游戏惯于通过改角色、改技能让国际服攻略（玩家称的\"千里眼\"）失效、\"当私服玩\"，讨论一度定调为\"不买初始、不去国际服\"。主帖从 6 月 19 日的 48 回复/3 页扩至 6 月 22 日的 56 回复，后段转入对游戏角色强度的讨论；上述同步压缩与失效手法均为玩家说法，截至本地窗口内未见官方就补偿事宜回应。</p>", "meta": ["卡厄斯梦境", "腾讯"], "sources": [["S0147", "[新瓜]《卡厄斯梦境》开服仅一个月追平国际服半年游戏进度且0补偿", "https://bbs.nga.cn/read.php?tid=46997710&forder_by=postdatedesc"], ["S0457", "[新瓜]《卡厄斯梦境》开服仅一个月追平国际服半年游戏进度且0补偿", "https://bbs.nga.cn/read.php?tid=46997710&_fp=2&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《赛博朋克：边缘行者》编剧出面辟谣《鸣潮》联动结局\"非正史\"", "body": "围绕《鸣潮》与《赛博朋克：边缘行者》的联动，社区一度流传\"联动结局为正史\"的说法，《边缘行者》编剧随后出面辟谣，称该联动结局并非正史。玩家梳理后指出，争议源头其实只是有人在 X 上询问\"露西和米丝蒂是否认识\"，编剧回答后被外媒扭曲成\"鸣潮正史\"并被层层转发放大。多数玩家支持辟谣，认为联动剧情本就是 if 线（结局是露西\"做了个好梦但忘了内容\"），\"真不真史\"并不影响。该帖于 6 月 9 日发起，窗口内 6 月 22 日仍有回复，讨论还延伸到与《崩坏：星穹铁道》联动 Saber\"无新地图、全程无配音\"被指敷衍的对比；外媒误传来源已被玩家指认，未见进一步官方说明。", "body_html": "<p>围绕《鸣潮》与《赛博朋克：边缘行者》的联动，社区一度流传\"联动结局为正史\"的说法，《边缘行者》编剧随后出面辟谣，称该联动结局并非正史。玩家梳理后指出，争议源头其实只是有人在 X 上询问\"露西和米丝蒂是否认识\"，编剧回答后被外媒扭曲成\"鸣潮正史\"并被层层转发放大。多数玩家支持辟谣，认为联动剧情本就是 if 线（结局是露西\"做了个好梦但忘了内容\"），\"真不真史\"并不影响。该帖于 6 月 9 日发起，窗口内 6 月 22 日仍有回复，讨论还延伸到与《崩坏：星穹铁道》联动 Saber\"无新地图、全程无配音\"被指敷衍的对比；外媒误传来源已被玩家指认，未见进一步官方说明。</p>", "meta": ["赛博朋克：边缘行者", "鸣潮", "联动"], "sources": [["S0460", "[鸣潮联动][瓜小味甜]赛博朋克边缘行者编剧出来辟谣联动结局非正史", "https://bbs.nga.cn/read.php?tid=46954184"]]}, {"section": "deep", "title": "中国细分品类厂商正攻占全球手游收入榜", "body": "PocketGamer 复盘指出，中国手游已不止在本土领先：按 AppMagic 估算，上月全球收入前 10 的手游中有 6 款由中国厂商发行，若计入海外华人创办的工作室，这一比例在前 100 中约达四成。腾讯凭《王者荣耀》（月约 2.3 亿美元）居全球榜首，但其中约 2.27 亿来自国内，高度依赖本土；真正清晰的\"出海样本\"是世纪华通，旗下点点互动以《Whiteout Survival》等三款产品挤进全球前 30。报告还显示，中国出海榜由生存/4X、合成、抽卡 RPG 三类主导，而国内榜单更偏向 MOBA、射击与成熟本土 IP——这意味着同一批中国厂商，正用与本土截然不同的品类组合在海外建立收入结构。", "body_html": "<p>PocketGamer 复盘指出，中国手游已不止在本土领先：按 AppMagic 估算，上月全球收入前 10 的手游中有 6 款由中国厂商发行，若计入海外华人创办的工作室，这一比例在前 100 中约达四成。腾讯凭《王者荣耀》（月约 2.3 亿美元）居全球榜首，但其中约 2.27 亿来自国内，高度依赖本土；真正清晰的\"出海样本\"是世纪华通，旗下点点互动以《Whiteout Survival》等三款产品挤进全球前 30。报告还显示，中国出海榜由生存/4X、合成、抽卡 RPG 三类主导，而国内榜单更偏向 MOBA、射击与成熟本土 IP——这意味着同一批中国厂商，正用与本土截然不同的品类组合在海外建立收入结构。</p>", "meta": ["王者荣耀", "腾讯", "点点"], "sources": [["S0969", "Beyond Tencent and NetEase: How China's genre specialists took on the global charts", "https://www.pocketgamer.biz/chinese-publishers-hold-six-of-the-top-10-as-the-export-pack-widens/"]]}, {"section": "deep", "title": "Steam 新品节成绩分散，平台发现机制持续向\"上线前\"前移", "body": "GameDiscoverCo 的通讯复盘了 2026 年 6 月 Steam 新品节（Next Fest）\"成绩分散\"的现象，并把视线放在平台发现机制的结构性变化上。其观察是，Steam 主页改版后，个人日历正在强化\"上线前发现\"（pre-launch discovery），让玩家在产品发售前就建立关注与提醒路径；与此同时，Epic Games Store 正加速补齐玩家档案与头像、文字评测、通用手柄支持、配置跑分、第三方社区与更新日志等功能，向 Steam 的平台能力看齐。对发行方而言，这意味着\"发售当天冲榜\"之外，上线前的愿望单与日历沉淀、以及多平台的功能对等，正成为发现与转化的新变量。", "body_html": "<p>GameDiscoverCo 的通讯复盘了 2026 年 6 月 Steam 新品节（Next Fest）\"成绩分散\"的现象，并把视线放在平台发现机制的结构性变化上。其观察是，Steam 主页改版后，个人日历正在强化\"上线前发现\"（pre-launch discovery），让玩家在产品发售前就建立关注与提醒路径；与此同时，Epic Games Store 正加速补齐玩家档案与头像、文字评测、通用手柄支持、配置跑分、第三方社区与更新日志等功能，向 Steam 的平台能力看齐。对发行方而言，这意味着\"发售当天冲榜\"之外，上线前的愿望单与日历沉淀、以及多平台的功能对等，正成为发现与转化的新变量。</p>", "meta": [], "sources": [["S0882", "Who 'won' June 2026's Steam Next Fest?", "https://newsletter.gamediscover.co/p/who-won-june-2026s-steam-next-fest"], ["S0255", "How Steam's personal calendar is supercharging pre-launch discovery", "https://newsletter.gamediscover.co/p/how-steams-personal-calendar-is-supercharging"]]}, {"section": "rankings", "title": "steam周榜", "body": "steam周榜", "body_html": "<p style=\"color:var(--muted);font-size:13px;margin-bottom:10px;\">说明：本周本地 pipeline 仅采集到 2026-       const node = document.createElement("article");
      node.className = "item";
      node.dataset.section = item.section;
      const metaTags = item.meta.map(m => {
        const cls = isBorderline(m) ? "borderline" : "";
        return `<span class="${cls}">${m}</span>`;
      }).join("");
      const bodyMarkup = item.body_html || `<p>${item.body}</p>`;
      node.innerHTML = `<div class="item-top"><span class="tag">${sectionLabels[item.section]}</span></div><h3>${item.title}</h3>${bodyMarkup}<div class="meta-row">${metaTags}</div><button class="source-btn" type="button">查看来源 →</button>`;
      node.querySelector(".source-btn").addEventListener("click", () => openDrawer(item));
      return node;
    }
    function buildGrid(itemList) {
      const grid = document.createElement("section");
      grid.className = compact ? "grid compact" : "grid";
      itemList.forEach(item => grid.appendChild(renderItem(item)));
      return grid;
    }
    function buildSectionBlock(sectionId, itemList) {
      const block = document.createElement("div");
      block.className = "section-block";
      const banner = document.createElement("div");
      banner.className = "section-banner";
      banner.dataset.section = sectionId;
      banner.innerHTML = `<h2>${sectionLabels[sectionId]}</h2><span class="banner-count">${itemList.length} 条</span><span class="banner-desc">${sectionDescs[sectionId]}</span>`;
      block.appendChild(banner);
      block.appendChild(buildGrid(itemList));
      return block;
    }
    function render() {
      renderNav();
      const query = search.value.trim();
      const filtered = items.filter(item => (currentSection === "all" || item.section === currentSection) && matches(item, query));
      content.innerHTML = "";
      if (currentSection === "all") {
        sectionHead.style.display = "none";
        orderedSectionIds.forEach(sid => {
          const sectionItems = filtered.filter(it => it.section === sid);
          if (sectionItems.length > 0) content.appendChild(buildSectionBlock(sid, sectionItems));
        });
      } else {
        sectionHead.style.display = "flex";
        sectionHead.dataset.section = currentSection;
        document.getElementById("sectionTitle").textContent = sectionLabels[currentSection];
        document.getElementById("sectionDesc").textContent = sectionDescs[currentSection];
        content.appendChild(buildGrid(filtered));
      }
      empty.classList.toggle("visible", filtered.length === 0);
    }
    function openDrawer(item) {
      document.getElementById("drawerTitle").textContent = item.title;
      document.getElementById("drawerNote").textContent = item.body;
      document.getElementById("sourceList").innerHTML = item.sources.map(([id,name,url]) => {
        const safeUrl = String(url || "");
        const isHttp = /^https?:\/\//i.test(safeUrl);
        const linkAttrs = isHttp ? `href="${safeUrl}" target="_blank" rel="noopener noreferrer"` : "";
        const urlEl = isHttp
          ? `<a class="source-url" ${linkAttrs}>${safeUrl} ↗</a>`
          : `<span class="source-url">${safeUrl}</span>`;
        return `<div class="source-card"><strong>${id} · ${name}</strong>${urlEl}</div>`;
      }).join("");
      drawer.classList.add("open"); overlay.classList.add("open");
    }
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
    search.addEventListener("input", render);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    // Sidebar collapse — state persists in localStorage
    const app = document.getElementById("app");
    const SIDEBAR_KEY = "report-sidebar-collapsed";
    try { if (localStorage.getItem(SIDEBAR_KEY) === "1") app.classList.add("collapsed"); } catch (e) {}
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      app.classList.toggle("collapsed");
      try { localStorage.setItem(SIDEBAR_KEY, app.classList.contains("collapsed") ? "1" : "0"); } catch (e) {}
    });
    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("viewGrid").addEventListener("click", () => { compact = false; document.getElementById("viewGrid").classList.add("active"); document.getElementById("viewList").classList.remove("active"); render(); });
    document.getElementById("viewList").addEventListener("click", () => { compact = true; document.getElementById("viewList").classList.add("active"); document.getElementById("viewGrid").classList.remove("active"); render(); });
    render();
  </script>
</body>
</html>
