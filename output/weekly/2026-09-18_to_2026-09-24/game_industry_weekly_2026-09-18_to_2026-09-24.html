<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏行业周报 | 2026-09-18 ~ 2026-09-24</title>
  <style>
    :root {
      --ink:#1a2436; --ink-soft:#3a4862; --muted:#6b7993; --faint:#9aa6bd;
      --accent:#5b6ef5;
      --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78);
      --glass-border:rgba(255,255,255,.7); --line:rgba(31,45,75,.10); --line-strong:rgba(31,45,75,.16);
      --shadow-sm:0 3px 12px rgba(31,45,75,.05);
      --shadow:0 6px 28px rgba(31,45,75,.07);
      --shadow-lg:0 14px 40px rgba(31,45,75,.12);
      --industry:#4f7cff; --industry-soft:rgba(79,124,255,.12); --industry-ink:#2b53c4;
      --ai:#00b3d4; --ai-soft:rgba(0,179,212,.12); --ai-ink:#06748a;
      --release:#16b884; --release-soft:rgba(22,184,132,.13); --release-ink:#0b7a57;
      --discourse:#f0a02a; --discourse-soft:rgba(240,160,42,.15); --discourse-ink:#9a6206;
      --deep:#8b6df0; --deep-soft:rgba(139,109,240,.13); --deep-ink:#5a3fc0;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif; line-height:1.65; -webkit-font-smoothing:antialiased; }
    /* decorative gradient field behind the frosted glass */
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(circle at 12% 18%, rgba(91,110,245,.20), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(0,179,212,.16), transparent 40%),
        radial-gradient(circle at 78% 88%, rgba(139,109,240,.18), transparent 46%),
        radial-gradient(circle at 25% 92%, rgba(22,184,132,.13), transparent 44%),
        linear-gradient(135deg,#eef1fb 0%,#f3effb 48%,#eaf3fc 100%); }
    a { color:inherit; text-decoration:none; }
    button,input { font:inherit; }
    ::selection { background:rgba(91,110,245,.22); }
    .app { min-height:100vh; display:grid; grid-template-columns:264px minmax(0,1fr); transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
    .app.collapsed { grid-template-columns:0 minmax(0,1fr); }

    /* Sidebar — frosted glass */
    aside.sidebar { position:sticky; top:0; height:100vh; padding:24px 18px; color:var(--ink); display:flex; flex-direction:column;
      background:rgba(255,255,255,.48); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
      border-right:1px solid rgba(255,255,255,.55); overflow-y:auto; overflow-x:hidden; transition:transform .25s cubic-bezier(.4,0,.2,1), opacity .2s; }
    .app.collapsed aside.sidebar { transform:translateX(-100%); opacity:0; pointer-events:none; }

    /* Sidebar toggle button (in topbar, always visible) */
    .sidebar-toggle { width:40px; height:40px; border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; border-radius:12px; display:grid; place-items:center; font-size:16px; line-height:1; transition:all .14s; }
    .sidebar-toggle:hover { color:var(--accent); border-color:var(--accent); }
    .sidebar-toggle .icon-open { display:inline; }
    .sidebar-toggle .icon-close { display:none; }
    .app.collapsed .sidebar-toggle .icon-open { display:none; }
    .app.collapsed .sidebar-toggle .icon-close { display:inline; }
    .back-home { width:max-content; display:inline-flex; align-items:center; gap:7px; margin:0 2px 18px; padding:7px 10px; border-radius:9px; color:var(--ink-soft); text-decoration:none; font-size:13px; font-weight:600; transition:background .14s,color .14s,transform .14s; }
    .back-home:hover { background:rgba(255,255,255,.62); color:var(--accent); transform:translateX(-2px); }
    .back-home:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 2px 20px; border-bottom:1px solid var(--line); }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:11px; background:#fff; padding:7px; box-shadow:0 3px 10px rgba(31,45,75,.10); }
    .brand-mark img { width:100%; height:100%; display:block; object-fit:contain; }
    .brand strong { display:block; font-size:15px; line-height:1.1; letter-spacing:.2px; color:var(--ink); }
    .brand span { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
    .nav-title { margin:22px 0 10px; color:var(--faint); font-size:10px; letter-spacing:1.3px; text-transform:uppercase; font-weight:700; }
    .nav { display:grid; gap:3px; }
    .nav button { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; border:0; background:transparent; color:var(--ink-soft); padding:11px 14px; text-align:left; cursor:pointer; border-radius:11px; position:relative; font-size:14px; font-weight:500; transition:all .14s; }
    .nav button:hover { background:rgba(255,255,255,.55); color:var(--ink); }
    .nav button.active { background:rgba(91,110,245,.12); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px rgba(91,110,245,.18); }
    .nav button.active::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--accent2,var(--accent)); }
    .nav button[data-section="industry"] { --accent2:var(--industry); }
    .nav button[data-section="ai"] { --accent2:var(--ai); }
    .nav button[data-section="release"] { --accent2:var(--release); }
    .nav button[data-section="discourse"] { --accent2:var(--discourse); }
    .nav button[data-section="deep"] { --accent2:var(--deep); }
    .count { min-width:24px; padding:1px 9px; color:var(--muted); background:rgba(31,45,75,.07); text-align:center; border-radius:11px; font-size:12px; font-weight:600; }
    .nav button.active .count { background:var(--accent2,var(--accent)); color:#fff; }
    .sidebar-footer { margin:auto -18px -24px; padding:16px 22px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.65; }
    .sidebar-footer .made { color:var(--ink-soft); font-weight:600; }
    .sidebar-footer a { color:var(--accent); }
    .sidebar-footer .stat { margin-top:8px; color:var(--faint); }

    /* Main */
    main { padding:30px 40px 64px; min-width:0; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; line-height:1.25; letter-spacing:-.2px; font-weight:800; color:var(--ink); }
    .subtitle { margin-top:8px; color:var(--muted); font-size:13.5px; }
    .actions { display:flex; gap:10px; align-items:center; }
    .search { width:320px; display:flex; align-items:center; gap:8px; background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); padding:9px 14px; border-radius:12px; transition:border-color .15s, box-shadow .15s; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,110,245,.12); background:#fff; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:13.5px; }
    .search input::placeholder { color:var(--faint); }
    .icon-btn { border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; width:40px; height:40px; border-radius:12px; transition:all .14s; }
    .icon-btn:hover { color:var(--accent); border-color:var(--accent); }

    /* Metrics */
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:30px; }
    .metric { background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); padding:18px 20px; border-radius:18px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden; }
    .metric::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent2,var(--industry)); }
    .metric:nth-child(1) { --accent2:var(--industry); }
    .metric:nth-child(2) { --accent2:var(--release); }
    .metric:nth-child(3) { --accent2:var(--discourse); }
    .metric:nth-child(4) { --accent2:var(--deep); }
    .metric span { color:var(--muted); font-size:12.5px; letter-spacing:.3px; }
    .metric strong { display:block; font-size:26px; line-height:1.1; margin-top:6px; font-weight:800; color:var(--ink); }

    /* Section-head (单 section 视图) */
    .section-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin:6px 0 20px; padding:16px 20px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); border-left:4px solid var(--accent2,var(--industry)); border-radius:18px; box-shadow:var(--shadow-sm); }
    .section-head[data-section="industry"] { --accent2:var(--industry); }
    .section-head[data-section="ai"] { --accent2:var(--ai); }
    .section-head[data-section="release"] { --accent2:var(--release); }
    .section-head[data-section="discourse"] { --accent2:var(--discourse); }
    .section-head[data-section="deep"] { --accent2:var(--deep); }
    h2 { margin:0; font-size:20px; font-weight:700; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .toggle { display:flex; border:1px solid var(--glass-border); background:var(--glass); border-radius:11px; overflow:hidden; }
    .toggle button { padding:8px 15px; border:0; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13px; transition:all .14s; }
    .toggle button.active { background:var(--accent); color:#fff; font-weight:600; }

    /* "全部" 视图下的 section 分块 */
    .section-block { margin-top:38px; min-width:0; }
    .section-block:first-child { margin-top:0; }
    .section-banner { display:flex; align-items:baseline; gap:14px; padding:13px 18px; margin-bottom:16px; background:var(--accent-soft,var(--industry-soft)); border-left:4px solid var(--accent2,var(--industry)); border-radius:14px; }
    .section-banner[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .section-banner[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .section-banner[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .section-banner[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .section-banner[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .section-banner h2 { color:var(--accent-ink); font-size:17px; margin:0; font-weight:700; }
    .section-banner .banner-count { color:var(--accent2); font-weight:700; font-size:13px; }
    .section-banner .banner-desc { color:var(--accent-ink); opacity:.7; font-size:13px; margin-left:auto; }

    /* Cards — glass */
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; min-width:0; }
    .grid.compact { grid-template-columns:1fr; }
    .item { min-width:0; background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); border-left:3px solid var(--accent2,var(--industry)); padding:20px 24px; border-radius:18px; box-shadow:var(--shadow-sm); transition:transform .18s, box-shadow .18s; display:flex; flex-direction:column; }
    .item:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
    .item[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .item[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .item[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .item[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .item[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .item-top { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:11px; }
    .tag { padding:3px 11px; font-size:12px; color:var(--accent-ink); background:var(--accent-soft); border-radius:8px; font-weight:700; letter-spacing:.2px; }
    h3 { margin:2px 0 10px; font-size:17.5px; line-height:1.45; font-weight:700; color:var(--ink); letter-spacing:.1px; }
    .item p { margin:0 0 14px; color:var(--ink-soft); font-size:14.5px; line-height:1.78; }
    .meta-row { display:flex; flex-wrap:wrap; gap:7px; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .meta-row span { padding:3px 10px; background:rgba(31,45,75,.06); border-radius:8px; }
    .item .meta-row span.borderline { background:rgba(240,160,42,.14); color:#a8680a; }
    .source-btn { margin-top:14px; padding:8px 14px; border:1px solid var(--glass-border); background:rgba(255,255,255,.5); color:var(--accent); cursor:pointer; border-radius:11px; font-size:13px; font-weight:600; align-self:flex-start; transition:all .14s; }
    .source-btn:hover { background:var(--accent-soft); border-color:var(--accent2); }
    .ranking-notes { margin:0 0 12px; padding-left:20px; color:var(--ink-soft); line-height:1.55; font-size:13.5px; }
    .ranking-table-wrap { width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.54); }
    .ranking-table { width:100%; min-width:680px; border-collapse:collapse; font-size:12.5px; }
    .ranking-table th,.ranking-table td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    .ranking-table th { color:var(--ink); background:rgba(208,95,63,.08); font-weight:700; }
    .ranking-table td:first-child,.ranking-table th:first-child { text-align:right; }
    .ranking-table tbody tr:last-child td { border-bottom:0; }
    .empty { display:none; padding:48px; border:1px dashed var(--line-strong); color:var(--muted); text-align:center; background:var(--glass); border-radius:18px; }
    .empty.visible { display:block; }

    /* Drawer */
    .overlay { position:fixed; inset:0; display:none; background:rgba(26,36,54,.3); backdrop-filter:blur(3px); }
    .overlay.open { display:block; }
    .drawer { position:fixed; top:0; right:0; width:min(440px,100vw); height:100vh; transform:translateX(100%); transition:.22s cubic-bezier(.4,0,.2,1); background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border-left:1px solid var(--glass-border); box-shadow:-18px 0 44px rgba(31,45,75,.16); padding:24px; overflow:auto; }
    .drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:8px; }
    .drawer h2 { font-size:17px; line-height:1.4; }
    #drawerNote { color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .source-card { border:1px solid var(--glass-border); padding:13px 15px; margin-top:10px; border-radius:12px; background:rgba(255,255,255,.55); }
    .source-card strong { font-size:13px; color:var(--ink); }
    .source-url { display:block; margin-top:6px; color:var(--accent); overflow-wrap:anywhere; user-select:text; font-size:12.5px; text-decoration:none; }
    a.source-url:hover { text-decoration:underline; }
    a.source-url:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

    @media (max-width:900px) {
      .app { grid-template-columns:1fr; }
      aside.sidebar { position:relative; height:auto; }
      .nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
      main { padding:22px 18px 36px; }
      .topbar,.section-head { align-items:stretch; flex-direction:column; }
      .search { width:100%; }
      .metrics,.grid { grid-template-columns:1fr; }
      .section-banner { flex-wrap:wrap; }
      .section-banner .banner-desc { margin-left:0; width:100%; }
    }
    @media print {
      body::before { display:none; }
      aside.sidebar,.actions,.toggle,.source-btn,.drawer,.overlay { display:none!important; }
      .app { display:block; }
      main { padding:0; }
      .item { break-inside:avoid; box-shadow:none; border-color:#bbb; backdrop-filter:none; background:#fff; }
      .section-banner { break-after:avoid; }
    }
  </style>
</head>

  <div class="app" id="app">

    <main>
      <div class="topbar">

莉丝于9月24日首次公开生活模拟游戏《奇遇动物城》，由内部孵化的猫爪拿铁工作室研发。首曝内容展示现代城市、休闲社交与拟人动物居民，玩家还可变成动物；同日日历源记录产品已开放预约，上线时间尚未公布。</p>", "meta": ["奇遇动物城", "莉莉丝", "生活模拟"], "sources": [["S1142", "颠覆常识？莉莉丝今天首曝的生活模拟新游，是人和动物同住的现代都市", "https://m.sohu.com/a/1080473717_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.3.1790294600755XmauGkM"], ["S1312", "奇遇动物城-动物生活模拟 - 首曝预约，上线时间待定", "https://www.3839.com/a/203903.htm"]]}, {"section": "industry", "title": "叠纸认缴逾1亿元成为新创投基金核心出资方", "body": "9月16日，上海叠纸科技进入南京铂睿数智壹号创业投资合伙企业，认缴出资1.0096亿元、出资比例99.9604%；该合伙企业认缴规模同期增至1.01亿元。广州铂睿创业投资有限公司担任执行事务合伙人，形成叠纸主要出资、专业机构负责具体事务的结构。", "body_html": "<p>9月16日，上海叠纸科技进入南京铂睿数智壹号创业投资合伙企业，认缴出资1.0096亿元、出资比例99.9604%；该合伙企业认缴规模同期增至1.01亿元。广州铂睿创业投资有限公司担任执行事务合伙人，形成叠纸主要出资、专业机构负责具体事务的结构。</p>", "meta": ["叠纸"], "sources": [["S0153", "原创丨叠纸成立了一个投资基金，规模超1亿元", "http://www.nadianshi.com/2026/09/420624"]]}, {"section": "industry", "title": "Nexon展示跨端RPG《FAREIDOLIA》，计划明年开启测试", "body": "Nexon旗下IO在东京电玩展公开《FAREIDOLIA》实机；这款全3D美少女收集RPG采用半回合制战斗，并确定跨端发行。团队表示正在准备CBT测试，今年内难以立即启动；游戏还展示了由IO内部开发、可在移动设备本地运行的语音交互AI。", "body_html": "<p>Nexon旗下IO在东京电玩展公开《FAREIDOLIA》实机；这款全3D美少女收集RPG采用半回合制战斗，并确定跨端发行。团队表示正在准备CBT测试，今年内难以立即启动；游戏还展示了由IO内部开发、可在移动设备本地运行的语音交互AI。</p>", "meta": ["FAREIDOLIA"], "sources": [["S0029", "“BA接班人”3D二游《FAREIDOLIA》亮相！NEXON制作人：“对手是所有跨端二游”", "http://www.gamelook.com.cn/2026/09/602493/"]]}, {"section": "industry", "title": "Game Freak公布天气联动手游《雨后晴女》，计划今冬在日本上线", "body": "Game Freak与Chronogate共同开发的《雨后晴女》计划于2026年冬季在日本上线iOS与Android，9月14日起已开启事前登录。作品把现实天气数据接入回合制战斗与角色强化，是Game Freak年内第二款脱离宝可梦IP的原创产品。", "body_html": "<p>Game Freak与Chronogate共同开发的《雨后晴女》计划于2026年冬季在日本上线iOS与Android，9月14日起已开启事前登录。作品把现实天气数据接入回合制战斗与角色强化，是Game Freak年内第二款脱离宝可梦IP的原创产品。</p>", "meta": ["雨后晴女", "联动"], "sources": [["S0031", "宝可梦开发商公布“首款美少女二游”，单挑中日韩大厂！“洗衣服”玩法够奇葩", "http://www.gamelook.com.cn/2026/09/602532/"]]}, {"section": "industry", "title": "莉莉丝投资前《梦幻西游》主策创业公司肥啾科技", "body": "前《梦幻西游》端游主策戴彦祺于今年5月与网易前同事孙沁滢共同创办广州肥啾科技，该公司现已获得莉莉丝与另一位资方投资。公开信息显示，团队目标是“创造一个能自行演化的虚拟世界”；首款产品的具体形态尚未正式公开。", "body_html": "<p>前《梦幻西游》端游主策戴彦祺于今年5月与网易前同事孙沁滢共同创办广州肥啾科技，该公司现已获得莉莉丝与另一位资方投资。公开信息显示，团队目标是“创造一个能自行演化的虚拟世界”；首款产品的具体形态尚未正式公开。</p>", "meta": ["梦幻西游", "网易", "莉莉丝"], "sources": [["S0456", "前《梦幻西游》端游主策获得投资！袁菁未参与，但有莉莉丝", "https://new.qq.com/rain/a/20260921A09XIV00"]]}, {"section": "industry", "title": "NCsoft发行《阿索拉：星之祈愿》首曝试玩，计划2027年全球同步上线移动端", "body": "NCsoft负责全球发行的《阿索拉：星之祈愿》在TGS首次提供试玩，战斗将回合制策略与即时操作结合。团队称游戏预计2027年先登陆iOS和Android，随后推出PC版，并计划面向韩国、日本、美国和欧洲全球同步上市。", "body_html": "<p>NCsoft负责全球发行的《阿索拉：星之祈愿》在TGS首次提供试玩，战斗将回合制策略与即时操作结合。团队称游戏预计2027年先登陆iOS和Android，随后推出PC版，并计划面向韩国、日本、美国和欧洲全球同步上市。</p>", "meta": ["阿索拉：星之祈愿", "IPO"], "sources": [["S0436", "“蔚蓝档案逆徒”TGS露出真身！制作人详解二游《阿索拉》，NCsoft押对了么？", "http://www.gamelook.com.cn/2026/09/602583/"]]}, {"section": "industry", "title": "《潜水员戴夫》手游国际版全球上线，首日登顶韩国、泰国App Store游戏免费榜", "body": "Nexon旗下MINTROCKET开发的《潜水员戴夫》手游国际版于9月17日登陆iOS和Android，上线当日登顶韩国、泰国等市场App Store游戏免费榜。该作全平台全球累计销量已突破1000万套；国内手游版此前由心动网络代理，移动端销量已突破100万套。", "body_html": "<p>Nexon旗下MINTROCKET开发的《潜水员戴夫》手游国际版于9月17日登陆iOS和Android，上线当日登顶韩国、泰国等市场App Store游戏免费榜。该作全平台全球累计销量已突破1000万套；国内手游版此前由心动网络代理，移动端销量已突破100万套。</p>", "meta": ["潜水员戴夫"], "sources": [["S0557", "全球累计销量已破1000万！「潜水员戴夫」手游版全球上线后，迅速登顶韩国等市场App Store游戏免费榜Top1！", "https://www.sohu.com/a/1079095297_100065715"]]}, {"section": "industry", "title": "鹰角网络投资上海宇宙怪兽，持股20%", "body": "鹰角网络投资上海宇宙怪兽，占股20%。宇宙怪兽于今年7月成立，目前没有明确履历和软著；现有来源只确认股权关系，不把科幻项目猜测写成既定研发计划。", "body_html": "<p>鹰角网络投资上海宇宙怪兽，占股20%。宇宙怪兽于今年7月成立，目前没有明确履历和软著；现有来源只确认股权关系，不把科幻项目猜测写成既定研发计划。</p>", "meta": ["鹰角"], "sources": [["S0652", "鹰角网络投资上海宇宙怪兽，占股20%", "https://new.qq.com/rain/a/20260922A09BQC00"]]}, {"section": "industry", "title": "完美世界拟出资1亿元认购前沿科技基金份额", "body": "完美世界9月22日公告，拟出资人民币1亿元认购拾象尚势（天津）创业投资合伙企业的基金份额。该基金于今年8月成立；这是公司近期第四次认购投资基金，前三笔金额分别为5亿元、5000万元和5040万元。", "body_html": "<p>完美世界9月22日公告，拟出资人民币1亿元认购拾象尚势（天津）创业投资合伙企业的基金份额。该基金于今年8月成立；这是公司近期第四次认购投资基金，前三笔金额分别为5亿元、5000万元和5040万元。</p>", "meta": ["完美世界"], "sources": [["S0653", "又花了1亿元！完美世界认购基金瞄准前沿科技方向", "https://new.qq.com/rain/a/20260922A09BQB00"]]}, {"section": "industry", "title": "双点工作室已有两个新项目进入早期开发，预计明年释出消息", "body": "双点工作室两位联合创始人透露，目前已有两个新项目进入早期开发阶段，可能在明年放出消息。团队规模约50人，并称半数粉丝来自中国；世嘉在上海成立约3个月的中国团队，目标是在游戏中增加更多中国元素。", "body_html": "<p>双点工作室两位联合创始人透露，目前已有两个新项目进入早期开发阶段，可能在明年放出消息。团队规模约50人，并称半数粉丝来自中国；世嘉在上海成立约3个月的中国团队，目标是在游戏中增加更多中国元素。</p>", "meta": [], "sources": [["S0781", "原创｜50人做出3个爆款，对话创始人：不做远超自己能承担的事", "http://www.nadianshi.com/2026/09/420537"]]}, {"section": "industry", "title": "国产二次元自走棋《时之铃》计划11月至12月开启内测", "body": "国产二次元自走棋《时之铃》计划在11月或12月进行内测。团队称棋子与英雄角色近200个，装备、魔法卡和命运抉择也接近200种；产品把PVE养成作为可带入PVP的局外辅助，同时允许只想玩PVP的玩家在教程后直接进入对战。", "body_html": "<p>国产二次元自走棋《时之铃》计划在11月或12月进行内测。团队称棋子与英雄角色近200个，装备、魔法卡和命运抉择也接近200种；产品把PVE养成作为可带入PVP的局外辅助，同时允许只想玩PVP的玩家在教程后直接进入对战。</p>", "meta": ["时之铃", "二游", "自走棋"], "sources": [["S1012", "对话异类二游制作人：不做同质化产品，内部测了两年都没玩腻", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7625"]]}, {"section": "industry", "title": "吉比特正式立项UE5移动端新作《代号M98》", "body": "吉比特董事长卢竑岩带队的《代号M98》于2026年8月通过公司评审并正式立项，定位为UE5开发的移动端角色养成与战斗游戏。项目围绕1V1强敌战斗，已在2027年秋季校招中开放战斗策划、养成策划、研发、项目管理与技术美术岗位。", "body_html": "<p>吉比特董事长卢竑岩带队的《代号M98》于2026年8月通过公司评审并正式立项，定位为UE5开发的移动端角色养成与战斗游戏。项目围绕1V1强敌战斗，已在2027年秋季校招中开放战斗策划、养成策划、研发、项目管理与技术美术岗位。</p>", "meta": ["代号M98"], "sources": [["S1147", "吉比特董事长带队项目曝光，是一款UE5移动端产品", "https://new.qq.com/rain/a/20260924A0DB3U00"]]}, {"section": "industry", "title": "网易《无限大》定档2027年1月15日，取消角色抽卡并改用外观付费", "body": "网易《无限大》宣布将于2027年1月15日全球免费上线，覆盖PC、PS5和移动端。游戏取消角色抽卡，角色可通过流程免费获取，收入主要来自外观付费；当前全球预约量已超过1700万。", "body_html": "<p>网易《无限大》宣布将于2027年1月15日全球免费上线，覆盖PC、PS5和移动端。游戏取消角色抽卡，角色可通过流程免费获取，收入主要来自外观付费；当前全球预约量已超过1700万。</p>", "meta": ["无限大", "网易"], "sources": [["S0437", "诗悦二游《望月》制作人卸任：《无限大》加速定档1月“冲击波”？", "http://www.gamelook.com.cn/2026/09/602601/"], ["S0447", "恺英20亿入股《传奇》母公司，《影之刃零》登Steam年度愿望单第一，《无限大》大改商业化｜陀螺周报", "https://www.youxituoluo.com/534896.html"]]}, {"section": "industry", "title": "《影之刃零》全平台愿望单突破300万，一个月增加100万", "body": "9月17日，灵游坊宣布《影之刃零》全平台愿望单突破300万；自8月12日开启预购后，近一个月又增加100万。游戏计划10月29日登陆PS5及PC平台。", "body_html": "<p>9月17日，灵游坊宣布《影之刃零》全平台愿望单突破300万；自8月12日开启预购后，近一个月又增加100万。游戏计划10月29日登陆PS5及PC平台。</p>", "meta": ["影之刃零"], "sources": [["S0003", "月增100万！《影之刃零》全平台愿望单突破300万大关", "https://www.gcores.com/articles/219868"], ["S0049", "《影之刃零》全平台愿望单突破300万份", "http://www.yystv.net/p/14416"]]}, {"section": "industry", "title": "动视估算游戏作弊产业年规模达85亿美元", "body": "动视估算，计入外挂订阅、账号买卖、代练与伪装服务后，游戏作弊产业每年规模约85亿美元；仅15款游戏的外挂订阅服务年收入就约35亿美元。公司称已干扰超过375个转售业务，并协助关闭31个主要外挂供应商。", "body_html": "<p>动视估算，计入外挂订阅、账号买卖、代练与伪装服务后，游戏作弊产业每年规模约85亿美元；仅15款游戏的外挂订阅服务年收入就约35亿美元。公司称已干扰超过375个转售业务，并协助关闭31个主要外挂供应商。</p>", "meta": [], "sources": [["S0320", "The global market for game cheats is worth $8.5 billion, and some people have earned $77 million through cheating.", "https://youxichaguan.com/en/archives/208517"], ["S0335", "动视称游戏外挂市场规模每年达85亿美元", "https://www.ign.com.cn/call-of-duty-modern-warfare-4/62920/dong-shi-cheng-you-xi-wai-gua-shi-chang-gui-mo-mei-nian-da-85yi-mei-yuan"]]}, {"section": "industry", "title": "《旅行青蛙·中国之旅》停运归因出现反转，日方称仍在协商在华后续", "body": "灵犀互娱此前称因IP授权合作到期，《旅行青蛙·中国之旅》将于12月8日停止运营。Hit-Point在9月21日的回应中称，日方从未提出终止中国版服务或合作协议，目前仍在就产品今后在华发展保持沟通；现有停运安排是否变化，仍待双方形成明确方案。", "body_html": "<p>灵犀互娱此前称因IP授权合作到期，《旅行青蛙·中国之旅》将于12月8日停止运营。Hit-Point在9月21日的回应中称，日方从未提出终止中国版服务或合作协议，目前仍在就产品今后在华发展保持沟通；现有停运安排是否变化，仍待双方形成明确方案。</p>", "meta": ["旅行青蛙·中国之旅", "灵犀"], "sources": [["S0622", "《旅行青蛙·中国之旅》陷罗生门，日方称仍在协商国区后续运营", "https://www.gcores.com/articles/220016"], ["S0643", "《旅行青蛙》停运再出反转：日方回应称“从未主动提出终止合作”", "https://www.youxituoluo.com/534900.html"]]}, {"section": "industry", "title": "Bungie恢复《命运》系列开发，计划重开被封存内容", "body": "Bungie称《命运》仍是工作室未来的基础，将恢复系列开发，并计划把曾被封存的战役、突袭与地点重新带回《命运2》。工作室同时承认此前结束持续开发导致信任和人员流失；旧内容回归需要适配现有灯光、战斗和底层系统，因此不会只是恢复旧文件。", "body_html": "<p>Bungie称《命运》仍是工作室未来的基础，将恢复系列开发，并计划把曾被封存的战役、突袭与地点重新带回《命运2》。工作室同时承认此前结束持续开发导致信任和人员流失；旧内容回归需要适配现有灯光、战斗和底层系统，因此不会只是恢复旧文件。</p>", "meta": ["命运"], "sources": [["S0627", "没有放弃《命运》！Bungie发布致歉声明", "https://www.gcores.com/articles/220059"], ["S0657", "Bungie says it's \"not done with Destiny\", aims to earn back player trust by restoring archived Destiny 2 content", "https://www.gamesindustry.biz/bungie-says-its-not-done-with-destiny-aims-to-earn-back-player-trust-by-restoring-archived-destiny-2-content"], ["S0670", "Bungie declares it's 'not done with Destiny' as it lays out studio's future", "https://www.gamedeveloper.com/console/bungie-declares-it-s-not-done-with-destiny-as-it-lays-out-studio-s-future"], ["S0725", "Bungie确认《命运》系列将有更多内容", "https://www.ign.com.cn/my2game/62982/bungieque-ren-ming-yun-xi-lie-jiang-you-geng-duo-nei-rong"]]}, {"section": "industry", "title": "网易《Blood Strike》全球注册用户突破2亿，暑期营收创新高且包体约460MB", "body": "网易射击手游《Blood Strike》于2026年8月底全球累计注册用户突破2亿，3月两周年期间DAU创下历史新高，暑期营收也刷新纪录；游戏当前包体约460MB，低于首发时的500多MB，主要面向拉美与东南亚的中低端设备用户。", "body_html": "<p>网易射击手游《Blood Strike》于2026年8月底全球累计注册用户突破2亿，3月两周年期间DAU创下历史新高，暑期营收也刷新纪录；游戏当前包体约460MB，低于首发时的500多MB，主要面向拉美与东南亚的中低端设备用户。</p>", "meta": ["Blood Strike", "网易", "东南亚"], "sources": [["S0561", "投稿丨西班牙网红跨国线下约战策划，这款网易游戏做到了2亿用户", "http://www.nadianshi.com/2026/09/420808"], ["S0641", "对话网易主策划：包体不到500M的低调游戏，用户悄悄超过了2亿", "https://m.sohu.com/a/1079618193_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.1.17901218618470fi1x6u"]]}, {"section": "industry", "title": "Xbox再裁268人并重组工作室，动视接手《光环》新作", "body": "Xbox在本轮重组中裁减268个岗位，并称已完成原定重组约四分之三。动视将开发下一部《光环》并管理Rare与World’s Edge，Bethesda扩大管理范围至Obsidian，Playground与Turn 10合并；Ninja Theory因两项出售协议失败而进入拟关闭咨询程序。", "body_html": "<p>Xbox在本轮重组中裁减268个岗位，并称已完成原定重组约四分之三。动视将开发下一部《光环》并管理Rare与World’s Edge，Bethesda扩大管理范围至Obsidian，Playground与Turn 10合并；Ninja Theory因两项出售协议失败而进入拟关闭咨询程序。</p>", "meta": ["光环"], "sources": [["S0660", "Xbox transfers Rare and Halo franchise to Activision, proposes closure of Ninja Theory, and confirms another 268 roles cut amid studio restructure", "https://www.gamesindustry.biz/xbox-transfers-rare-and-halo-franchise-to-activision-proposes-closure-of-ninja-theory-and-confirms-another-268-roles-cut-amid-studio-restructure"], ["S0672", "Xbox continues 'reset' with Halo Studios layoffs and Undead Labs divestment", "https://www.gamedeveloper.com/business/xbox-continues-reset-with-halo-studios-layoffs-and-undead-labs-divestment"], ["S0775", "Xbox lays off 268 more employees, merges Obsidian into Bethesda, and puts Activision in charge of Halo", "https://www.pcgamer.com/gaming-industry/xbox-lays-off-268-more-employees-merges-obsidian-into-bethesda-and-puts-activision-in-charge-of-halo/"], ["S0848", "Halo to Activision. Xbox merges studios and cuts 268 jobs", "https://www.thegamebusiness.com/p/halo-to-activision-xbox-merges-studios"]]}, {"section": "industry", "title": "Undead Labs脱离Xbox转为员工持有，独立同步伴随大规模裁员", "body": "Undead Labs已完成与Xbox的分离，并转为员工持有的独立工作室；过程中有大量员工被裁，部分人员曾参与《腐烂国度3》。项目仍在开发，计划2027年登陆Xbox、Game Pass、PC和PlayStation，并在今年底前进行封闭测试。", "body_html": "<p>Undead Labs已完成与Xbox的分离，并转为员工持有的独立工作室；过程中有大量员工被裁，部分人员曾参与《腐烂国度3》。项目仍在开发，计划2027年登陆Xbox、Game Pass、PC和PlayStation，并在今年底前进行封闭测试。</p>", "meta": ["腐烂国度3", "裁员"], "sources": [["S0904", "Undead Labs confirms it is now an \"employee-owned studio\", a \"significant number\" of employees face layoffs", "https://www.gamesindustry.biz/undead-labs-confirms-it-is-now-an-employee-owned-studio"], ["S0920", "Undead Labs makes 'significant' layoffs after splitting from Xbox", "https://www.gamedeveloper.com/business/undead-labs-makes-significant-layoffs-after-splitting-from-xbox"], ["S0962", "Undead Labs脱离XBOX，《腐烂国度3》仍在开发", "https://www.ign.com.cn/state-of-decay-2/63013/undead-labstuo-chi-xboxfu-lan-guo-du-3-reng-zai-kai-fa"], ["S0965", "Undead Labs独立后进行大规模裁员", "https://www.ign.com.cn/state-of-decay-2/63017/undead-labsdu-li-hou-jin-xing-da-gui-mo-cai-yuan"]]}, {"section": "ai", "title": "日本游戏开发者生成式AI使用率升至85.8%，北美样本仍为36%", "body": "CESA 2026年行业调查显示，日本游戏开发者使用生成式AI的比例从上年的51%升至85.8%，其中63%每天使用、22.8%不定期使用。GDC 2026北美调查中只有36%的受访者把AI用于工作，52%认为生成式AI正对行业产生负面影响。", "body_html": "<p>CESA 2026年行业调查显示，日本游戏开发者使用生成式AI的比例从上年的51%升至85.8%，其中63%每天使用、22.8%不定期使用。GDC 2026北美调查中只有36%的受访者把AI用于工作，52%认为生成式AI正对行业产生负面影响。</p>", "meta": ["市场数据"], "sources": [["S0240", "Dueling industry surveys show Japanese game devs are embracing AI, while North American ones are still skeptical", "https://www.pcgamer.com/gaming-industry/dueling-industry-surveys-show-japanese-game-devs-are-embracing-ai-while-north-american-ones-are-still-skeptical/"]]}, {"section": "ai", "title": "AI游戏UGC平台供给快速放大，竞争焦点转向质量与分发", "body": "TapTap Maker上半年产出近5000款游戏，累计玩家超过1000万、平均日活超过16万，创作者超过3000人。报道同时指出，行业AI生成游戏整体仍多处于较低完成度，平台之间的竞争焦点正从生成能力转向质量筛选、商业化与分发。", "body_html": "<p>TapTap Maker上半年产出近5000款游戏，累计玩家超过1000万、平均日活超过16万，创作者超过3000人。报道同时指出，行业AI生成游戏整体仍多处于较低完成度，平台之间的竞争焦点正从生成能力转向质量筛选、商业化与分发。</p>", "meta": ["UGC"], "sources": [["S0044", "Even Though Creators Earn Over 100,000 a Month, AI-Powered UGC Gaming Platforms Still Aren't a Profitable Business", "https://youxichaguan.com/en/archives/208281"]]}, {"section": "ai", "title": "司命工作室用AI跑通互动影游管线，并推进古风探案新作", "body": "司命互动影游工作室用约一个半月推出AI悬疑互动作品《列车怪谈：虚像之境》，并称该项目验证了AI与影游结合的可行性，跑通从立项到宣发的流程。团队随后获得长篇古风探案故事《京门之下》改编授权，正以AI影像重构场景、角色、声音与视频。", "body_html": "<p>司命互动影游工作室用约一个半月推出AI悬疑互动作品《列车怪谈：虚像之境》，并称该项目验证了AI与影游结合的可行性，跑通从立项到宣发的流程。团队随后获得长篇古风探案故事《京门之下》改编授权，正以AI影像重构场景、角色、声音与视频。</p>", "meta": ["列车怪谈：虚像之境", "京门之下"], "sources": [["S0040", "对话司命互动影游工作室：以AI探索互动影游未来", "https://youxichaguan.com/archives/208254"]]}, {"section": "ai", "title": "开发者梳理80余篇论文，提出RL+LLM关卡生成应先解决可控性与评估闭环", "body": "一位游戏开发者在阅读80余篇论文后，围绕强化学习、大语言模型与程序化关卡生成整理实践框架。文章把当前瓶颈归为幻觉、黑盒和上下文不足带来的“不可控”，并强调真实游戏训练的关键不只在算法，而在环境、观测、动作、奖励、版本管理与评估闭环；自博弈还需引入历史版本，避免策略陷入循环克制。", "body_html": "<p>一位游戏开发者在阅读80余篇论文后，围绕强化学习、大语言模型与程序化关卡生成整理实践框架。文章把当前瓶颈归为幻觉、黑盒和上下文不足带来的“不可控”，并强调真实游戏训练的关键不只在算法，而在环境、观测、动作、奖励、版本管理与评估闭环；自博弈还需引入历史版本，避免策略陷入循环克制。</p>", "meta": [], "sources": [["S0483", "基于RL+LLM的关卡生成探索（一）", "https://www.gameres.com/901202987.html"]]}, {"section": "ai", "title": "腾讯“游点灵”首次公开亮相，零基础开发者两天完成可玩原型", "body": "腾讯游戏自研AI创作平台“游点灵”在9月20日至23日的训练营首次公开亮相，不少零基础开发者在两天内完成可玩游戏原型。平台支持2D、3D多品类创作，云端精品资产库超过4万项，并已开启小规模线上测试。", "body_html": "<p>腾讯游戏自研AI创作平台“游点灵”在9月20日至23日的训练营首次公开亮相，不少零基础开发者在两天内完成可玩游戏原型。平台支持2D、3D多品类创作，云端精品资产库超过4万项，并已开启小规模线上测试。</p>", "meta": ["腾讯"], "sources": [["S0645", "从想法到作品，腾讯游戏游点灵·湖南马栏山集团AI游戏训练营展现创作新可能", "https://youxichaguan.com/archives/208575"], ["S0780", "从想法到作品，腾讯游戏游点灵·湖南马栏山集团AI游戏训练营展现创作新可能", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7615"]]}, {"section": "ai", "title": "Keywords：AI翻译适合前置排查本地化问题，关键对话仍需人工语言专家", "body": "Keywords本地化负责人表示，AI翻译可在开发早期预览其他语言版本并提前发现技术问题，例如文字溢出、指令无法完整显示；但模型不总能理解语境，也无法可靠判断父子之间的日语对话是否自然。关键对话仍需要语言专家把关，因为流畅的误译或幻觉更难被普通审校发现。", "body_html": "<p>Keywords本地化负责人表示，AI翻译可在开发早期预览其他语言版本并提前发现技术问题，例如文字溢出、指令无法完整显示；但模型不总能理解语境，也无法可靠判断父子之间的日语对话是否自然。关键对话仍需要语言专家把关，因为流畅的误译或幻觉更难被普通审校发现。</p>", "meta": [], "sources": [["S1369", "Is Xbox making the right decisions? Plus, how AI is (and isn’t) transforming game localization", "https://www.thegamebusiness.com/p/is-xbox-making-the-right-decisions"]]}, {"section": "release", "title": "星布谷地", "body": "米哈游开发的模拟经营多平台产品《星布谷地》于9月20日在PC、Android、iOS开启“连接测试”；本次为限量测试。", "body_html": "<p>米哈游开发的模拟经营多平台产品《星布谷地》于9月20日在PC、Android、iOS开启“连接测试”；本次为限量测试。</p>", "meta": ["星布谷地", "米哈游", "模拟经营"], "sources": [["S0296", "腾网下场微恐赛道Q4加速升温；华南大厂扎堆入局女性向赛道｜HOT周报", "https://cgames.com/contents/2/12944.html"], ["S0381", "星布谷地 - 内测", "https://newgame.17173.com/game-info-1037156.html"], ["S0265", "星布谷地(官服)-米哈游生活模拟新作 - 预下载开启，9月20日9点开测", "https://www.3839.com/a/163966.htm"], ["S0390", "星布谷地(官服)-米哈游生活模拟新作 - 09:00 限量测试", "https://www.3839.com/a/163966.htm"]]}, {"section": "release", "title": "粒粒的小人国", "body": "腾讯开发的模拟经营多平台产品《粒粒的小人国》于9月22日在PC、Android、iOS开启“定格测试”；另一日历源同步记录为限量测试。", "body_html": "<p>腾讯开发的模拟经营多平台产品《粒粒的小人国》于9月22日在PC、Android、iOS开启“定格测试”；另一日历源同步记录为限量测试。</p>", "meta": ["粒粒的小人国", "腾讯", "模拟经营"], "sources": [["S0802", "粒粒的小人国 - 内测", "https://newgame.17173.com/game-info-1037153.html"], ["S0814", "粒粒的小人国 - 限量测试开启！", "https://www.3839.com/a/187221.htm"]]}, {"section": "release", "title": "古龙群侠录", "body": "开放式3D探索武侠 ttps://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7619"]]}, {"section": "discourse", "title": "《蓝色星原：旅谣》宿舍与大世界皮肤不通用，玩家质疑重复付费", "body": "《蓝色星原：旅谣》测试期间，玩家帖称同一角色的宿舍皮肤与大世界皮肤分属两套系统、需要分别购买。争议集中在重复付费与穿模适配之间：部分玩家认为系统多此一举，另有玩家指出宿舍坐卧交互与大世界动作对服装适配要求不同。帖子9月18日建立，讨论延续至9月20日。", "body_html": "<p>《蓝色星原：旅谣》测试期间，玩家帖称同一角色的宿舍皮肤与大世界皮肤分属两套系统、需要分别购买。争议集中在重复付费与穿模适配之间：部分玩家认为系统多此一举，另有玩家指出宿舍坐卧交互与大世界动作对服装适配要求不同。帖子9月18日建立，讨论延续至9月20日。</p>", "meta": ["蓝色星原：旅谣"], "sources": [["S0183", "[新闻相关]蓝色星原皮肤系统分开做，宿舍皮肤和大世界皮肤并不通用，需要分开购买", "https://bbs.nga.cn/read.php?tid=47579128&forder_by=postdatedesc"], ["S0406", "[新闻相关]蓝色星原皮肤系统分开做，宿舍皮肤和大世界皮肤并不通用，需要分开购买", "https://bbs.nga.cn/read.php?tid=47579128&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《NIKKE》单人突击代练开挂争议升级，十年封禁与ACE接入引发二次讨论", "body": "《NIKKE》社区帖子梳理称，8月单人突击榜首成绩被清分后，相关代练账号先后收到7天、30天或60天封禁；在日韩社区继续追问处罚尺度后，数个账号又被追封10年。9月15日游戏接入ACE反作弊，鼠标宏、键盘宏和远程桌面被指失效。争议集中在玩家支持打击外挂与代打，但质疑官方对违规类型的识别与处罚口径反复变化。", "body_html": "<p>《NIKKE》社区帖子梳理称，8月单人突击榜首成绩被清分后，相关代练账号先后收到7天、30天或60天封禁；在日韩社区继续追问处罚尺度后，数个账号又被追封10年。9月15日游戏接入ACE反作弊，鼠标宏、键盘宏和远程桌面被指失效。争议集中在玩家支持打击外挂与代打，但质疑官方对违规类型的识别与处罚口径反复变化。</p>", "meta": ["NIKKE"], "sources": [["S0286", "[NIKKE]个突“开挂”事件一个马来西亚人引起的地动山摇", "https://bbs.nga.cn/read.php?tid=47584560&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《原神》设计师回顾2019年“黑暗降临”，玩家争论回应是否回避旧争议", "body": "《原神》战斗设计师在纪录片《理想的存档》中回顾2019年6月原初测试，称团队曾面对排山倒海式的负面反应，并把产品质量和核心体验视为跨过舆论冲击的基础。争议集中在：回顾成功是否回答了当年的相似度、商业化与社区冲突；支持者认可质量最终经受住市场检验，反对者则认为叙述把批评简化成了对产品的“恨意”。讨论自9月22日下午持续到次日上午。", "body_html": "<p>《原神》战斗设计师在纪录片《理想的存档》中回顾2019年6月原初测试，称团队曾面对排山倒海式的负面反应，并把产品质量和核心体验视为跨过舆论冲击的基础。争议集中在：回顾成功是否回答了当年的相似度、商业化与社区冲突；支持者认可质量最终经受住市场检验，反对者则认为叙述把批评简化成了对产品的“恨意”。讨论自9月22日下午持续到次日上午。</p>", "meta": ["原神", "理想的存档"], "sources": [["S0832", "[米哈游] 《原神》策划七年后首次回应“黑暗降临”", "https://bbs.nga.cn/read.php?tid=47604832&forder_by=postdatedesc"]]}, {"section": "deep", "title": "Steam玩家年龄重塑发现渠道，口碑与平台仍是共同底座", "body": "观察：GameDiscoverCo对超过1.6万名全球Steam玩家的调查显示，游戏发现渠道正在按年龄快速分化：18岁以下玩家使用短视频发现游戏的比例为53.5%，在45至54岁群体中降至20.2%；传统游戏媒体则从18岁以下的21.2%升至45至54岁的42.5%。与此同时，口碑推荐约45%、Steam平台约55%，在各年龄段相对稳定。 分析：年龄差异首先改变的是内容入口，而不是购买决策的全部链条。短视频在年轻群体中成为第二重要渠道，说明快速、可视化、便于转发的内容承担了更强的首次触达；传统媒体在年长群体中的占比更高，则意味着背景解释、评测和长期积累仍有稳定受众。直播并未沿年龄单向变化，而是在25至34岁达到约39%的中段峰值，渠道组合比简单的“年轻看短视频、年长看媒体”更复杂。 跨年龄稳定的口碑与Steam平台更像转化底座：前者提供可信任的社会证明，后者承接愿望单、商店曝光和购买。对同一产品而言，年龄结构会决定上游内容配比，但若缺少口碑与平台页的持续承接，单一渠道制造的高曝光很难自动转成稳定购买。", "body_html": "<p>观察：GameDiscoverCo对超过1.6万名全球Steam玩家的调查显示，游戏发现渠道正在按年龄快速分化：18岁以下玩家使用短视频发现游戏的比例为53.5%，在45至54岁群体中降至20.2%；传统游戏媒体则从18岁以下的21.2%升至45至54岁的42.5%。与此同时，口碑推荐约45%、Steam平台约55%，在各年龄段相对稳定。</p><p>分析：年龄差异首先改变的是内容入口，而不是购买决策的全部链条。短视频在年轻群体中成为第二重要渠道，说明快速、可视化、便于转发的内容承担了更强的首次触达；传统媒体在年长群体中的占比更高，则意味着背景解释、评测和长期积累仍有稳定受众。直播并未沿年龄单向变化，而是在25至34岁达到约39%的中段峰值，渠道组合比简单的“年轻看短视频、年长看媒体”更复杂。</p><p>跨年龄稳定的口碑与Steam平台更像转化底座：前者提供可信任的社会证明，后者承接愿望单、商店曝光和购买。对同一产品而言，年龄结构会决定上游内容配比，但若缺少口碑与平台页的持续承接，单一渠道制造的高曝光很难自动转成稳定购买。</p>", "meta": [], "sources": [["S0289", "The one ‘game discovery by player age’ chart you need to see", "https://newsletter.gamediscover.co/p/the-one-game-discovery-by-player"]]}, {"section": "deep", "title": "OOC的收入曲线显示，AI互动叙事正在变成平台生意", "body": "观察：Wrtn Technologies旗下OOC近30天移动端流水接近2600万元，同系Crack月流水约1500万元；公司创始人披露2025年底年化收入已达7000万美元，并把2026年目标定在1亿美元以上。AI互动叙事由此不再只是聊天产品，而是把故事参与、连续付费和创作者供给组合成一种可规模化的娱乐形态。 分析：这套模式首先把传统网文的按章付费改成了按互动继续。用户用Credits换取下一次回应，每个人得到的剧情分支不同；关系越深入、故事越长，已经投入的时间和情感越多，继续消费的动力也越强。收入不是来自预先写完的一套内容，而是来自持续生成的个人化后续。 第二层是供给组织。普通用户可以设定角色性格、世界观和剧情示例，认证创作者按作品消耗获得2%的Credits奖励；平台再通过推荐与独家内容扩充供给。AI降低了分支内容的生产成本，但题材选择、角色设定、分发与创作者激励仍决定哪些故事能被看见并持续消费。 边界同样清晰。不同地区需要分别调整推荐、充值、广告、年龄门槛与内容审核；玩家也会同时追问记忆错误、额度价格和创作者回报。规模化成立的前提不是生成无限内容，而是平台能在连续性、成本和治理之间维持信任。", "body_html": "<p>观察：Wrtn Technologies旗下OOC近30天移动端流水接近2600万元，同系Crack月流水约1500万元；公司创始人披露2025年底年化收入已达7000万美元，并把2026年目标定在1亿美元以上。AI互动叙事由此不再只是聊天产品，而是把故事参与、连续付费和创作者供给组合成一种可规模化的娱乐形态。</p><p>分析：这套模式首先把传统网文的按章付费改成了按互动继续。用户用Credits换取下一次回应，每个人得到的剧情分支不同；关系越深入、故事越长，已经投入的时间和情感越多，继续消费的动力也越强。收入不是来自预先写完的一套内容，而是来自持续生成的个人化后续。</p><p>第二层是供给组织。普通用户可以设定角色性格、世界观和剧情示例，认证创作者按作品消耗获得2%的Credits奖励；平台再通过推荐与独家内容扩充供给。AI降低了分支内容的生产成本，但题材选择、角色设定、分发与创作者激励仍决定哪些故事能被看见并持续消费。</p><p>边界同样清晰。不同地区需要分别调整推荐、充值、广告、年龄门槛与内容审核；玩家也会同时追问记忆错误、额度价格和创作者回报。规模化成立的前提不是生成无限内容，而是平台能在连续性、成本和治理之间维持信任。</p>", "meta": [], "sources": [["S0636", "年收入1亿美元！AI游戏大佬OOC是什么来头？", "http://www.gamelook.com.cn/2026/09/602693/"]]}, {"section": "deep", "title": "日本手游仍有百亿美元付费池，但增长竞争已从扩下载转向争夺成熟用户", "body": "观察：Sensor Tower数据显示，2025年8月至2026年7月日本手游IAP收入超过100亿美元，但收入同比下降5.1%，同期5.85亿次下载同比下降5.4%、全球排名第9。市场规模仍居亚洲前列，增长却已不再主要依赖新增安装，而更多取决于成熟玩家的参与度、头部产品表现与持续付费。 分析：高价值与高增长已经分离。日本手游的收入规模超过韩国两倍、接近中国台湾地区四倍，最近12个月使用时长仍约167亿小时，但收入和下载同时下滑约5%。这说明成熟用户与既有消费习惯能够支撑收入韧性，却不能自动带来增量；竞争从扩大用户池转向提高留存、活动效率与长期变现。 供给侧竞争也在改变。The Game Business的行业访谈指出，中国手游在日本不仅获得下载，也在争夺收入份额；Sensor Tower的榜单同时出现成熟IP、新游、策略、RPG与模拟产品。对厂商而言，进入日本市场的门槛不再只是拿到安装量，而是持续提供适配本地用户的内容与运营，并在已有高价值玩家中建立长期付费理由。", "body_html": "<p>观察：Sensor Tower数据显示，2025年8月至2026年7月日本手游IAP收入超过100亿美元，但收入同比下降5.1%，同期5.85亿次下载同比下降5.4%、全球排名第9。市场规模仍居亚洲前列，增长却已不再主要依赖新增安装，而更多取决于成熟玩家的参与度、头部产品表现与持续付费。</p><p>分析：高价值与高增长已经分离。日本手游的收入规模超过韩国两倍、接近中国台湾地区四倍，最近12个月使用时长仍约167亿小时，但收入和下载同时下滑约5%。这说明成熟用户与既有消费习惯能够支撑收入韧性，却不能自动带来增量；竞争从扩大用户池转向提高留存、活动效率与长期变现。</p><p>供给侧竞争也在改变。The Game Business的行业访谈指出，中国手游在日本不仅获得下载，也在争夺收入份额；Sensor Tower的榜单同时出现成熟IP、新游、策略、RPG与模拟产品。对厂商而言，进入日本市场的门槛不再只是拿到安装量，而是持续提供适配本地用户的内容与运营，并在已有高价值玩家中建立长期付费理由。</p>", "meta": ["市场数据"], "sources": [["S1370", "Five things we’ve learned about Japan’s games industry, plus how GTA 6 influenced Valor Mortis’ $40 price point", "https://www.thegamebusiness.com/p/five-things-weve-learned-about-japans"], ["S1108", "2026年日本游戏市场洞察报告", "https://sensortower.com/zh-CN/blog/state-of-japan-gaming-2026-china"]]}];
    const sectionLabels = Object.fromEntries(sections.map(s => [s.id, s.label]));
    const sectionDescs = Object.fromEntries(sections.map(s => [s.id, s.desc]));
    const orderedSectionIds = sections.filter(s => s.id !== "all").map(s => s.id);
    let currentSection = "all";
    let compact = false;
    const nav = document.getElementById("nav");
    const content = document.getElementById("content");
    const sectionHead = document.getElementById("sectionHead");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    function matches(item, query) {
      if (!query) return true;
      const text = [item.title,item.body,item.meta.join(" "),item.sources.map(s => s.join(" ")).join(" ")].join(" ").toLowerCase();
      return text.includes(query.toLowerCase());
    }
    function isBorderline(m) {
      return /borderline/i.test(m);
    }
    function renderNav() {
      nav.innerHTML = "";
      sections.forEach(section => {
        const count = section.id === "all" ? items.length : items.filter(item => item.section === section.id).length;
        const button = document.createElement("button");
        button.dataset.section = section.id;
        if (section.id === currentSection) button.classList.add("active");
        button.innerHTML = `<span>${section.label}</span><span class="count">${count}</span>`;
        button.addEventListener("click", () => { currentSection = section.id; render(); });
        nav.appendChild(button);
      });
    }
    function renderItem(item) {
      const node = document.createElement("article");
      node.className = "item";
      node.dataset.section = item.section;
      const metaTags = item.meta.map(m => {
        const cls = isBorderline(m) ? "borderline" : "";
        return `<span class="${cls}">${m}</span>`;
      }).join("");
      const bodyMarkup = item.body_html || `<p>${item.body}</p>`;
      node.innerHTML = `<div class="item-top"><span class="tag">${sectionLabels[item.section]}</span></div><h3>${item.title}</h3>${bodyMarkup}<div class="meta-row">${metaTags}</div><button class="source-btn" type="button">查看来源 →</button>`;
      node.querySelector(".source-btn").addEventListener("click", () => openDrawer(item));
      return node;
    }
    function buildGrid(itemList) {
      const grid = document.createElement("section");
      grid.className = compact ? "grid compact" : "grid";
      itemList.forEach(item => grid.appendChild(renderItem(item)));
      return grid;
    }
    function buildSectionBlock(sectionId, itemList) {
      const block = document.createElement("div");
      block.className = "section-block";
      const banner = document.createElement("div");
      banner.className = "section-banner";
      banner.dataset.section = sectionId;
      banner.innerHTML = `<h2>${sectionLabels[sectionId]}</h2><span class="banner-count">${itemList.length} 条</span><span class="banner-desc">${sectionDescs[sectionId]}</span>`;
      block.appendChild(banner);
      block.appendChild(buildGrid(itemList));
      return block;
    }
    function render() {
      renderNav();
      const query = search.value.trim();
      const filtered = items.filter(item => (currentSection === "all" || item.section === currentSection) && matches(item, query));
      content.innerHTML = "";
      if (currentSection === "all") {
        sectionHead.style.display = "none";
        orderedSectionIds.forEach(sid => {
          const sectionItems = filtered.filter(it => it.section === sid);
          if (sectionItems.length > 0) content.appendChild(buildSectionBlock(sid, sectionItems));
        });
      } else {
        sectionHead.style.display = "flex";
        sectionHead.dataset.section = currentSection;
        document.getElementById("sectionTitle").textContent = sectionLabels[currentSection];
        document.getElementById("sectionDesc").textContent = sectionDescs[currentSection];
        content.appendChild(buildGrid(filtered));
      }
      empty.classList.toggle("visible", filtered.length === 0);
    }
    function openDrawer(item) {
      document.getElementById("drawerTitle").textContent = item.title;
      document.getElementById("drawerNote").textContent = item.body;
      document.getElementById("sourceList").innerHTML = item.sources.map(([id,name,url]) => {
        const safeUrl = String(url || "");
        const isHttp = /^https?:\/\//i.test(safeUrl);
        const linkAttrs = isHttp ? `href="${safeUrl}" target="_blank" rel="noopener noreferrer"` : "";
        const urlEl = isHttp
          ? `<a class="source-url" ${linkAttrs}>${safeUrl} ↗</a>`
          : `<span class="source-url">${safeUrl}</span>`;
        return `<div class="source-card"><strong>${id} · ${name}</strong>${urlEl}</div>`;
      }).join("");
      drawer.classList.add("open"); overlay.classList.add("open");
    }
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
    search.addEventListener("input", render);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    // Sidebar collapse — state persists in localStorage
    const app = document.getElementById("app");
    const SIDEBAR_KEY = "report-sidebar-collapsed";
    try { if (localStorage.getItem(SIDEBAR_KEY) === "1") app.classList.add("collapsed"); } catch (e) {}
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      app.classList.toggle("collapsed");
      try { localStorage.setItem(SIDEBAR_KEY, app.classList.contains("collapsed") ? "1" : "0"); } catch (e) {}
    });
    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("viewGrid").addEventListener("click", () => { compact = false; document.getElementById("viewGrid").classList.add("active"); document.getElementById("viewList").classList.remove("active"); render(); });
    document.getElementById("viewList").addEventListener("click", () => { compact = true; document.getElementById("viewList").classList.add("active"); document.getElementById("viewGrid").classList.remove("active"); render(); });
    render();
  </script>
</body>
