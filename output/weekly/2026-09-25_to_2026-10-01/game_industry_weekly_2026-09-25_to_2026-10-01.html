<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏行业周报 | 2026-09-25 ~ 2026-10-01</title>
  <style>
    :root {
      --ink:#1a2436; --ink-soft:#3a4862; --muted:#6b7993; --faint:#9aa6bd;
      --accent:#5b6ef5;
      --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78);
      --glass-border:rgba(255,255,255,.7); --line:rgba(31,45,75,.10); --line-strong:rgba(31,45,75,.16);
      --shadow-sm:0 3px 12px rgba(31,45,75,.05);
      --shadow:0 6px 28px rgba(31,45,75,.07);
      --shadow-lg:0 14px 40px rgba(31,45,75,.12);
      --industry:#4f7cff; --industry-soft:rgba(79,124,255,.12); --industry-ink:#2b53c4;
      --ai:#00b3d4; --ai-soft:rgba(0,179,212,.12); --ai-ink:#06748a;
      --release:#16b884; --release-soft:rgba(22,184,132,.13); --release-ink:#0b7a57;
      --discourse:#f0a02a; --discourse-soft:rgba(240,160,42,.15); --discourse-ink:#9a6206;
      --deep:#8b6df0; --deep-soft:rgba(139,109,240,.13); --deep-ink:#5a3fc0;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif; line-height:1.65; -webkit-font-smoothing:antialiased; }
    /* decorative gradient field behind the frosted glass */
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(circle at 12% 18%, rgba(91,110,245,.20), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(0,179,212,.16), transparent 40%),
        radial-gradient(circle at 78% 88%, rgba(139,109,240,.18), transparent 46%),
        radial-gradient(circle at 25% 92%, rgba(22,184,132,.13), transparent 44%),
        linear-gradient(135deg,#eef1fb 0%,#f3effb 48%,#eaf3fc 100%); }
    a { color:inherit; text-decoration:none; }
    button,input { font:inherit; }
    ::selection { background:rgba(91,110,245,.22); }
    .app { min-height:100vh; display:grid; grid-template-columns:264px minmax(0,1fr); transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
    .app.collapsed { grid-template-columns:0 minmax(0,1fr); }

    /* Sidebar — frosted glass */
    aside.sidebar { position:sticky; top:0; height:100vh; padding:24px 18px; color:var(--ink); display:flex; flex-direction:column;
      background:rgba(255,255,255,.48); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
      border-right:1px solid rgba(255,255,255,.55); overflow-y:auto; overflow-x:hidden; transition:transform .25s cubic-bezier(.4,0,.2,1), opacity .2s; }
    .app.collapsed aside.sidebar { transform:translateX(-100%); opacity:0; pointer-events:none; }

    /* Sidebar toggle button (in topbar, always visible) */
    .sidebar-toggle { width:40px; height:40px; border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; border-radius:12px; display:grid; place-items:center; font-size:16px; line-height:1; transition:all .14s; }
    .sidebar-toggle:hover { color:var(--accent); border-color:var(--accent); }
    .sidebar-toggle .icon-open { display:inline; }
    .sidebar-toggle .icon-close { display:none; }
    .app.collapsed .sidebar-toggle .icon-open { display:none; }
    .app.collapsed .sidebar-toggle .icon-close { display:inline; }
    .back-home { width:max-content; display:inline-flex; align-items:center; gap:7px; margin:0 2px 18px; padding:7px 10px; border-radius:9px; color:var(--ink-soft); text-decoration:none; font-size:13px; font-weight:600; transition:background .14s,color .14s,transform .14s; }
    .back-home:hover { background:rgba(255,255,255,.62); color:var(--accent); transform:translateX(-2px); }
    .back-home:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 2px 20px; border-bottom:1px solid var(--line); }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:11px; background:#fff; padding:7px; box-shadow:0 3px 10px rgba(31,45,75,.10); }
    .brand-mark img { width:100%; height:100%; display:block; object-fit:contain; }
    .brand strong { display:block; font-size:15px; line-height:1.1; letter-spacing:.2px; color:var(--ink); }
    .brand span { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
    .nav-title { margin:22px 0 10px; color:var(--faint); font-size:10px; letter-spacing:1.3px; text-transform:uppercase; font-weight:700; }
    .nav { display:grid; gap:3px; }
    .nav button { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; border:0; background:transparent; color:var(--ink-soft); padding:11px 14px; text-align:left; cursor:pointer; border-radius:11px; position:relative; font-size:14px; font-weight:500; transition:all .14s; }
    .nav button:hover { background:rgba(255,255,255,.55); color:var(--ink); }
    .nav button.active { background:rgba(91,110,245,.12); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px rgba(91,110,245,.18); }
    .nav button.active::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--accent2,var(--accent)); }
    .nav button[data-section="industry"] { --accent2:var(--industry); }
    .nav button[data-section="ai"] { --accent2:var(--ai); }
    .nav button[data-section="release"] { --accent2:var(--release); }
    .nav button[data-section="discourse"] { --accent2:var(--discourse); }
    .nav button[data-section="deep"] { --accent2:var(--deep); }
    .count { min-width:24px; padding:1px 9px; color:var(--muted); background:rgba(31,45,75,.07); text-align:center; border-radius:11px; font-size:12px; font-weight:600; }
    .nav button.active .count { background:var(--accent2,var(--accent)); color:#fff; }
    .sidebar-footer { margin:auto -18px -24px; padding:16px 22px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.65; }
    .sidebar-footer .made { color:var(--ink-soft); font-weight:600; }
    .sidebar-footer a { color:var(--accent); }
    .sidebar-footer .stat { margin-top:8px; color:var(--faint); }

    /* Main */
    main { padding:30px 40px 64px; min-width:0; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; line-height:1.25; letter-spacing:-.2px; font-weight:800; color:var(--ink); }
    .subtitle { margin-top:8px; color:var(--muted); font-size:13.5px; }
    .actions { display:flex; gap:10px; align-items:center; }
    .search { width:320px; display:flex; align-items:center; gap:8px; background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); padding:9px 14px; border-radius:12px; transition:border-color .15s, box-shadow .15s; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,110,245,.12); background:#fff; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:13.5px; }
    .search input::placeholder { color:var(--faint); }
    .icon-btn { border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; width:40px; height:40px; border-radius:12px; transition:all .14s; }
    .icon-btn:hover { color:var(--accent); border-color:var(--accent); }

    /* Metrics */
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:30px; }
    .metric { background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); padding:18px 20px; border-radius:18px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden; }
    .metric::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent2,var(--industry)); }
    .metric:nth-child(1) { --accent2:var(--industry); }
    .metric:nth-child(2) { --accent2:var(--release); }
    .metric:nth-child(3) { --accent2:var(--discourse); }
    .metric:nth-child(4) { --accent2:var(--deep); }
    .metric span { color:var(--muted); font-size:12.5px; letter-spacing:.3px; }
    .metric strong { display:block; font-size:26px; line-height:1.1; margin-top:6px; font-weight:800; color:var(--ink); }

    /* Section-head (单 section 视图) */
    .section-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin:6px 0 20px; padding:16px 20px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); border-left:4px solid var(--accent2,var(--industry)); border-radius:18px; box-shadow:var(--shadow-sm); }
    .section-head[data-section="industry"] { --accent2:var(--industry); }
    .section-head[data-section="ai"] { --accent2:var(--ai); }
    .section-head[data-section="release"] { --accent2:var(--release); }
    .section-head[data-section="discourse"] { --accent2:var(--discourse); }
    .section-head[data-section="deep"] { --accent2:var(--deep); }
    h2 { margin:0; font-size:20px; font-weight:700; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .toggle { display:flex; border:1px solid var(--glass-border); background:var(--glass); border-radius:11px; overflow:hidden; }
    .toggle button { padding:8px 15px; border:0; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13px; transition:all .14s; }
    .toggle button.active { background:var(--accent); color:#fff; font-weight:600; }

    /* "全部" 视图下的 section 分块 */
    .section-block { margin-top:38px; min-width:0; }
    .section-block:first-child { margin-top:0; }
    .section-banner { display:flex; align-items:baseline; gap:14px; padding:13px 18px; margin-bottom:16px; background:var(--accent-soft,var(--industry-soft)); border-left:4px solid var(--accent2,var(--industry)); border-radius:14px; }
    .section-banner[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .section-banner[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .section-banner[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .section-banner[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .section-banner[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .section-banner h2 { color:var(--accent-ink); font-size:17px; margin:0; font-weight:700; }
    .section-banner .banner-count { color:var(--accent2); font-weight:700; font-size:13px; }
    .section-banner .banner-desc { color:var(--accent-ink); opacity:.7; font-size:13px; margin-left:auto; }

    /* Cards — glass */
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; min-width:0; }
    .grid.compact { grid-template-columns:1fr; }
    .item { min-width:0; background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); border-left:3px solid var(--accent2,var(--industry)); padding:20px 24px; border-radius:18px; box-shadow:var(--shadow-sm); transition:transform .18s, box-shadow .18s; display:flex; flex-direction:column; }
    .item:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
    .item[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .item[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .item[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .item[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .item[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .item-top { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:11px; }
    .tag { padding:3px 11px; font-size:12px; color:var(--accent-ink); background:var(--accent-soft); border-radius:8px; font-weight:700; letter-spacing:.2px; }
    h3 { margin:2px 0 10px; font-size:17.5px; line-height:1.45; font-weight:700; color:var(--ink); letter-spacing:.1px; }
    .item p { margin:0 0 14px; color:var(--ink-soft); font-size:14.5px; line-height:1.78; }
    .meta-row { display:flex; flex-wrap:wrap; gap:7px; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .meta-row span { padding:3px 10px; background:rgba(31,45,75,.06); border-radius:8px; }
    .item .meta-row span.borderline { background:rgba(240,160,42,.14); color:#a8680a; }
    .source-btn { margin-top:14px; padding:8px 14px; border:1px solid var(--glass-border); background:rgba(255,255,255,.5); color:var(--accent); cursor:pointer; border-radius:11px; font-size:13px; font-weight:600; align-self:flex-start; transition:all .14s; }
    .source-btn:hover { background:var(--accent-soft); border-color:var(--accent2); }
    .ranking-notes { margin:0 0 12px; padding-left:20px; color:var(--ink-soft); line-height:1.55; font-size:13.5px; }
    .ranking-table-wrap { width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.54); }
    .ranking-table { width:100%; min-width:680px; border-collapse:collapse; font-size:12.5px; }
    .ranking-table th,.ranking-table td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    .ranking-table th { color:var(--ink); background:rgba(208,95,63,.08); font-weight:700; }
    .ranking-table td:first-child,.ranking-table th:first-child { text-align:right; }
    .ranking-table tbody tr:last-child td { border-bottom:0; }
    .empty { display:none; padding:48px; border:1px dashed var(--line-strong); color:var(--muted); text-align:center; background:var(--glass); border-radius:18px; }
    .empty.visible { display:block; }

    /* Drawer */
    .overlay { position:fixed; inset:0; display:none; background:rgba(26,36,54,.3); backdrop-filter:blur(3px); }
    .overlay.open { display:block; }
    .drawer { position:fixed; top:0; right:0; width:min(440px,100vw); height:100vh; transform:translateX(100%); transition:.22s cubic-bezier(.4,0,.2,1); background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border-left:1px solid var(--glass-border); box-shadow:-18px 0 44px rgba(31,45,75,.16); padding:24px; overflow:auto; }
    .drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:8px; }
    .drawer h2 { font-size:17px; line-height:1.4; }
    #drawerNote { color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .source-card { border:1px solid var(--glass-border); padding:13px 15px; margin-top:10px; border-radius:12px; background:rgba(255,255,255,.55); }
    .source-card strong { font-size:13px; color:var(--ink); }
    .source-url { display:block; margin-top:6px; color:var(--accent); overflow-wrap:anywhere; user-select:text; font-size:12.5px; text-decoration:none; }
    a.source-url:hover { text-decoration:underline; }
    a.source-url:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

    @media (max-width:900px) {
      .app { grid-template-columns:1fr; }
      aside.sidebar { position:relative; height:auto; }
      .nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
      main { padding:22px 18px 36px; }
      .topbar,.section-head { align-items:stretch; flex-direction:column; }
      .search { width:100%; }
      .metrics,.grid { grid-template-columns:1fr; }
      .section-banner { flex-wrap:wrap; }
      .section-banner .banner-desc { margin-left:0; width:100%; }
    }
    @media print {
      body::before { display:none; }
      aside.sidebar,.actions,.toggle,.source-btn,.drawer,.overlay { display:none!important; }
      .app { display:block; }
      main { padding:0; }
      .item { break-inside:avoid; box-shadow:none; border-color:#bbb; backdrop-filter:none; background:#fff; }
      .section-banner { break-after:avoid; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <a class="back-home" href="../../" aria-label="返回情报站首页">← 返回首页</a>
      <div class="brand" aria-label="沐瞳科技">
        <div class="brand-mark" aria-hidden="true"><img src="../../assets/moonton_logo.png" alt=""></div>
        <div><strong>游戏行业情报站</strong><span>AI 生成 · 每周更新</span></div>
      </div>
      <div class="nav-title">Sections</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="made">Made by 沐瞳科技战略团队</div>
        <div>有问题请联系 <a href="mailto:leelootang@moonton.com">leelootang@moonton.com</a></div>
        <div class="stat">2026-09-25 ~ 2026-10-01 · 31 条动态</div>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <div><h1>游戏行业周报</h1><div class="subtitle">2026-09-25 ~ 2026-10-01 · 行业新闻、AI、产品日历、玩家舆论与精选观察</div></div>
        <div class="actions">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" title="折叠 / 展开侧栏" aria-label="切换侧栏">
            <span class="icon-open">«</span><span class="icon-close">»</span>
          </button>
          <label class="search">⌕<input id="search" type="search" placeholder="搜索条目、公司、产品"></label>
          <button class="icon-btn" id="printBtn" type="button" title="打印">⎙</button>
        </div>
      </div>
      <div class="metrics"><div class="metric"><span>行业新闻</span><strong>17</strong></div><div class="metric"><span>产品日历</span><strong>2</strong></div><div class="metric"><span>玩家舆论</span><strong>3</strong></div><div class="metric"><span>采集记录</span><strong>1337</strong></div></div>

      <div id="content"></div>
      <div class="empty" id="empty">没有匹配的条目。</div>

  </div>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="来源详情">
    <div class="drawer-head"><h2 id="drawerTitle"></h2><button class="icon-btn" id="closeDrawer" type="button">×</button></div>
    <p id="drawerNote"></p>
    <div id="sourceList"></div>
  </aside>

    const items = [{"section": "industry", "title": "腾讯领投Circle Games 2500万美元A轮融资", "body": "腾讯领投土耳其手游工作室Circle Games的2500万美元A轮融资，使其累计融资额达到3225万美元。资金将用于把新作《Jelly Escape》推向更多市场、继续发展《Sort Express》并把员工人数至少扩大一倍；《Sort Express》当前月流水约1500万元。", "body_html": "<p>腾讯领投土耳其手游工作室Circle Games的2500万美元A轮融资，使其累计融资额达到3225万美元。资金将用于把新作《Jelly Escape》推向更多市场、继续发展《Sort Express》并把员工人数至少扩大一倍；《Sort Express》当前月流水约1500万元。</p>", "meta": ["Jelly Escape", "Sort Express", "腾讯"], "sources": [["S0617", "腾讯又投资休闲手游公司：土耳其Circle Games喜获2500万美元巨额融资", "http://www.gamelook.com.cn/2026/09/603099/"], ["S0623", "腾讯砸近2个亿，再度出手超休闲厂商", "https://cgames.com/contents/2/13030.html"]]}, {"section": "industry", "title": "Grasshopper Manufacture与网易分离，重新成为独立工作室", "body": "《No More Heroes》系列开发商Grasshopper Manufacture宣布与网易游戏分离，重新成为独立工作室。CEO须田刚一称，年内《Romeo is a Dead Man》发售后，团队希望拓宽作品风格，并在与网易充分讨论后作出决定；工作室同时表示已提升自发行能力，未来仍期待继续合作。", "body_html": "<p>《No More Heroes》系列开发商Grasshopper Manufacture宣布与网易游戏分离，重新成为独立工作室。CEO须田刚一称，年内《Romeo is a Dead Man》发售后，团队希望拓宽作品风格，并在与网易充分讨论后作出决定；工作室同时表示已提升自发行能力，未来仍期待继续合作。</p>", "meta": ["网易"], "sources": [["S0907", "Grasshopper Manufacture becomes independent as it splits from NetEase Games", "https://www.gamesindustry.biz/grasshopper-manufacture-becomes-independent-as-it-splits-from-netease-games"]]}, {"section": "industry", "title": "Scopely入股上海宝可拉，腾讯仍为第一大股东", "body": "9月23日，Savvy Games Group旗下Scopely入股上海宝可拉，持股23.94%；腾讯仍为第一大股东，持股稀释至30.42%。宝可拉在研《代号Hydra》是一款中世纪风多平台写实向多人RPG，面向全球市场。", "body_html": "<p>9月23日，Savvy Games Group旗下Scopely入股上海宝可拉，持股23.94%；腾讯仍为第一大股东，持股稀释至30.42%。宝可拉在研《代号Hydra》是一款中世纪风多平台写实向多人RPG，面向全球市场。</p>", "meta": ["代号Hydra", "腾讯"], "sources": [["S0273", "国庆档腾网米决战上海滩；沙特土豪出手上海二游厂商｜HOT周报", "https://cgames.com/contents/2/13003.html"]]}, {"section": "industry", "title": "腾讯公布《怪物猎人：旅人》实机，11月启动全球首轮测试", "body": "9月25日，腾讯在东京电玩展公布《怪物猎人：旅人》首支实机预告；产品已于去年12月获得版号，计划今年11月开启全球首轮测试。天美与Capcom合作保留长剑、弓、双剑和大剑等武器，并加入建造、滑翔与砍树等生存建造机制。", "body_html": "<p>9月25日，腾讯在东京电玩展公布《怪物猎人：旅人》首支实机预告；产品已于去年12月获得版号，计划今年11月开启全球首轮测试。天美与Capcom合作保留长剑、弓、双剑和大剑等武器，并加入建造、滑翔与砍树等生存建造机制。</p>", "meta": ["怪物猎人：旅人", "腾讯", "版号"], "sources": [["S0192", "Estreno en el TGS: ¿Tencent sigue sin poder olvidar a esta super IP que ha vendido 100 millones de copias?", "https://youxichaguan.com/es/archives/210346"]]}, {"section": "industry", "title": "网易游戏会员俱乐部接入拉美五国本地支付渠道", "body": "网易游戏会员俱乐部与跨境支付公司EBANX宣布达成合作，首批覆盖巴西、墨西哥、阿根廷、智利和秘鲁，并接入Pix、SPEI、PagoEfectivo和Mercado Pago等本地支付方式。EBANX援引的数据预计，这五个市场2026年将创造84亿美元电子游戏收入；合作把银行卡覆盖不足地区的即时支付、账户到账户转账和现金型支付纳入网易游戏官方充值体系。", "body_html": "<p>网易游戏会员俱乐部与跨境支付公司EBANX宣布达成合作，首批覆盖巴西、墨西哥、阿根廷、智利和秘鲁，并接入Pix、SPEI、PagoEfectivo和Mercado Pago等本地支付方式。EBANX援引的数据预计，这五个市场2026年将创造84亿美元电子游戏收入；合作把银行卡覆盖不足地区的即时支付、账户到账户转账和现金型支付纳入网易游戏官方充值体系。</p>", "meta": ["网易"], "sources": [["S0548", "EBANX与网易游戏会员俱乐部携手为拉丁美洲引入本地支付方式", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7645"]]}, {"section": "industry", "title": "腾讯发行SLG《新三国：荣耀再起》进入第三次测试", "body": "凯撒文化旗下团队研发、腾讯游戏发行的SLG《新三国：荣耀再起》于9月22日开启“旌旗测试”，这是产品自4月以来的第三次测试。前作《荣耀新三国》截至2025年底国服累计流水超过6亿元；新作本轮继续压缩行军与攻城等待，并通过队伍等级继承、独立预备兵池和低稀有度武将升橙降低开荒与换将成本。", "body_html": "<p>凯撒文化旗下团队研发、腾讯游戏发行的SLG《新三国：荣耀再起》于9月22日开启“旌旗测试”，这是产品自4月以来的第三次测试。前作《荣耀新三国》截至2025年底国服累计流水超过6亿元；新作本轮继续压缩行军与攻城等待，并通过队伍等级继承、独立预备兵池和低稀有度武将升橙降低开荒与换将成本。</p>", "meta": ["新三国：荣耀再起", "荣耀新三国", "腾讯"], "sources": [["S0387", "前作流水6个亿，腾讯新SLG在下一盘大棋", "https://cgames.com/contents/2/13024.html"]]}, {"section": "industry", "title": "B站代理《BanG Dream! Our Notes》开启全球公测", "body": "B站代理发行的音游《BanG Dream! Our Notes》于9月24日开启全球公测，达成200万预约量，并以全球同版本上线、支持简体中文降低中国玩家进入门槛。游戏集结五支乐队、25名角色，上线时开放合计100话全语音剧情，总时长约24小时，还把传统7键谱面精简为6键并取消尾判。", "body_html": "<p>B站代理发行的音游《BanG Dream! Our Notes》于9月24日开启全球公测，达成200万预约量，并以全球同版本上线、支持简体中文降低中国玩家进入门槛。游戏集结五支乐队、25名角色，上线时开放合计100话全语音剧情，总时长约24小时，还把传统7键谱面精简为6键并取消尾判。</p>", "meta": ["上线"], "sources": [["S0546", "双番2亿播放后，B站又拿出了11年IP的新作", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7644"]]}, {"section": "industry", "title": "《守墓人2》发售后Steam同时在线峰值达到54969", "body": "Lazy Bear Games开发、Solo Game发行的模拟经营游戏《守墓人2》已在Steam正式发售，国区定价68元；最高同时在线人数达到54969，好评率为86%。产品在墓园经营基础上加入僵尸自动化生产和小队战斗，发售前愿望单超过100万，约10%转化为预购。", "body_html": "<p>Lazy Bear Games开发、Solo Game发行的模拟经营游戏《守墓人2》已在Steam正式发售，国区定价68元；最高同时在线人数达到54969，好评率为86%。产品在墓园经营基础上加入僵尸自动化生产和小队战斗，发售前愿望单超过100万，约10%转化为预购。</p>", "meta": ["守墓人2", "模拟经营"], "sources": [["S0384", "“开僵尸工厂, 当墓地大老板”！《守墓人2》Steam在线破5万人，荒诞又上头", "http://www.gamelook.com.cn/2026/09/603006/"]]}, {"section": "industry", "title": "国产古蜀神话动作肉鸽《青铜灰烬》开放Steam试玩", "body": "成都开发商Ray² Game研发的俯视角动作肉鸽《青铜灰烬》当日在Steam开放试玩Demo。产品以古蜀神话和青铜器为美术基底，本次试玩开放两名角色与八种巫术效果，并支持Steam好友联机共斗和竞速比拼。", "body_html": "<p>成都开发商Ray² Game研发的俯视角动作肉鸽《青铜灰烬》当日在Steam开放试玩Demo。产品以古蜀神话和青铜器为美术基底，本次试玩开放两名角色与八种巫术效果，并支持Steam好友联机共斗和竞速比拼。</p>", "meta": ["青铜灰烬"], "sources": [["S0547", "联机耍起！“古蜀神话哈迪斯”新游《青铜灰烬》Demo上线", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7646"]]}, {"section": "industry", "title": "拳头在广州成立子公司，招聘信息指向至少两款在研游戏", "body": "拳头游戏于9月21日在广州成立傲拳（广州）网络科技有限公司，由中国区负责人林松担任法定代表人和董事。招聘信息显示，广州团队至少在为两款游戏招人：一款涉及城市发展、城池建设和资源生产，另一款“Riot Discovery”采用虚幻5引擎并定位多人联机第三人称动作游戏。", "body_html": "<p>拳头游戏于9月21日在广州成立傲拳（广州）网络科技有限公司，由中国区负责人林松担任法定代表人和董事。招聘信息显示，广州团队至少在为两款游戏招人：一款涉及城市发展、城池建设和资源生产，另一款“Riot Discovery”采用虚幻5引擎并定位多人联机第三人称动作游戏。</p>", "meta": ["Riot"], "sources": [["S0648", "拳头广州子公司招人了，至少有两款在研游戏", "https://new.qq.com/rain/a/20260929A0BKCW00"]]}, {"section": "industry", "title": "《正中靶心2》上线小游戏，续作进入月流水近10亿元赛道", "body": "广州开新研发的《正中靶心2》已在小游戏平台上线，续作把前作的单人守城改为四名英雄小队与雕像共用生存压力。前作《正中靶心》累计流水超过6亿元，其中微信小游戏单平台超过3亿元、海外App版本超过3200万美元；续作进入的“靶心like”赛道整体月流水被业内估算接近10亿元。", "body_html": "<p>广州开新研发的《正中靶心2》已在小游戏平台上线，续作把前作的单人守城改为四名英雄小队与雕像共用生存压力。前作《正中靶心》累计流水超过6亿元，其中微信小游戏单平台超过3亿元、海外App版本超过3200万美元；续作进入的“靶心like”赛道整体月流水被业内估算接近10亿元。</p>", "meta": ["正中靶心2", "小游戏"], "sources": [["S0729", "前作流水超6亿，开发者却说这是“遗憾之作”，《正中靶心2》低调上线小游戏", "https://www.sohu.com/a/1082259848_100136645"]]}, {"section": "industry", "title": "西山居招聘信息曝光跨端历史题材赛季制SLG", "body": "西山居招聘官网公开7个标注“在研SLG项目”的珠海岗位，覆盖用户运营、数据运营、内容营销、商业化和交互设计等方向。岗位描述指向历史国风题材、赛季制地图、联盟国战及GVG/GVE生态，交互设计同时要求理解移动端和PC端；七个岗位主要集中在运营与发行侧，显示项目已开始为后续运营搭建团队。", "body_html": "<p>西山居招聘官网公开7个标注“在研SLG项目”的珠海岗位，覆盖用户运营、数据运营、内容营销、商业化和交互设计等方向。岗位描述指向历史国风题材、赛季制地图、联盟国战及GVG/GVE生态，交互设计同时要求理解移动端和PC端；七个岗位主要集中在运营与发行侧，显示项目已开始为后续运营搭建团队。</p>", "meta": ["西山居", "SLG"], "sources": [["S0874", "刚刚西山居新作曝光，竟然是款SLG", "https://cgames.com/contents/2/13048.html"]]}, {"section": "industry", "title": "国产OC桌宠《角色屋》Demo最高同时在线近3万人", "body": "国内独立团队Yinengjie的首款Steam游戏《角色屋：桌面伙伴》免费Demo最高同时在线人数接近3万，258条用户评测中近98%为好评。产品把原创角色捏人与桌面陪伴结合，支持多角色同时显示；现阶段仍有素材量、交互深度、双屏适配和内存占用等问题，团队正通过社区收集反馈。", "body_html": "<p>国内独立团队Yinengjie的首款Steam游戏《角色屋：桌面伙伴》免费Demo最高同时在线人数接近3万，258条用户评测中近98%为好评。产品把原创角色捏人与桌面陪伴结合，支持多角色同时显示；现阶段仍有素材量、交互深度、双屏适配和内存占用等问题，团队正通过社区收集反馈。</p>", "meta": ["角色屋"], "sources": [["S0868", "混同人社区、第一次做游戏，就干出Steam近3万人在线《角色屋》？", "http://www.gamelook.com.cn/2026/09/603212/"]]}, {"section": "industry", "title": "iQOO与Unreal Engine达成移动游戏图形合作", "body": "iQOO在iQOO 16发布会上宣布与Epic Games旗下Unreal Engine成为移动游戏合作伙伴。双方将围绕Lumen动态全局光照、Nanite虚拟化几何体开展联合探索，并结合移动端图形、软硬件调校和UE5开发需求，推动高精度光影与几何细节在手机游戏中更稳定地落地。", "body_html": "<p>iQOO在iQOO 16发布会上宣布与Epic Games旗下Unreal Engine成为移动游戏合作伙伴。双方将围绕Lumen动态全局光照、Nanite虚拟化几何体开展联合探索，并结合移动端图形、软硬件调校和UE5开发需求，推动高精度光影与几何细节在手机游戏中更稳定地落地。</p>", "meta": [], "sources": [["S1021", "把主机级光影带进手机，iQOO 与 Unreal Engine 探索移动游戏图形合作新边界", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7655"]]}, {"section": "industry", "title": "朝夕光年展示7家工作室与12款产品，新一轮储备覆盖六个方向", "body": "朝夕光年于今年ChinaJoy一次性展示7家工作室、12款产品，其中一半是自研新品，覆盖动作、射击、模拟经营等方向。文中同时列出《雾影猎人》《不问凡尘》《零境·入侵》《代号：对决》《集合！浆果镇》《托托比亚》等储备，并披露与迪士尼、华纳、EA等国际厂商的合作仍在推进。", "body_html": "<p>朝夕光年于今年ChinaJoy一次性展示7家工作室、12款产品，其中一半是自研新品，覆盖动作、射击、模拟经营等方向。文中同时列出《雾影猎人》《不问凡尘》《零境·入侵》《代号：对决》《集合！浆果镇》《托托比亚》等储备，并披露与迪士尼、华纳、EA等国际厂商的合作仍在推进。</p>", "meta": ["雾影猎人", "不问凡尘", "模拟经营"], "sources": [["S1148", "7家工作室、12款产品，字节游戏开启下半场", "https://cgames.com/contents/2/13059.html"]]}, {"section": "industry", "title": "《心之眼》开发商进入破产管理，已基本解雇全部员工", "body": "《心之眼》开发商Build A Rocket Boy已进入破产管理程序，报道解释该状态意味着企业无力偿债，并由专业机构介入处理资产与债务。公司截至2025年9月30日录得4750万英镑营业亏损、3620万英镑净亏损和6180万英镑负债；BBC称工作室已基本解雇全部员工，而公司此前吸引的投资超过2.33亿英镑。", "body_html": "<p>《心之眼》开发商Build A Rocket Boy已进入破产管理程序，报道解释该状态意味着企业无力偿债，并由专业机构介入处理资产与债务。公司截至2025年9月30日录得4750万英镑营业亏损、3620万英镑净亏损和6180万英镑负债；BBC称工作室已基本解雇全部员工，而公司此前吸引的投资超过2.33亿英镑。</p>", "meta": ["心之眼"], "sources": [["S0881", "GTA前制作人光环也无用？超1.5亿美元融资项目暴死！Steam好评率仅12%", "https://www.youxituoluo.com/534927.html"], ["S0895", "屡次表明“有人害我们”后，《心之眼》工作室濒临破产，已解雇全部员工", "http://www.yystv.net/p/14460"]]}, {"section": "industry", "title": "欧盟消费者保护网络对九家公司游戏内虚拟货币启动协同行动", "body": "欧盟消费者保护合作网络于9月30日对九家游戏公司启动协同行动，涉及King、Mojang、Riot Games、Supercell和Ubisoft等主体；另与Activision Blizzard就《暗黑破坏神：不朽》《使命召唤手游》开展行动。争议焦点包括虚拟货币购买时是否同步显示真实货币价格，以及玩家购买和使用虚拟货币时的撤回权如何适用。", "body_html": "<p>欧盟消费者保护合作网络于9月30日对九家游戏公司启动协同行动，涉及King、Mojang、Riot Games、Supercell和Ubisoft等主体；另与Activision Blizzard就《暗黑破坏神：不朽》《使命召唤手游》开展行动。争议焦点包括虚拟货币购买时是否同步显示真实货币价格，以及玩家购买和使用虚拟货币时的撤回权如何适用。</p>", "meta": ["暗黑破坏神：不朽", "使命召唤手游", "Riot"], "sources": [["S1179", "Consumer Protection Cooperation Network launches coordinated actions against nine companies on in-game currency", "https://www.gamesindustry.biz/consumer-protection-cooperation-network-launches-coordinated-actions-against-nine-companies-on-in-game-currency"], ["S1191", "Video Games Europe hits back at EU watchdog targeting King, Supercell, Mojang and more over IAP practices", "https://mobilegamer.biz/video-games-europe-hits-back-at-eu-watchdog-targeting-king-supercell-mojang-and-more-over-iap-practices/"]]}, {"section": "ai", "title": "Meta发布AI游戏创作工具，打通生成、运营与社交分发", "body": "Meta发布Horizon Create和Horizon Studio两款AI游戏创作工具：用户可在手机或浏览器用文字描述生成包含关卡、成长系统和多人模式的2D或3D移动游戏，再进入对象、资产和运营分析环节继续调整，最终分发到Facebook、Instagram和Horizon。两款工具仍处测试阶段，只向部分创作者开放，正式上线日期尚未公布。", "body_html": "<p>Meta发布Horizon Create和Horizon Studio两款AI游戏创作工具：用户可在手机或浏览器用文字描述生成包含关卡、成长系统和多人模式的2D或3D移动游戏，再进入对象、资产和运营分析环节继续调整，最终分发到Facebook、Instagram和Horizon。两款工具仍处测试阶段，只向部分创作者开放，正式上线日期尚未公布。</p>", "meta": [], "sources": [["S0867", "社交巨头Meta发布AI游戏开发引擎：“对手机说句话就能做出游戏”？", "http://www.gamelook.com.cn/2026/09/603230/"], ["S0029", "Meta unveils AI-powered game tools for mobile devices and browsers; announces VR Glasses with day-one Unity support", "https://www.gamesindustry.biz/meta-unveils-ai-powered-game-tools-for-mobile-devices-and-browsers-announces-vr-glasses-with-day-one-unity-support"], ["S0042", "Horizon Create users can make games with a prompt and publish on Instagram and Facebook, says Meta", "https://mobilegamer.biz/horizon-create-users-can-create-and-publish-games-on-instagram-and-facebook-says-meta/"]]}, {"section": "ai", "title": "Hyper3D上线Agentic Mode，把3D资产生成接入智能体闭环", "body": "影眸Hyper3D正式上线Agentic Mode，把输入整理、参考分析和建模路径选择交给Agent；结果仍可继续进行参数调整、动画预设和材质增强。该功能面向游戏场景道具等资产，目标是让智能体完成生成、检查、修补和交付闭环。", "body_html": "<p>影眸Hyper3D正式上线Agentic Mode，把输入整理、参考分析和建模路径选择交给Agent；结果仍可继续进行参数调整、动画预设和材质增强。该功能面向游戏场景道具等资产，目标是让智能体完成生成、检查、修补和交付闭环。</p>", "meta": ["AI智能体"], "sources": [["S0348", "当GPT-6带火3D生成，Agent时代的首个“吃螃蟹者”来了", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7642"]]}, {"section": "ai", "title": "米哈游把AI NPC、研发Agent与自动化QA接入《崩坏》管线", "body": "米哈游《崩坏》系列团队披露，4.2版本曾上线的“AI帕姆”可做剧情问答、养成攻略、长期记忆和情绪反馈，并以记忆库更新跟上42天一次的大版本。研发侧的自研Agent平台EchoX已用于性能瓶颈定位、白盒Demo搭建和美术材质替换；让Coding Agent生成决策树的方案也已进入《崩坏：星穹铁道》QA流程。", "body_html": "<p>米哈游《崩坏》系列团队披露，4.2版本曾上线的“AI帕姆”可做剧情问答、养成攻略、长期记忆和情绪反馈，并以记忆库更新跟上42天一次的大版本。研发侧的自研Agent平台EchoX已用于性能瓶颈定位、白盒Demo搭建和美术材质替换；让Coding Agent生成决策树的方案也已进入《崩坏：星穹铁道》QA流程。</p>", "meta": ["崩坏", "米哈游"], "sources": [["S0619", "米哈游AI大佬揭秘：会说话的NPC与会做游戏的Agent，《崩坏》先行一步？", "http://www.gamelook.com.cn/2026/09/603104/"]]}, {"section": "ai", "title": "字节AI修仙RPG《不问凡尘》上线后最高在线达7206", "body": "朝夕光年约20人的江南工作室用Seedance等AI视频模型制作修仙RPG《不问凡尘》的仿真人角色与场景，产品于9月24日上线Steam抢先体验。次日游戏进入Steam畅销榜前20，最高同时在线人数达到7206、好评率为88%；从5月首次公布PV到9月上线，团队用模型迭代压缩了真人互动内容的资产生产周期。", "body_html": "<p>朝夕光年约20人的江南工作室用Seedance等AI视频模型制作修仙RPG《不问凡尘》的仿真人角色与场景，产品于9月24日上线Steam抢先体验。次日游戏进入Steam畅销榜前20，最高同时在线人数达到7206、好评率为88%；从5月首次公布PV到9月上线，团队用模型迭代压缩了真人互动内容的资产生产周期。</p>", "meta": ["不问凡尘", "字节跳动", "畅销榜"], "sources": [["S0620", "字节“AI修仙游戏”开卖！小师妹颜值拉满、19元诚意价，为何叫好不叫座？", "http://www.gamelook.com.cn/2026/09/603120/"], ["S0633", "冲进Steam畅销榜前列，字节这款AI作品火了", "https://youxichaguan.com/archives/211051"]]}, {"section": "ai", "title": "腾讯测试AI游戏伙伴“鹅次元”，先覆盖三款PC网游", "body": "腾讯AI游戏伙伴“鹅次元”已开启测试招募，当前聚焦PC端陪玩，并适配《无畏契约》《CS2》《英雄联盟》。产品需要用户授权游戏画面共享，可选择不同声线和形象，也曾支持添加QQ好友并共享聊天记忆；文本、陪玩、语音与图片生成计划通过付费能量消耗商业化，本轮测试暂时免费。", "body_html": "<p>腾讯AI游戏伙伴“鹅次元”已开启测试招募，当前聚焦PC端陪玩，并适配《无畏契约》《CS2》《英雄联盟》。产品需要用户授权游戏画面共享，可选择不同声线和形象，也曾支持添加QQ好友并共享聊天记忆；文本、陪玩、语音与图片生成计划通过付费能量消耗商业化，本轮测试暂时免费。</p>", "meta": ["无畏契约", "CS2", "腾讯"], "sources": [["S0649", "腾讯测试AI游戏伙伴「鹅次元」，暂时聚焦PC端陪玩", "https://new.qq.com/rain/a/20260929A0BKCQ00"]]}, {"section": "ai", "title": "网易伏羲把AI接入美术资产进包、局内队友与长期记忆NPC", "body": "网易伏羲披露，AI美术方案已打通角色、场景、GUI和视频工具链，并与Photoshop、Maya、Unity和Unreal Engine交互，实现从需求到资产进包的闭环。产品侧，《永劫无间》AI Copilot队友已串联语音识别、语义理解、行为规划与语音反馈，《逆水寒》则使用长期记忆AI NPC、玩家自定义NPC和视频动作识别的“剧组模式”；团队同时把推理延迟和成本列为AI原生世界的主要瓶颈。", "body_html": "<p>网易伏羲披露，AI美术方案已打通角色、场景、GUI和视频工具链，并与Photoshop、Maya、Unity和Unreal Engine交互，实现从需求到资产进包的闭环。产品侧，《永劫无间》AI Copilot队友已串联语音识别、语义理解、行为规划与语音反馈，《逆水寒》则使用长期记忆AI NPC、玩家自定义NPC和视频动作识别的“剧组模式”；团队同时把推理延迟和成本列为AI原生世界的主要瓶颈。</p>", "meta": ["永劫无间", "逆水寒", "网易"], "sources": [["S0871", "网易伏羲AI大佬分享，王宏显：AI重构游戏的三大方向！", "http://www.gamelook.com.cn/2026/09/603261/"]]}, {"section": "release", "title": "噬莱姆计划", "body": "平台跳跃端游《噬莱姆计划》于9月28日在PC平台正式发售；玩家可吸入、喷出脚下平台来解谜、战斗并选择通关路线。", "body_html": "<p>平台跳跃端游《噬莱姆计划》于9月28日在PC平台正式发售；玩家可吸入、喷出脚下平台来解谜、战斗并选择通关路线。</p>", "meta": ["噬莱姆计划"], "sources": [["S0377", "有自由度的平台跳跃：《噬莱姆计划》9月28日发售", "https://www.gcores.com/articles/220329"], ["S0502", "《噬莱姆计划》发售宣传视频", "https://www.ign.com.cn/topic/63027/shi-lai-mu-ji-hua-fa-shou-xuan-chuan-shi-pin"], ["S0601", "有自由度的平台跳跃：《噬莱姆计划》9月28日发售", "https://www.gcores.com/articles/220329"]]}, {"section": "release", "title": "摄影冒险2", "body": "黑白手绘摄影冒险多平台产品《摄影冒险2》于9月29日在PC、PS5和Nintendo Switch发售；以探索、拍照和解谜为主要玩法。", "body_html": "<p>黑白手绘摄影冒险多平台产品《摄影冒险2》于9月29日在PC、PS5和Nintendo Switch发售；以探索、拍照和解谜为主要玩法。</p>", "meta": ["摄影冒险2"], "sources": [["S1138", "【抽奖】温馨摄影冒险游戏《摄影冒险2》现已登陆PC、PS5及Nintendo Switch多平台", "https://www.gcores.com/articles/220402"], ["S1206", "十一假期玩什么：摄影冒险新旅程，空战奇兵再起飞，跟过劳上班族一起看海", "http://www.chuapp.com/article/291667.html"]]}, {"section": "discourse", "title": "《BanG Dream! Our Notes》水晶显示异常被误认为资源遭吞，公告称实际数量未减少", "body": "9月25日，《BanG Dream! Our Notes》玩家称从邮箱领取水晶、随即在网络异常时抽卡，会被踢回登录页，并看到水晶减少而抽卡没有发生；帖内多人报告100至400水晶的类似情况。9月28日帖内补充称官方已发公告，解释星石实际没有减少，而是Bug导致此前显示偏多。玩家不满的核心在于付费资源账面与抽卡状态不一致，争议随后转向服务器稳定性、显示一致性与官方说明的可信度。", "body_html": "<p>9月25日，《BanG Dream! Our Notes》玩家称从邮箱领取水晶、随即在网络异常时抽卡，会被踢回登录页，并看到水晶减少而抽卡没有发生；帖内多人报告100至400水晶的类似情况。9月28日帖内补充称官方已发公告，解释星石实际没有减少，而是Bug导致此前显示偏多。玩家不满的核心在于付费资源账面与抽卡状态不一致，争议随后转向服务器稳定性、显示一致性与官方说明的可信度。</p>", "meta": [], "sources": [["S0592", "[新瓜]邦多利新游ournotes出现恶性吞抽卡资源bug", "https://bbs.nga.cn/read.php?tid=47621309&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《银河境界线》停服后转Steam单机并启动众筹，玩家争论98元门槛与未完剧情", "body": "9月28日，2024年5月停服的战棋手游《银河境界线》在Steam出现单机版信息，玩家普遍认可停服产品转单机保存内容，但随后披露的众筹方案让讨论转向完成度与定价。帖内称基础档为98元、众筹达到120万元才增加新角色，且原作主线尚未写完。玩家不满的核心在于半成品内容与众筹门槛不匹配；支持者则愿意为补全剧情出资。", "body_html": "<p>9月28日，2024年5月停服的战棋手游《银河境界线》在Steam出现单机版信息，玩家普遍认可停服产品转单机保存内容，但随后披露的众筹方案让讨论转向完成度与定价。帖内称基础档为98元、众筹达到120万元才增加新角色，且原作主线尚未写完。玩家不满的核心在于半成品内容与众筹门槛不匹配；支持者则愿意为补全剧情出资。</p>", "meta": ["银河境界线", "停服"], "sources": [["S0588", "[新瓜] 战旗手游《银河境界线》将在steam上以单机版复活", "https://bbs.nga.cn/read.php?tid=47636425&forder_by=postdatedesc"], ["S0591", "[新瓜] 银河境界线虽然复活，但是筹集", "https://bbs.nga.cn/read.php?tid=47639262&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《物华弥新》付费限定池与重置首充引争议，项目组回信未回应机制问题", "body": "9月28日，《物华弥新》2.5周年活动被玩家指同时推出三个卡池，其中“凯尔特之书”为付费限定：活动提供40抽并保证本体，后续抽数需要购买198元付费内容；帖内更新称正式上线后无法用既有红卡提升致知。争议又因半年节点重置首充而升级，玩家质疑限定角色的后续养成被进一步绑定付费。 10月1日，项目组回信称正在寻找项目存续与调性的平衡，并宣布10月10日赠送一份衣装自选礼盒；回信未直接回应付费限定卡池、通用信物限制和首充重置，讨论因而转向补偿与核心争议是否错位。", "body_html": "<p>9月28日，《物华弥新》2.5周年活动被玩家指同时推出三个卡池，其中“凯尔特之书”为付费限定：活动提供40抽并保证本体，后续抽数需要购买198元付费内容；帖内更新称正式上线后无法用既有红卡提升致知。争议又因半年节点重置首充而升级，玩家质疑限定角色的后续养成被进一步绑定付费。 10月1日，项目组回信称正在寻找项目存续与调性的平衡，并宣布10月10日赠送一份衣装自选礼盒；回信未直接回应付费限定卡池、通用信物限制和首充重置，讨论因而转向补偿与核心争议是否错位。</p>", "meta": ["物华弥新"], "sources": [["S1128", "[新瓜] [物华弥新]物华弥新在2.5周年同时搬出了仅付费卡池和半周年重置首充", "https://bbs.nga.cn/read.php?tid=47638474&forder_by=postdatedesc"], ["S1335", "[来古弥新]物华弥新就最近事件做出的回应", "https://bbs.nga.cn/read.php?tid=47652433&forder_by=postdatedesc"]]}, {"section": "deep", "title": "爆款正在放大Playtika的资产负债矛盾，增长引擎与现金安全难以兼得", "body": "观察：《Disney Solitaire》单季收入达到1.42亿美元，却因触发收购对赌而加快现金流出；爆款可以修复产品线，却未必能修复被债务与并购条款锁住的公司结构。 分析：爆款首先改变了SuperPlay的经营价值，却同时抬高了Playtika的现金义务。产品突破业绩目标后，最高12.5亿美元对赌付款的兑现压力随之上升，成功本身因此变成更快的现金流出触发器，而不是单向增加财务安全垫。 历史杠杆又压缩了这笔增长能够发挥的空间。24.1亿美元债务与接近2亿美元年偿债成本先于新增投入消耗现金，公司现金六个月由8.2亿美元降至4.38亿美元；保留SuperPlay意味着继续承受付款，出售则会在修复资产负债表的同时交出唯一增长引擎，产品成功与资本结构由此发生冲突。同周另一则休闲赛道报道还提到“腾讯可能收购Playtika旗下SuperPlay”的市场传闻；这不改变上述财务判断，只说明这项资产的处置想象已进入行业叙事。", "body_html": "<p>观察：《Disney Solitaire》单季收入达到1.42亿美元，却因触发收购对赌而加快现金流出；爆款可以修复产品线，却未必能修复被债务与并购条款锁住的公司结构。</p><p>分析：爆款首先改变了SuperPlay的经营价值，却同时抬高了Playtika的现金义务。产品突破业绩目标后，最高12.5亿美元对赌付款的兑现压力随之上升，成功本身因此变成更快的现金流出触发器，而不是单向增加财务安全垫。</p><p>历史杠杆又压缩了这笔增长能够发挥的空间。24.1亿美元债务与接近2亿美元年偿债成本先于新增投入消耗现金，公司现金六个月由8.2亿美元降至4.38亿美元；保留SuperPlay意味着继续承受付款，出售则会在修复资产负债表的同时交出唯一增长引擎，产品成功与资本结构由此发生冲突。同周另一则休闲赛道报道还提到“腾讯可能收购Playtika旗下SuperPlay”的市场传闻；这不改变上述财务判断，只说明这项资产的处置想象已进入行业叙事。</p>", "meta": ["腾讯", "并购"], "sources": [["S0160", "How Playtika's best game became its biggest headache", "https://www.deconstructoroffun.com/blog/how-playtikas-best-game-became-its-biggest-headache"], ["S0880", "腾讯再出手：1.67亿元，投了土耳其休闲游戏厂商Circle Games", "https://www.youxituoluo.com/534926.html"]]}, {"section": "deep", "title": "《Disney Solitaire》把变现后移：先扩大通过率，再用深层留存与高频活动回收", "body": "观察：SuperPlay没有沿用品类旧作的早期挤压，而是用更宽松金币、更慢难度爬坡和高频连胜活动扩大漏斗；收入增长来自把提取时点后移，而不是一开始提高付费压力。 分析：前期经济先服务通过率。更宽松的金币、更慢的难度上升与完成场景后的快速动画，让更多用户进入深层关卡，并把非付费等待压缩到核心循环之外。这套设计不是放弃变现，而是先减少早期流失，再扩大能够被长期运营触达的用户池。 后段回收依赖持续推进与活动密度。产品在90天内运行610个活动实例，并以连胜机制为主，区别于旧作偏优惠券和商店促销的做法；活动由一次销售转向连续行为塑造。其边界也很明确：漏斗放宽只有在深层留存成立时才能转化为收入，否则宽松经济只会延后而不能完成提取。", "body_html": "<p>观察：SuperPlay没有沿用品类旧作的早期挤压，而是用更宽松金币、更慢难度爬坡和高频连胜活动扩大漏斗；收入增长来自把提取时点后移，而不是一开始提高付费压力。</p><p>分析：前期经济先服务通过率。更宽松的金币、更慢的难度上升与完成场景后的快速动画，让更多用户进入深层关卡，并把非付费等待压缩到核心循环之外。这套设计不是放弃变现，而是先减少早期流失，再扩大能够被长期运营触达的用户池。</p><p>后段回收依赖持续推进与活动密度。产品在90天内运行610个活动实例，并以连胜机制为主，区别于旧作偏优惠券和商店促销的做法；活动由一次销售转向连续行为塑造。其边界也很明确：漏斗放宽只有在深层留存成立时才能转化为收入，否则宽松经济只会延后而不能完成提取。</p>", "meta": [], "sources": [["S0160", "How Playtika's best game became its biggest headache", "https://www.deconstructoroffun.com/blog/how-playtikas-best-game-became-its-biggest-headache"]]}, {"section": "deep", "title": "腾讯把品类领导力写成多产品目标，长期资本的门槛是连续可验证进步", "body": "观察：腾讯允许工作室用两到三款产品走向品类领导位置，并以Larian、FromSoftware的连续迭代为参照；长期承诺并非无限等待，而是要求每一代都证明方向正在收敛。 分析：目标跨越多个产品周期后，投资判断就不再要求首作立即领先，而是要求团队说明两到三款产品后的品类位置。Divinity到Baldur's Gate、Demon's Souls到Elden Ring的多代积累被用作参照，说明市场认知与能力壁垒都需要连续作品逐步形成。 耐心因此有明确交换条件。资本持有期可以拉长，但玩法、团队与受众认知必须在每个阶段继续收敛；品类承诺替代的是单次成败押注，不是阶段审查。只要连续进步无法被验证，长期资本也就失去继续等待的依据。", "body_html": "<p>观察：腾讯允许工作室用两到三款产品走向品类领导位置，并以Larian、FromSoftware的连续迭代为参照；长期承诺并非无限等待，而是要求每一代都证明方向正在收敛。</p><p>分析：目标跨越多个产品周期后，投资判断就不再要求首作立即领先，而是要求团队说明两到三款产品后的品类位置。Divinity到Baldur's Gate、Demon's Souls到Elden Ring的多代积累被用作参照，说明市场认知与能力壁垒都需要连续作品逐步形成。</p><p>耐心因此有明确交换条件。资本持有期可以拉长，但玩法、团队与受众认知必须在每个阶段继续收敛；品类承诺替代的是单次成败押注，不是阶段审查。只要连续进步无法被验证，长期资本也就失去继续等待的依据。</p>", "meta": ["腾讯"], "sources": [["S0846", "Tencent’s bid to create the next FromSoftware and Larian", "https://www.thegamebusiness.com/p/tencents-bid-to-create-the-next-fromsoftware"]]}];
    const sectionLabels = Object.fromEntries(sections.map(s => [s.id, s.label]));
    const sectionDescs = Object.fromEntries(sections.map(s => [s.id, s.desc]));
    const orderedSectionIds = sections.filter(s => s.id !== "all").map(s => s.id);
    let currentSection = "all";
    let compact = false;
    const nav = document.getElementById("nav");
    const content = document.getElementById("content");
    const sectionHead = document.getElementById("sectionHead");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    function matches(item, query) {
      if (!query) return true;
      const text = [item.title,item.body,item.meta.join(" "),item.sources.map(s => s.join(" ")).join(" ")].join(" ").toLowerCase();
      return text.includes(query.toLowerCase());
    }
    function isBorderline(m) {
      return /borderline/i.test(m);
    }
    function renderNav() {
      nav.innerHTML = "";
      sections.forEach(section => {
        const count = section.id === "all" ? items.length : items.filter(item => item.section === section.id).length;
        const button = document.createElement("button");
        button.dataset.section = section.id;
        if (section.id === currentSection) button.classList.add("active");
        button.innerHTML = `<span>${section.label}</span><span class="count">${count}</span>`;
        button.addEventListener("click", () => { currentSection = section.id; render(); });
        nav.appendChild(button);
      });
    }
    function renderItem(item) {
      const node = document.createElement("article");
      node.className = "item";
      node.dataset.section = item.section;
      const metaTags = item.meta.map(m => {
        const cls = isBorderline(m) ? "borderline" : "";
        return `<span class="${cls}">${m}</span>`;
      }).join("");
      const bodyMarkup = item.body_html || `<p>${item.body}</p>`;
      node.innerHTML = `<div class="item-top"><span class="tag">${sectionLabels[item.section]}</span></div><h3>${item.title}</h3>${bodyMarkup}<div class="meta-row">${metaTags}</div><button class="source-btn" type="button">查看来源 →</button>`;
      node.querySelector(".source-btn").addEventListener("click", () => openDrawer(item));
      return node;
    }
    function buildGrid(itemList) {
      const grid = document.createElement("section");
      grid.className = compact ? "grid compact" : "grid";
      itemList.forEach(item => grid.appendChild(renderItem(item)));
      return grid;
    }
    function buildSectionBlock(sectionId, itemList) {
      const block = document.createElement("div");
      block.className = "section-block";
      const banner = document.createElement("div");
      banner.className = "section-banner";
      banner.dataset.section = sectionId;
      banner.innerHTML = `<h2>${sectionLabels[sectionId]}</h2><span class="banner-count">${itemList.length} 条</span><span class="banner-desc">${sectionDescs[sectionId]}</span>`;
      block.appendChild(banner);
      block.appendChild(buildGrid(itemList));
      return block;
    }
    function render() {
      renderNav();
      const query = search.value.trim();
      const filtered = items.filter(item => (currentSection === "all" || item.section === currentSection) && matches(item, query));
      content.innerHTML = "";
      if (currentSection === "all") {
        sectionHead.style.display = "none";
        orderedSectionIds.forEach(sid => {
          const sectionItems = filtered.filter(it => it.section === sid);
          if (sectionItems.length > 0) content.appendChild(buildSectionBlock(sid, sectionItems));
        });
      } else {
        sectionHead.style.display = "flex";
        sectionHead.dataset.section = currentSection;
        document.getElementById("sectionTitle").textContent = sectionLabels[currentSection];
        document.getElementById("sectionDesc").textContent = sectionDescs[currentSection];
        content.appendChild(buildGrid(filtered));
      }
      empty.classList.toggle("visible", filtered.length === 0);
    }
    function openDrawer(item) {
      document.getElementById("drawerTitle").textContent = item.title;
      document.getElementById("drawerNote").textContent = item.body;
      document.getElementById("sourceList").innerHTML = item.sources.map(([id,name,url]) => {
        const safeUrl = String(url || "");
        const isHttp = /^https?:\/\//i.test(safeUrl);
        const linkAttrs = isHttp ? `href="${safeUrl}" target="_blank" rel="noopener noreferrer"` : "";
        const urlEl = isHttp
          ? `<a class="source-url" ${linkAttrs}>${safeUrl} ↗</a>`
          : `<span class="source-url">${safeUrl}</span>`;
        return `<div class="source-card"><strong>${id} · ${name}</strong>${urlEl}</div>`;
      }).join("");
      drawer.classList.add("open"); overlay.classList.add("open");
    }
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
    search.addEventListener("input", render);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    // Sidebar collapse — state persists in localStorage
    const app = document.getElementById("app");
    const SIDEBAR_KEY = "report-sidebar-collapsed";
    try { if (localStorage.getItem(SIDEBAR_KEY) === "1") app.classList.add("collapsed"); } catch (e) {}
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      app.classList.toggle("collapsed");
      try { localStorage.setItem(SIDEBAR_KEY, app.classList.contains("collapsed") ? "1" : "0"); } catch (e) {}
    });
    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("viewGrid").addEventListener("click", () => { compact = false; document.getElementById("viewGrid").classList.add("active"); document.getElementById("viewList").classList.remove("active"); render(); });
    document.getElementById("viewList").addEventListener("click", () => { compact = true; document.getElementById("viewList").classList.add("active"); document.getElementById("viewGrid").classList.remove("active"); render(); });
    render();
  </script>
</body>
</html>
