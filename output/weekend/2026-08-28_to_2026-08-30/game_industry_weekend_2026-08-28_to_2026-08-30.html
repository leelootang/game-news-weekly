<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏行业周末报 | 2026-08-28 ~ 2026-08-30</title>
  <style>
    :root {
      --ink:#1a2436; --ink-soft:#3a4862; --muted:#6b7993; --faint:#9aa6bd;
      --accent:#5b6ef5;
      --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78);
      --glass-border:rgba(255,255,255,.7); --line:rgba(31,45,75,.10); --line-strong:rgba(31,45,75,.16);
      --shadow-sm:0 3px 12px rgba(31,45,75,.05);
      --shadow:0 6px 28px rgba(31,45,75,.07);
      --shadow-lg:0 14px 40px rgba(31,45,75,.12);
      --industry:#4f7cff; --industry-soft:rgba(79,124,255,.12); --industry-ink:#2b53c4;
      --ai:#00b3d4; --ai-soft:rgba(0,179,212,.12); --ai-ink:#06748a;
      --release:#16b884; --release-soft:rgba(22,184,132,.13); --release-ink:#0b7a57;
      --discourse:#f0a02a; --discourse-soft:rgba(240,160,42,.15); --discourse-ink:#9a6206;
      --deep:#8b6df0; --deep-soft:rgba(139,109,240,.13); --deep-ink:#5a3fc0;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif; line-height:1.65; -webkit-font-smoothing:antialiased; }
    /* decorative gradient field behind the frosted glass */
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(circle at 12% 18%, rgba(91,110,245,.20), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(0,179,212,.16), transparent 40%),
        radial-gradient(circle at 78% 88%, rgba(139,109,240,.18), transparent 46%),
        radial-gradient(circle at 25% 92%, rgba(22,184,132,.13), transparent 44%),
        linear-gradient(135deg,#eef1fb 0%,#f3effb 48%,#eaf3fc 100%); }
    a { color:inherit; text-decoration:none; }
    button,input { font:inherit; }
    ::selection { background:rgba(91,110,245,.22); }
    .app { min-height:100vh; display:grid; grid-template-columns:264px minmax(0,1fr); transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
    .app.collapsed { grid-template-columns:0 minmax(0,1fr); }

    /* Sidebar — frosted glass */
    aside.sidebar { position:sticky; top:0; height:100vh; padding:24px 18px; color:var(--ink); display:flex; flex-direction:column;
      background:rgba(255,255,255,.48); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
      border-right:1px solid rgba(255,255,255,.55); overflow-y:auto; overflow-x:hidden; transition:transform .25s cubic-bezier(.4,0,.2,1), opacity .2s; }
    .app.collapsed aside.sidebar { transform:translateX(-100%); opacity:0; pointer-events:none; }

    /* Sidebar toggle button (in topbar, always visible) */
    .sidebar-toggle { width:40px; height:40px; border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; border-radius:12px; display:grid; place-items:center; font-size:16px; line-height:1; transition:all .14s; }
    .sidebar-toggle:hover { color:var(--accent); border-color:var(--accent); }
    .sidebar-toggle .icon-open { display:inline; }
    .sidebar-toggle .icon-close { display:none; }
    .app.collapsed .sidebar-toggle .icon-open { display:none; }
    .app.collapsed .sidebar-toggle .icon-close { display:inline; }
    .back-home { width:max-content; display:inline-flex; align-items:center; gap:7px; margin:0 2px 18px; padding:7px 10px; border-radius:9px; color:var(--ink-soft); text-decoration:none; font-size:13px; font-weight:600; transition:background .14s,color .14s,transform .14s; }
    .back-home:hover { background:rgba(255,255,255,.62); color:var(--accent); transform:translateX(-2px); }
    .back-home:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 2px 20px; border-bottom:1px solid var(--line); }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:11px; background:#fff; padding:7px; box-shadow:0 3px 10px rgba(31,45,75,.10); }
    .brand-mark img { width:100%; height:100%; display:block; object-fit:contain; }
    .brand strong { display:block; font-size:15px; line-height:1.1; letter-spacing:.2px; color:var(--ink); }
    .brand span { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
    .nav-title { margin:22px 0 10px; color:var(--faint); font-size:10px; letter-spacing:1.3px; text-transform:uppercase; font-weight:700; }
    .nav { display:grid; gap:3px; }
    .nav button { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; border:0; background:transparent; color:var(--ink-soft); padding:11px 14px; text-align:left; cursor:pointer; border-radius:11px; position:relative; font-size:14px; font-weight:500; transition:all .14s; }
    .nav button:hover { background:rgba(255,255,255,.55); color:var(--ink); }
    .nav button.active { background:rgba(91,110,245,.12); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px rgba(91,110,245,.18); }
    .nav button.active::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--accent2,var(--accent)); }
    .nav button[data-section="industry"] { --accent2:var(--industry); }
    .nav button[data-section="ai"] { --accent2:var(--ai); }
    .nav button[data-section="release"] { --accent2:var(--release); }
    .nav button[data-section="discourse"] { --accent2:var(--discourse); }
    .nav button[data-section="deep"] { --accent2:var(--deep); }
    .count { min-width:24px; padding:1px 9px; color:var(--muted); background:rgba(31,45,75,.07); text-align:center; border-radius:11px; font-size:12px; font-weight:600; }
    .nav button.active .count { background:var(--accent2,var(--accent)); color:#fff; }
    .sidebar-footer { margin:auto -18px -24px; padding:16px 22px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.65; }
    .sidebar-footer .made { color:var(--ink-soft); font-weight:600; }
    .sidebar-footer a { color:var(--accent); }
    .sidebar-footer .stat { margin-top:8px; color:var(--faint); }

    /* Main */
    main { padding:30px 40px 64px; min-width:0; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; line-height:1.25; letter-spacing:-.2px; font-weight:800; color:var(--ink); }
    .subtitle { margin-top:8px; color:var(--muted); font-size:13.5px; }
    .actions { display:flex; gap:10px; align-items:center; }
    .search { width:320px; display:flex; align-items:center; gap:8px; background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); padding:9px 14px; border-radius:12px; transition:border-color .15s, box-shadow .15s; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,110,245,.12); background:#fff; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:13.5px; }
    .search input::placeholder { color:var(--faint); }
    .icon-btn { border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; width:40px; height:40px; border-radius:12px; transition:all .14s; }
    .icon-btn:hover { color:var(--accent); border-color:var(--accent); }

    /* Metrics */
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:30px; }
    .metric { background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); padding:18px 20px; border-radius:18px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden; }
    .metric::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent2,var(--industry)); }
    .metric:nth-child(1) { --accent2:var(--industry); }
    .metric:nth-child(2) { --accent2:var(--release); }
    .metric:nth-child(3) { --accent2:var(--discourse); }
    .metric:nth-child(4) { --accent2:var(--deep); }
    .metric span { color:var(--muted); font-size:12.5px; letter-spacing:.3px; }
    .metric strong { display:block; font-size:26px; line-height:1.1; margin-top:6px; font-weight:800; color:var(--ink); }

    /* Section-head (单 section 视图) */
    .section-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin:6px 0 20px; padding:16px 20px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); border-left:4px solid var(--accent2,var(--industry)); border-radius:18px; box-shadow:var(--shadow-sm); }
    .section-head[data-section="industry"] { --accent2:var(--industry); }
    .section-head[data-section="ai"] { --accent2:var(--ai); }
    .section-head[data-section="release"] { --accent2:var(--release); }
    .section-head[data-section="discourse"] { --accent2:var(--discourse); }
    .section-head[data-section="deep"] { --accent2:var(--deep); }
    h2 { margin:0; font-size:20px; font-weight:700; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .toggle { display:flex; border:1px solid var(--glass-border); background:var(--glass); border-radius:11px; overflow:hidden; }
    .toggle button { padding:8px 15px; border:0; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13px; transition:all .14s; }
    .toggle button.active { background:var(--accent); color:#fff; font-weight:600; }

    /* "全部" 视图下的 section 分块 */
    .section-block { margin-top:38px; min-width:0; }
    .section-block:first-child { margin-top:0; }
    .section-banner { display:flex; align-items:baseline; gap:14px; padding:13px 18px; margin-bottom:16px; background:var(--accent-soft,var(--industry-soft)); border-left:4px solid var(--accent2,var(--industry)); border-radius:14px; }
    .section-banner[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .section-banner[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .section-banner[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .section-banner[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .section-banner[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .section-banner h2 { color:var(--accent-ink); font-size:17px; margin:0; font-weight:700; }
    .section-banner .banner-count { color:var(--accent2); font-weight:700; font-size:13px; }
    .section-banner .banner-desc { color:var(--accent-ink); opacity:.7; font-size:13px; margin-left:auto; }

    /* Cards — glass */
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; min-width:0; }
    .grid.compact { grid-template-columns:1fr; }
    .item { min-width:0; background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); border-left:3px solid var(--accent2,var(--industry)); padding:20px 24px; border-radius:18px; box-shadow:var(--shadow-sm); transition:transform .18s, box-shadow .18s; display:flex; flex-direction:column; }
    .item:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
    .item[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .item[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .item[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .item[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .item[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .item-top { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:11px; }
    .tag { padding:3px 11px; font-size:12px; color:var(--accent-ink); background:var(--accent-soft); border-radius:8px; font-weight:700; letter-spacing:.2px; }
    h3 { margin:2px 0 10px; font-size:17.5px; line-height:1.45; font-weight:700; color:var(--ink); letter-spacing:.1px; }
    .item p { margin:0 0 14px; color:var(--ink-soft); font-size:14.5px; line-height:1.78; }
    .meta-row { display:flex; flex-wrap:wrap; gap:7px; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .meta-row span { padding:3px 10px; background:rgba(31,45,75,.06); border-radius:8px; }
    .item .meta-row span.borderline { background:rgba(240,160,42,.14); color:#a8680a; }
    .source-btn { margin-top:14px; padding:8px 14px; border:1px solid var(--glass-border); background:rgba(255,255,255,.5); color:var(--accent); cursor:pointer; border-radius:11px; font-size:13px; font-weight:600; align-self:flex-start; transition:all .14s; }
    .source-btn:hover { background:var(--accent-soft); border-color:var(--accent2); }
    .ranking-notes { margin:0 0 12px; padding-left:20px; color:var(--ink-soft); line-height:1.55; font-size:13.5px; }
    .ranking-table-wrap { width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.54); }
    .ranking-table { width:100%; min-width:680px; border-collapse:collapse; font-size:12.5px; }
    .ranking-table th,.ranking-table td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    .ranking-table th { color:var(--ink); background:rgba(208,95,63,.08); font-weight:700; }
    .ranking-table td:first-child,.ranking-table th:first-child { text-align:right; }
    .ranking-table tbody tr:last-child td { border-bottom:0; }
    .empty { display:none; padding:48px; border:1px dashed var(--line-strong); color:var(--muted); text-align:center; background:var(--glass); border-radius:18px; }
    .empty.visible { display:block; }

    /* Drawer */
    .overlay { position:fixed; inset:0; display:none; background:rgba(26,36,54,.3); backdrop-filter:blur(3px); }
    .overlay.open { display:block; }
    .drawer { position:fixed; top:0; right:0; width:min(440px,100vw); height:100vh; transform:translateX(100%); transition:.22s cubic-bezier(.4,0,.2,1); background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border-left:1px solid var(--glass-border); box-shadow:-18px 0 44px rgba(31,45,75,.16); padding:24px; overflow:auto; }
    .drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:8px; }
    .drawer h2 { font-size:17px; line-height:1.4; }
    #drawerNote { color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .source-card { border:1px solid var(--glass-border); padding:13px 15px; margin-top:10px; border-radius:12px; background:rgba(255,255,255,.55); }
    .source-card strong { font-size:13px; color:var(--ink); }
    .source-url { display:block; margin-top:6px; color:var(--accent); overflow-wrap:anywhere; user-select:text; font-size:12.5px; text-decoration:none; }
    a.source-url:hover { text-decoration:underline; }
    a.source-url:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

    @media (max-width:900px) {
      .app { grid-template-columns:1fr; }
      aside.sidebar { position:relative; height:auto; }
      .nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
      main { padding:22px 18px 36px; }
      .topbar,.section-head { align-items:stretch; flex-direction:column; }
      .search { width:100%; }
      .metrics,.grid { grid-template-columns:1fr; }
      .section-banner { flex-wrap:wrap; }
      .section-banner .banner-desc { margin-left:0; width:100%; }
    }
    @media print {
      body::before { display:none; }
      aside.sidebar,.actions,.toggle,.source-btn,.drawer,.overlay { display:none!important; }
      .app { display:block; }
      main { padding:0; }
      .item { break-inside:avoid; box-shadow:none; border-color:#bbb; backdrop-filter:none; background:#fff; }
      .section-banner { break-after:avoid; }
    }
  </style>
</head>

      <a class="back-home" href="../../" aria-label="返回情报站首页">← 返回首页</a>

    <main>
      <div class="topbar">

    const items = [{"section": "industry", "title": "腾讯ACE与Sandbox Interactive合作，为《Albion Online》安卓端提供反作弊支持", "body": "腾讯游戏安全ACE、腾讯云与Sandbox Interactive宣布合作，《Albion Online》安卓客户端将接入ACE Standard反作弊方案，计划于2026年第三季度上线。方案结合客户端、服务端验证与代码加固，并向厂商提供反作弊API和对局准入数据。", "body_html": "<p>腾讯游戏安全ACE、腾讯云与Sandbox Interactive宣布合作，《Albion Online》安卓客户端将接入ACE Standard反作弊方案，计划于2026年第三季度上线。方案结合客户端、服务端验证与代码加固，并向厂商提供反作弊API和对局准入数据。</p>", "meta": ["腾讯"], "sources": [["S0033", "腾讯游戏安全 ACE 携手腾讯云与 Sandbox Interactive 达成合作，护航全球知名MMO《Albion Online》", "http://www.gamelook.com.cn/2026/08/600944/"], ["S0350", "腾讯游戏安全ACE亮相Gamescom2026并与欧洲游戏厂商达成合作", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7517"]]}, {"section": "industry", "title": "集英社游戏公布《征服纪：臣民之心》，结合殖民模拟与4X策略", "body": "MicroSimulation开发、集英社游戏发行的《征服纪：臣民之心》正式公开，计划于2027年夏季在Steam发售。玩家从聚落建设推进到国家经营，居民的日常活动、愿望与不满可以影响贸易、叛乱和外交；项目同步公开首支预告并上线商店页面。", "body_html": "<p>MicroSimulation开发、集英社游戏发行的《征服纪：臣民之心》正式公开，计划于2027年夏季在Steam发售。玩家从聚落建设推进到国家经营，居民的日常活动、愿望与不满可以影响贸易、叛乱和外交；项目同步公开首支预告并上线商店页面。</p>", "meta": ["征服纪：臣民之心"], "sources": [["S0022", "殖民模拟 × 4X 策略游戏《征服纪：臣民之心》正式发表", "https://www.gcores.com/articles/218873"], ["S0059", "每一个市民的意志不断累积，终将改写国境线——", "https://youxichaguan.com/archives/206292"], ["S0297", "殖民模拟 × 4X 策略游戏《征服纪：臣民之心》正式发表", "https://www.gcores.com/articles/218873"]]}, {"section": "industry", "title": "《超自然行动组》与Garena达成合作，计划进入东南亚和拉美", "body": "巨人网络披露，《超自然行动组》已与Garena达成战略合作，计划于2027年第一季度登陆东南亚、拉美市场。该安排属于后续区域发行计划，尚未进入上述市场的正式上线阶段。", "body_html": "<p>巨人网络披露，《超自然行动组》已与Garena达成战略合作，计划于2027年第一季度登陆东南亚、拉美市场。该安排属于后续区域发行计划，尚未进入上述市场的正式上线阶段。</p>", "meta": ["超自然行动组", "巨人网络", "东南亚"], "sources": [["S0037", "巨人网络上半年净利润暴增175%！《超自然行动组》DAU破1200万、持续领跑", "http://www.gamelook.com.cn/2026/08/600949/"]]}, {"section": "industry", "title": "暴雪与CD Projekt合作，将《巫师3》重制版带到Battle.net", "body": "暴雪宣布与CD Projekt合作，将《The Witcher 3: Wild Hunt — Remastered》带到Battle.net。通过该平台购买还可获得《Diablo IV》的杰洛特主题皮肤，合作把第三方RPG销售与平台内既有游戏奖励结合。", "body_html": "<p>暴雪宣布与CD Projekt合作，将《The Witcher 3: Wild Hunt — Remastered》带到Battle.net。通过该平台购买还可获得《Diablo IV》的杰洛特主题皮肤，合作把第三方RPG销售与平台内既有游戏奖励结合。</p>", "meta": ["巫师3", "Diablo IV"], "sources": [["S0378", "Hearth & Hamlet’s ~100k & the rise of the bite-sized clicker...", "https://newsletter.gamediscover.co/p/hearth-and-hamlets-100k-and-the-rise"], ["S0289", "Assassin’s Creed creator Patrice Désilets: “I have two or three games left”", "https://www.thegamebusiness.com/p/assassins-creed-creator-patrice-desilets"]]}, {"section": "industry", "title": "轮盘赌构筑肉鸽《雪夜枪声》发售", "body": "轮盘赌构筑肉鸽游戏《雪夜枪声》已发售。", "body_html": "<p>轮盘赌构筑肉鸽游戏《雪夜枪声》已发售。</p>", "meta": ["雪夜枪声"], "sources": [["S0028", "轮盘赌构筑肉鸽游戏《雪夜枪声》现已发售", "https://www.gcores.com/articles/218985"]]}, {"section": "industry", "title": "Raccoon Logic公布4对4冰球新作，计划通过抢先体验迭代", "body": "Raccoon Logic公布快节奏4对4冰球游戏《Breakaway Hockey League》，计划采用抢先体验模式。团队表示，希望缩短传统三四年的封闭开发周期，更早与玩家共同迭代；这一选择也与其前作虽通过订阅获得大量玩家、附加内容购买却未同步增长的经验有关。", "body_html": "<p>Raccoon Logic公布快节奏4对4冰球游戏《Breakaway Hockey League》，计划采用抢先体验模式。团队表示，希望缩短传统三四年的封闭开发周期，更早与玩家共同迭代；这一选择也与其前作虽通过订阅获得大量玩家、附加内容购买却未同步增长的经验有关。</p>", "meta": [], "sources": [["S0289", "Assassin’s Creed creator Patrice Désilets: “I have two or three games left”", "https://www.thegamebusiness.com/p/assassins-creed-creator-patrice-desilets"]]}, {"section": "industry", "title": "网易《燕云十六声》全球玩家突破一亿", "body": "网易《燕云十六声》于8月28日披露，全球玩家已突破一亿。该数字为官方公布的累计玩家规模，体现武侠开放世界产品的覆盖范围，并非日活跃用户口径。", "body_html": "<p>网易《燕云十六声》于8月28日披露，全球玩家已突破一亿。该数字为官方公布的累计玩家规模，体现武侠开放世界产品的覆盖范围，并非日活跃用户口径。</p>", "meta": ["燕云十六声", "网易"], "sources": [["S0050", "出击科隆展！网易五大自研矩阵亮相，向世界展现中国原创力量", "https://youxichaguan.com/archives/206220"], ["S0111", "网易《燕云十六声》官宣全球游侠现已突破一亿人", "https://www.gameres.com/901202713.html"], ["S0385", "网易大作官宣用户破亿：首曝4年后，他们重返科隆，一战封神", "https://m.sohu.com/a/1069720644_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.3.1788134503115mcXM9DF"]]}, {"section": "industry", "title": "三七互娱《赘婿》曾进入微信小游戏畅销前15，随后跌至百名外", "body": "厦门延趣研发、三七互娱发行的模拟经营游戏《赘婿》于8月12日全平台上线，曾进入微信小游戏畅销榜前15；报道发布时已跌至百名以外。其App端曾达到iOS畅销榜第83名，产品以男频网文IP包装竖屏经营、门客养成与商战玩法。", "body_html": "<p>厦门延趣研发、三七互娱发行的模拟经营游戏《赘婿》于8月12日全平台上线，曾进入微信小游戏畅销榜前15；报道发布时已跌至百名以外。其App端曾达到iOS畅销榜第83名，产品以男频网文IP包装竖屏经营、门客养成与商战玩法。</p>", "meta": ["赘婿", "三七互娱", "模拟经营"], "sources": [["S0046", "三七新游杀进畅销Top15：男频逆袭爽文，能复刻大女主神话吗？", "https://www.youxituoluo.com/534837.html"]]}, {"section": "industry", "title": "Rockstar为《GTA 6》组建洛杉矶团队，逐个设计NPC", "body": "Rockstar披露，已在洛杉矶组建由编剧、导演和制作人组成的团队，为《GTA 6》逐个设计更具真实感的NPC。团队不仅处理人物本身，也为房间陈设、照片与生活细节建立相互关联的叙事背景。", "body_html": "<p>Rockstar披露，已在洛杉矶组建由编剧、导演和制作人组成的团队，为《GTA 6》逐个设计更具真实感的NPC。团队不仅处理人物本身，也为房间陈设、照片与生活细节建立相互关联的叙事背景。</p>", "meta": ["GTA 6"], "sources": [["S0077", "Rockstar formed a new LA-based team to develop more realistic NPCs for Grand Theft Auto 6", "https://www.gamesindustry.biz/rockstar-formed-a-new-la-based-team-to-develop-more-realistic-npcs-for-grand-theft-auto-6"]]}, {"section": "industry", "title": "1047 Games停止两款射击游戏开发，转向点对点托管", "body": "1047 Games宣布结束《Empulse》和《Splitgate Arena Reloaded》的开发，两款游戏将改用点对点托管和服务器浏览器，保留玩家继续游玩的入口。工作室同时表示，在专注服务型射击游戏十年后将改变方向，尚未明确下一阶段项目。", "body_html": "<p>1047 Games宣布结束《Empulse》和《Splitgate Arena Reloaded》的开发，两款游戏将改用点对点托管和服务器浏览器，保留玩家继续游玩的入口。工作室同时表示，在专注服务型射击游戏十年后将改变方向，尚未明确下一阶段项目。</p>", "meta": ["Empulse"], "sources": [["S0097", "Panic refunds tariff fees, 1047 Games pivots from Splitgate, and Gamescom Dev grows - Patch Notes #67", "https://www.gamedeveloper.com/business/panic-refunds-tariff-fees-1047-games-pivots-from-splitgate-and-gamescom-dev-grows-patch-notes-67"], ["S0079", "Limbic Entertainment on life after Bandai Namco", "https://www.gamesindustry.biz/limbic-entertainment-on-life-after-bandai-namco"]]}, {"section": "industry", "title": "CAA推出Frame1Games，为独立游戏提供资金与市场支持", "body": "CAA推出Frame1Games，计划为独立游戏提供资金、加速支持和营销服务，并通过精选市场展示入选作品。从2027年起，该计划还将支持团队参与行业活动，提供导师及合作伙伴资源。", "body_html": "<p>CAA推出Frame1Games，计划为独立游戏提供资金、加速支持和营销服务，并通过精选市场展示入选作品。从2027年起，该计划还将支持团队参与行业活动，提供导师及合作伙伴资源。</p>", "meta": [], "sources": [["S0097", "Panic refunds tariff fees, 1047 Games pivots from Splitgate, and Gamescom Dev grows - Patch Notes #67", "https://www.gamedeveloper.com/business/panic-refunds-tariff-fees-1047-games-pivots-from-splitgate-and-gamescom-dev-grows-patch-notes-67"]]}, {"section": "industry", "title": "Limbic《Corsair Cove》发售不足一个月售出20万份", "body": "Limbic Entertainment表示，海盗城市建造游戏《Corsair Cove》自7月31日发售后，不足一个月售出20万份，Steam仍有约70万愿望单。团队称产品在中国、日本和美国均获得玩家，发售质量与明确的海盗城建定位是其总结的主要原因。", "body_html": "<p>Limbic Entertainment表示，海盗城市建造游戏《Corsair Cove》自7月31日发售后，不足一个月售出20万份，Steam仍有约70万愿望单。团队称产品在中国、日本和美国均获得玩家，发售质量与明确的海盗城建定位是其总结的主要原因。</p>", "meta": ["Corsair Cove"], "sources": [["S0079", "Limbic Entertainment on life after Bandai Namco", "https://www.gamesindustry.biz/limbic-entertainment-on-life-after-bandai-namco"]]}, {"section": "industry", "title": "《Manor Lords》累计销量突破400万份", "body": "中世纪经营模拟游戏《Manor Lords》宣布，跨商店累计销量超过400万份。团队同时介绍后续更新中的酿酒、畜牧与河流地图内容，继续扩展聚落经营系统。", "body_html": "<p>中世纪经营模拟游戏《Manor Lords》宣布，跨商店累计销量超过400万份。团队同时介绍后续更新中的酿酒、畜牧与河流地图内容，继续扩展聚落经营系统。</p>", "meta": ["Manor Lords"], "sources": [["S0179", "Manor Lords celebrates 4 million copies sold with a new major update which gives players the chance to become 'a cow-herding mogul'", "https://www.pcgamer.com/games/city-builder/manor-lords-celebrates-4-million-copies-sold-with-a-new-major-update-which-gives-players-the-chance-to-become-a-cow-herding-mogul/"]]}, {"section": "industry", "title": "《Secret Neighbor》后台遭入侵，团队临时关闭游戏并尝试恢复进度", "body": "《Secret Neighbor》因攻击者获得后台管理权限并删除玩家档案、进度等数据而临时停服。开发商Hologryph与发行商tinyBuild表示，正与后端服务商PlayFab合作尝试恢复数据，并已向有关部门报案；恢复时间尚未确定。", "body_html": "<p>《Secret Neighbor》因攻击者获得后台管理权限并删除玩家档案、进度等数据而临时停服。开发商Hologryph与发行商tinyBuild表示，正与后端服务商PlayFab合作尝试恢复数据，并已向有关部门报案；恢复时间尚未确定。</p>", "meta": ["停服"], "sources": [["S0344", "Hello Neighbor's multiplayer spinoff has been 'temporarily shut down' after a hacker wiped player progression and demanded the game's 'removal from sale across all platforms'", "https://www.pcgamer.com/games/horror/hello-neighbors-multiplayer-spinoff-has-been-temporarily-shut-down-after-a-hacker-wiped-player-progression-and-demanded-the-games-removal-from-sale-across-all-platforms/"]]}, {"section": "industry", "title": "《PoE2》1.0定于12月上线并转免，国服安排晚一周", "body": "Grinding Gear Games公布，《Path of Exile 2》将于12月11日（太平洋时间）推出1.0正式版并转为免费游玩；腾讯发行的国服《流放之路：降临》定于12月18日同步完成1.0上线与转免。团队表示，正式版将补齐主线与终局内容，但不会一次交付原计划的全部12个职业。", "body_html": "<p>Grinding Gear Games公布，《Path of Exile 2》将于12月11日（太平洋时间）推出1.0正式版并转为免费游玩；腾讯发行的国服《流放之路：降临》定于12月18日同步完成1.0上线与转免。团队表示，正式版将补齐主线与终局内容，但不会一次交付原计划的全部12个职业。</p>", "meta": ["PoE2", "流放之路：降临", "腾讯"], "sources": [["S0384", "世界首富马斯克在线追更，腾讯这款天花板产品宣布全球转免", "https://m.sohu.com/a/1069738851_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.2.1788134503115mcXM9DF"]]}, {"section": "industry", "title": "杭州同趣称《猪了个猪》优化关卡与广告后，ROI由64%升至270%", "body": "杭州同趣披露，《猪了个猪》在多轮调整难度、失败反馈与广告触发方式后，人均游玩时长由约1800秒增至3000秒，人均广告观看次数由5次增至12次，ROI由64%升至270%。团队称买量侧变化较少，主要调整发生在产品内部，并让激励广告围绕提示、奖励与跳关供玩家主动选择。", "body_html": "<p>杭州同趣披露，《猪了个猪》在多轮调整难度、失败反馈与广告触发方式后，人均游玩时长由约1800秒增至3000秒，人均广告观看次数由5次增至12次，ROI由64%升至270%。团队称买量侧变化较少，主要调整发生在产品内部，并让激励广告围绕提示、奖励与跳关供玩家主动选择。</p>", "meta": ["猪了个猪", "买量"], "sources": [["S0336", "ROI从64%到270%，《猪了个猪》做对了什么", "https://www.sohu.com/a/1069272901_100136645"]]}, {"section": "industry", "title": "Discord的《Battlefield 6》任务支持账户绑定与游戏进度同步", "body": "Discord与《Battlefield 6》推出Play Quest+合作：玩家接受任务并绑定Discord和EA账户后，可通过完成游戏内目标解锁奖励，进度在游玩时自动同步至Discord。任务入口因此延伸到实际游玩行为，而非仅观看宣传内容。", "body_html": "<p>Discord与《Battlefield 6》推出Play Quest+合作：玩家接受任务并绑定Discord和EA账户后，可通过完成游戏内目标解锁奖励，进度在游玩时自动同步至Discord。任务入口因此延伸到实际游玩行为，而非仅观看宣传内容。</p>", "meta": [], "sources": [["S0378", "Hearth & Hamlet’s ~100k & the rise of the bite-sized clicker...", "https://newsletter.gamediscover.co/p/hearth-and-hamlets-100k-and-the-rise"]]}, {"section": "industry", "title": "《山河旅探》登陆主机平台", "body": "国产本格推理游戏《山河旅探》已登陆主机平台。", "body_html": "<p>国产本格推理游戏《山河旅探》已登陆主机平台。</p>", "meta": ["山河旅探"], "sources": [["S0009", "【抽奖】国产本格推理游戏《山河旅探》现已登陆主机平台", "https://www.gcores.com/articles/218885"]]}, {"section": "industry", "title": "增量放置游戏《米粒新世界》开放Demo", "body": "增量放置游戏《米粒新世界》已开放Demo，展示围绕一棵树生长的小社会。", "body_html": "<p>增量放置游戏《米粒新世界》已开放Demo，展示围绕一棵树生长的小社会。</p>", "meta": ["米粒新世界", "放置"], "sources": [["S0015", "增量放置游戏《米粒新世界》Demo现已开放", "https://www.gcores.com/articles/218871"]]}, {"section": "industry", "title": "《碧蓝幻想Versus -RISING》Switch 2版定于9月17日发售", "body": "《碧蓝幻想Versus -RISING》的Switch 2版定于9月17日发售。", "body_html": "<p>《碧蓝幻想Versus -RISING》的Switch 2版定于9月17日发售。</p>", "meta": [], "sources": [["S0018", "《碧蓝幻想Versus -RISING》NS2版将于9月17日发售", "https://www.gcores.com/articles/218859"]]}, {"section": "industry", "title": "怪物收集RPG《磁带妖怪2002》定档2027年3月", "body": "怪物收集RPG《磁带妖怪2002》计划于2027年3月登陆PS5、Xbox Series、Switch 2与PC。游戏支持单人和线上模式，玩家将前往2002年的伦敦，通过录制、战斗与融合应对超过250种怪物。", "body_html": "<p>怪物收集RPG《磁带妖怪2002》计划于2027年3月登陆PS5、Xbox Series、Switch 2与PC。游戏支持单人和线上模式，玩家将前往2002年的伦敦，通过录制、战斗与融合应对超过250种怪物。</p>", "meta": ["磁带妖怪2002"], "sources": [["S0160", "gamescom 2026", "https://www.ign.com.cn/cassette-beasts-2002/62384/ci-dai-yao-guai-2002-fa-shou-dang-qi-yu-gao-gamescom-2026"]]}, {"section": "ai", "title": "腾讯披露GIGA智能体已用于《和平精英》和《终极角逐》", "body": "腾讯在科隆展披露，GIGA通用游戏智能体已陆续用于《和平精英》《终极角逐》等项目。团队将大模型的战术规划与意图理解，同强化学习模型的实时执行结合，探索通过视觉感知和自然语言指令实现战场协作。相关披露属于具体产品应用与持续研发，并未宣称已经解决所有游戏的通用智能问题。", "body_html": "<p>腾讯在科隆展披露，GIGA通用游戏智能体已陆续用于《和平精英》《终极角逐》等项目。团队将大模型的战术规划与意图理解，同强化学习模型的实时执行结合，探索通过视觉感知和自然语言指令实现战场协作。相关披露属于具体产品应用与持续研发，并未宣称已经解决所有游戏的通用智能问题。</p>", "meta": ["和平精英", "终极角逐", "腾讯"], "sources": [["S0062", "腾讯游戏公共技术线首次整体亮相gamescom，以全链路自研AI技术加速游戏工业创新", "https://youxichaguan.com/archives/206331"], ["S0066", "谁在定义游戏行业的AI语言", "http://www.yystv.net/p/14336"]]}, {"section": "ai", "title": "游族推出内部AI创作工具，覆盖广告素材与自然语言游戏制作", "body": "游族网络披露，内部已推出AI广告素材创作平台，串联创意构思与视频生成；YOOSpark支持以自然语言对话进行游戏创作，YOOLab则提供图文与视频的可视化创作流程。公司同时推行面向员工的“Token无限额”保障机制，以降低工具使用门槛，尚未披露这些平台各自带来的量化经营收益。", "body_html": "<p>游族网络披露，内部已推出AI广告素材创作平台，串联创意构思与视频生成；YOOSpark支持以自然语言对话进行游戏创作，YOOLab则提供图文与视频的可视化创作流程。公司同时推行面向员工的“Token无限额”保障机制，以降低工具使用门槛，尚未披露这些平台各自带来的量化经营收益。</p>", "meta": [], "sources": [["S0051", "游族网络2026年上半年营收、净利润双增，积极布局AI产业生态", "https://youxichaguan.com/archives/206228"], ["S0386", "2026年上半年营收净利双增 ，游族网络正在布局AI全生态", "https://m.sohu.com/a/1069720513_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.4.1788134503115mcXM9DF"]]}, {"section": "ai", "title": "腾讯展示Vox游戏语音引擎，披露140毫秒首包延迟", "body": "腾讯展示面向游戏场景的原生TTS引擎Tencent Games Vox，可生成具有角色特征和情绪表现力的44kHz语音。团队披露其流式合成首包延迟低至140毫秒，生成10秒语音约需0.8秒，并将智能NPC、AI教练与实时解说列为适用方向；这些数据属于技术展示，未给出各项目的部署规模。", "body_html": "<p>腾讯展示面向游戏场景的原生TTS引擎Tencent Games Vox，可生成具有角色特征和情绪表现力的44kHz语音。团队披露其流式合成首包延迟低至140毫秒，生成10秒语音约需0.8秒，并将智能NPC、AI教练与实时解说列为适用方向；这些数据属于技术展示，未给出各项目的部署规模。</p>", "meta": ["腾讯"], "sources": [["S0062", "腾讯游戏公共技术线首次整体亮相gamescom，以全链路自研AI技术加速游戏工业创新", "https://youxichaguan.com/archives/206331"]]}, {"section": "release", "title": "王者万象棋", "body": "腾讯打造的策略自走棋多平台产品《王者万象棋》定于2026年9月10日在移动端与PC同步公测；支持QQ、微信同服游玩。", "body_html": "<p>腾讯打造的策略自走棋多平台产品《王者万象棋》定于2026年9月10日在移动端与PC同步公测；支持QQ、微信同服游玩。</p>", "meta": ["王者万象棋", "腾讯", "自走棋"], "sources": [["S0045", "全网7000万预约，《王者万象棋》官宣9月10日上线", "https://m.sohu.com/a/1069047296_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.3.1787961838808vyFhOSw"], ["S0047", "预约突破7000万：腾讯“王者新作”正式定档9月10日", "https://www.youxituoluo.com/534838.html"], ["S0049", "预约量达成7000万，这是下半年最值得期待的王者新游", "https://youxichaguan.com/archives/206207"], ["S0060", "农友就打农家牌！7000万预约，《王者万象棋》9月10日全平台上线！", "https://youxichaguan.com/archives/206307"], ["S0063", "7000万预约，《王者万象棋》9月10日全平台上线", "http://www.yystv.net/p/14338"], ["S0210", "农友就打农家牌！7000万预约，《王者万象棋》9月10日全平台上线！", "https://news.yxrb.net/mobile/index.php?m=mobile&c=index&a=show&catid=6&id=7510"], ["S0216", "7000万预约，《王者万象棋》刚刚公布：9月10日全平台上线！", "http://www.nadianshi.com/2026/08/419281"], ["S0302", "7000万用户预约，老外在科隆排队下棋", "https://cgames.com/contents/2/12712.html"]]}, {"section": "release", "title": "无限大", "body": "网易雷火工作室开发的都市开放世界RPG多平台产品《无限大》定于2027年1月15日全球公测，计划登陆PS5、Windows PC、iOS与Android；以多角色身份和都市探索串联动作冒险。", "body_html": "<p>网易雷火工作室开发的都市开放世界RPG多平台产品《无限大》定于2027年1月15日全球公测，计划登陆PS5、Windows PC、iOS与Android；以多角色身份和都市探索串联动作冒险。</p>", "meta": ["无限大", "网易", "联动"], "sources": [["S0039", "科隆试玩《无限大》，全球二游玩家相约“玩遍杭州上海”？", "http://www.gamelook.com.cn/2026/08/600993/"], ["S0050", "出击科隆展！网易五大自研矩阵亮相，向世界展现中国原创力量", "https://youxichaguan.com/archives/206220"], ["S0213", "投稿丨网易携五款自研产品亮相德国科隆展，规模达历届最高", "http://www.nadianshi.com/2026/08/419331"], ["S0099", "New game digest: PUBG Mobile Light, Aniimo, Petit Planet, Wobbly Life, Monster Hunter and more", "https://mobilegamer.biz/new-game-digest-pubg-mobile-light-aniimo-petit-planet-wobbly-life-monster-hunter-and-more/"]]}, {"section": "release", "title": "遗忘之海", "body": "网易开发的海洋开放世界RPG多平台产品《遗忘之海》公布大规模封闭测试定于2026年12月开启；玩法结合开放世界探索、海战与肉鸽回合制。", "body_html": "<p>网易开发的海洋开放世界RPG多平台产品《遗忘之海》公布大规模封闭测试定于2026年12月开启；玩法结合开放世界探索、海战与肉鸽回合制。</p>", "meta": ["遗忘之海", "网易"], "sources": [["S0050", "出击科隆展！网易五大自研矩阵亮相，向世界展现中国原创力量", "https://youxichaguan.com/archives/206220"], ["S0213", "投稿丨网易携五款自研产品亮相德国科隆展，规模达历届最高", "http://www.nadianshi.com/2026/08/419331"], ["S0099", "New game digest: PUBG Mobile Light, Aniimo, Petit Planet, Wobbly Life, Monster Hunter and more", "https://mobilegamer.biz/new-game-digest-pubg-mobile-light-aniimo-petit-planet-wobbly-life-monster-hunter-and-more/"]]}, {"section": "release", "title": "凡应", "body": "艺画开天开发的幻想ARPG产品《凡应》于8月28日开启EP02第二轮测试，现有公布信息未区分端游或手游；融合箱庭探索、四人小队战斗与家园养成。", "body_html": "<p>艺画开天开发的幻想ARPG产品《凡应》于8月28日开启EP02第二轮测试，现有公布信息未区分端游或手游；融合箱庭探索、四人小队战斗与家园养成。</p>", "meta": ["凡应"], "sources": [["S0057", "顶级互动式电影体验！艺画开天跨界新游《凡应》今日开启第二轮测试", "https://youxichaguan.com/archives/206271"], ["S0307", "游戏行业吹了多年的电影级体验，被一款测试期新游摘桃了？", "https://m.sohu.com/a/1069293409_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.1.1788048185928M8gM244"]]}, {"section": "discourse", "title": "《明日方舟》P3联动赠抽引发争论，玩家质疑补偿与分日登录绑定", "body": "《明日方舟》P3联动赠抽安排在8月29日预告公开后引起讨论：部分玩家将额外赠抽理解为活动开始后逐日领取，认为补偿应让玩家在卡池开启时即可使用，不应继续绑定登录节奏。8月30日，回复中出现不同解释，称额外十连会在第十天以十连券发放，不能与日常单抽混为一谈；也有玩家认为直播已写明活动期间发放，对时间安排并不意外。争议由“到底怎样发”进一步转向“补偿是否应承担维持日活和促销的功能”。", "body_html": "<p>《明日方舟》P3联动赠抽安排在8月29日预告公开后引起讨论：部分玩家将额外赠抽理解为活动开始后逐日领取，认为补偿应让玩家在卡池开启时即可使用，不应继续绑定登录节奏。8月30日，回复中出现不同解释，称额外十连会在第十天以十连券发放，不能与日常单抽混为一谈；也有玩家认为直播已写明活动期间发放，对时间安排并不意外。争议由“到底怎样发”进一步转向“补偿是否应承担维持日活和促销的功能”。</p>", "meta": ["明日方舟", "联动"], "sources": [["S0369", "[明日方舟] [新瓜] 尘埃落地！申请竞选二游史上最离谱补偿方式", "https://bbs.nga.cn/read.php?tid=47462401&forder_by=postdatedesc"], ["S0505", "[明日方舟] [新瓜] 尘埃落地！申请竞选二游史上最离谱补偿方式", "https://bbs.nga.cn/read.php?tid=47462401&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《鸣潮》周边争议进入补偿阶段，玩家分歧转向补货登记与补偿内容", "body": "《鸣潮》角色礼盒的材质、尺寸争议延续到补偿安排：8月30日，玩家称补货登记需要确认接受处理方案，玩家不满的核心在于，色纸补偿能否回应立牌本身的瑕疵。另有购买者表示已登记；对补偿是否为角色单人图的猜测，则遭到其他玩家反驳，认为不能在实物尚未到手时就断言没有补偿。讨论因此从商品是否有问题，转向修正原商品、额外赠品与消费者确认之间的关系。", "body_html": "<p>《鸣潮》角色礼盒的材质、尺寸争议延续到补偿安排：8月30日，玩家称补货登记需要确认接受处理方案，玩家不满的核心在于，色纸补偿能否回应立牌本身的瑕疵。另有购买者表示已登记；对补偿是否为角色单人图的猜测，则遭到其他玩家反驳，认为不能在实物尚未到手时就断言没有补偿。讨论因此从商品是否有问题，转向修正原商品、额外赠品与消费者确认之间的关系。</p>", "meta": ["鸣潮"], "sources": [["S0270", "[周边] [鸣潮] 8.25更新爱弥斯也有问题 / 陆赫斯角色礼盒亚克力色纸 亚克力含量为0(已滑跪)", "https://bbs.nga.cn/read.php?tid=47400825"], ["S0272", "[周边] 库洛偷工减料后，选择的方式是——紧急修改商品信息", "https://bbs.nga.cn/read.php?tid=47443085&_fp=2&forder_by=postdatedesc"], ["S0362", "[周边] [鸣潮] 8.25更新爱弥斯也有问题 / 陆赫斯角色礼盒亚克力色纸 亚克力含量为0(已滑跪)", "https://bbs.nga.cn/read.php?tid=47400825"], ["S0501", "[周边] [鸣潮] 8.25更新爱弥斯也有问题 / 陆赫斯角色礼盒亚克力色纸 亚克力含量为0(已滑跪)", "https://bbs.nga.cn/read.php?tid=47400825"], ["S0502", "[周边] 库洛偷工减料后，选择的方式是——紧急修改商品信息", "https://bbs.nga.cn/read.php?tid=47443085&_fp=2&forder_by=postdatedesc"], ["S0513", "[周边]库洛周边出问题给了补偿方案 但是 真给了吗？", "https://bbs.nga.cn/read.php?tid=47469420&forder_by=postdatedesc"], ["S0516", "[周边]库洛游戏周边出问题后最终的选择方式", "https://bbs.nga.cn/read.php?tid=47468582&forder_by=postdatedesc"]]}, {"section": "deep", "title": "短流程增量游戏卖的是持续成长，城建外观却可能带来错误预期", "body": "观察：GameDiscoverCo对《Hearth & Hamlet》的分析显示，一类低价、流程有限的增量游戏正在用高密度成长反馈吸引玩家。该作售价8美元，完整体验约8至12小时，早期中位游玩时长达到7小时20分钟；但其城市布局预先设定，并非自由建造。问题因此不只是玩家愿不愿意购买短游戏，也在于商店外观会让玩家预期怎样的玩法。 分析：这类产品把复杂品类压缩为易理解、持续获得资源与升级的循环。玩家可以主动推进成长，同时避免长篇教程和过高学习负担；有限流程又让一次购买对应较清晰的完成目标。对时间和精力有限的用户而言，吸引力可能来自“低负担地持续变强”，而不是无限挂机或无限内容。该解释来自作者对品类的归纳，不代表所有增量游戏都会获得相同留存。 成立前提是展示与实际交互一致。《Hearth & Hamlet》的城建外观吸引了部分期待自由规划的玩家，而开发者明确表示布局是预设的，体验更接近拼装既定微缩景观。发行方认为，一部分负面评价正来自想要更强城建体验的非放置玩家。这意味着，降低学习门槛可以扩大点击与购买，却也可能扩大错误受众；当视觉承诺超过机制提供的选择空间时，转化优势会变成口碑压力。", "body_html": "<p>观察：GameDiscoverCo对《Hearth &amp; Hamlet》的分析显示，一类低价、流程有限的增量游戏正在用高密度成长反馈吸引玩家。该作售价8美元，完整体验约8至12小时，早期中位游玩时长达到7小时20分钟；但其城市布局预先设定，并非自由建造。问题因此不只是玩家愿不愿意购买短游戏，也在于商店外观会让玩家预期怎样的玩法。</p><p>分析：这类产品把复杂品类压缩为易理解、持续获得资源与升级的循环。玩家可以主动推进成长，同时避免长篇教程和过高学习负担；有限流程又让一次购买对应较清晰的完成目标。对时间和精力有限的用户而言，吸引力可能来自“低负担地持续变强”，而不是无限挂机或无限内容。该解释来自作者对品类的归纳，不代表所有增量游戏都会获得相同留存。</p><p>成立前提是展示与实际交互一致。《Hearth &amp; Hamlet》的城建外观吸引了部分期待自由规划的玩家，而开发者明确表示布局是预设的，体验更接近拼装既定微缩景观。发行方认为，一部分负面评价正来自想要更强城建体验的非放置玩家。这意味着，降低学习门槛可以扩大点击与购买，却也可能扩大错误受众；当视觉承诺超过机制提供的选择空间时，转化优势会变成口碑压力。</p>", "meta": ["放置"], "sources": [["S0378", "Hearth & Hamlet’s ~100k & the rise of the bite-sized clicker...", "https://newsletter.gamediscover.co/p/hearth-and-hamlets-100k-and-the-rise"]]}];
    const sectionLabels = Object.fromEntries(sections.map(s => [s.id, s.label]));
    const sectionDescs = Object.fromEntries(sections.map(s => [s.id, s.desc]));
    const orderedSectionIds = sections.filter(s => s.id !== "all").map(s => s.id);
    let currentSection = "all";
    let compact = false;
    const nav = document.getElementById("nav");
    const content = document.getElementById("content");
    const sectionHead = document.getElementById("sectionHead");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    function matches(item, query) {
      if (!query) return true;
      const text = [item.title,item.body,item.meta.join(" "),item.sources.map(s => s.join(" ")).join(" ")].join(" ").toLowerCase();
      return text.includes(query.toLowerCase());
    }
    function isBorderline(m) {
      return /borderline/i.test(m);
    }
    function renderNav() {
      nav.innerHTML = "";
      sections.forEach(section => {
        const count = section.id === "all" ? items.length : items.filter(item => item.section === section.id).length;
        const button = document.createElement("button");
        button.dataset.section = section.id;
        if (section.id === currentSection) button.classList.add("active");
        button.innerHTML = `<span>${section.label}</span><span class="count">${count}</span>`;
        button.addEventListener("click", () => { currentSection = section.id; render(); });
        nav.appendChild(button);
      });
    }
    function renderItem(item) {
      const node = document.createElement("article");
      node.className = "item";
      node.dataset.section = item.section;
      const metaTags = item.meta.map(m => {
        const cls = isBorderline(m) ? "borderline" : "";
        return `<span class="${cls}">${m}</span>`;
      }).join("");
      const bodyMarkup = item.body_html || `<p>${item.body}</p>`;
      node.innerHTML = `<div class="item-top"><span class="tag">${sectionLabels[item.section]}</span></div><h3>${item.title}</h3>${bodyMarkup}<div class="meta-row">${metaTags}</div><button class="source-btn" type="button">查看来源 →</button>`;
      node.querySelector(".source-btn").addEventListener("click", () => openDrawer(item));
      return node;
    }
    function buildGrid(itemList) {
      const grid = document.createElement("section");
      grid.className = compact ? "grid compact" : "grid";
      itemList.forEach(item => grid.appendChild(renderItem(item)));
      return grid;
    }
    function buildSectionBlock(sectionId, itemList) {
      const block = document.createElement("div");
      block.className = "section-block";
      const banner = document.createElement("div");
      banner.className = "section-banner";
      banner.dataset.section = sectionId;
      banner.innerHTML = `<h2>${sectionLabels[sectionId]}</h2><span class="banner-count">${itemList.length} 条</span><span class="banner-desc">${sectionDescs[sectionId]}</span>`;
      block.appendChild(banner);
      block.appendChild(buildGrid(itemList));
      return block;
    }
    function render() {
      renderNav();
      const query = search.value.trim();
      const filtered = items.filter(item => (currentSection === "all" || item.section === currentSection) && matches(item, query));
      content.innerHTML = "";
      if (currentSection === "all") {
        sectionHead.style.display = "none";
        orderedSectionIds.forEach(sid => {
          const sectionItems = filtered.filter(it => it.section === sid);
          if (sectionItems.length > 0) content.appendChild(buildSectionBlock(sid, sectionItems));
        });
      } else {
        sectionHead.style.display = "flex";
        sectionHead.dataset.section = currentSection;
        document.getElementById("sectionTitle").textContent = sectionLabels[currentSection];
        document.getElementById("sectionDesc").textContent = sectionDescs[currentSection];
        content.appendChild(buildGrid(filtered));
      }
      empty.classList.toggle("visible", filtered.length === 0);
    }
    function openDrawer(item) {
      document.getElementById("drawerTitle").textContent = item.title;
      document.getElementById("drawerNote").textContent = item.body;
      document.getElementById("sourceList").innerHTML = item.sources.map(([id,name,url]) => {
        const safeUrl = String(url || "");
        const isHttp = /^https?:\/\//i.test(safeUrl);
        const linkAttrs = isHttp ? `href="${safeUrl}" target="_blank" rel="noopener noreferrer"` : "";
        const urlEl = isHttp
          ? `<a class="source-url" ${linkAttrs}>${safeUrl} ↗</a>`
          : `<span class="source-url">${safeUrl}</span>`;
        return `<div class="source-card"><strong>${id} · ${name}</strong>${urlEl}</div>`;
      }).join("");
      drawer.classList.add("open"); overlay.classList.add("open");
    }
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
    search.addEventListener("input", render);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    // Sidebar collapse — state persists in localStorage
    const app = document.getElementById("app");
    const SIDEBAR_KEY = "report-sidebar-collapsed";
    try { if (localStorage.getItem(SIDEBAR_KEY) === "1") app.classList.add("collapsed"); } catch (e) {}
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      app.classList.toggle("collapsed");
      try { localStorage.setItem(SIDEBAR_KEY, app.classList.contains("collapsed") ? "1" : "0"); } catch (e) {}
    });
    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("viewGrid").addEventListener("click", () => { compact = false; document.getElementById("viewGrid").classList.add("active"); document.getElementById("viewList").classList.remove("active"); render(); });
    document.getElementById("viewList").addEventListener("click", () => { compact = true; document.getElementById("viewList").classList.add("active"); document.getElementById("viewGrid").classList.remove("active"); render(); });
    render();
  </script>
</body>
</html>
