prompt = "每个工作日 09:40 对 09:00 的“游戏行业日报/周报生成”任务执行一次幂等兜底检查与重试。工作目录为 C:\\Users\\Admin\\Documents\\AI游戏行业周月报。严格读取并遵守 C:\\Users\\Admin\\.codex\\skills\\game-industry-report\\SKILL.md；所有 Python 命令设置 PYTHONUTF8=1。\n\n最高优先级飞书回执恢复（仅周五，且必须先于“产物完整则结束”的幂等判断执行）：\n1. 运行 python scripts/feishu_deep_review.py status --weekly-id <ID> --json。\n2. 若目标 ID 有 reply，而 selection 缺失或飞书交接 lint 失败，读取 data/feishu/deep_review/replies/<receipt_id>.json 的 raw_reply 与 output/deep_observation_review/<ID>_candidates.md，按 body_candidate_ids、card_base_candidate_id、card_reference_candidate_ids 重建 selection。\n3. selection 必须写齐“选择来源: 飞书周四备选 Bot”“飞书回执ID”“正文候选ID”“指定卡片候选ID”；有融合时再写“卡片整合参考ID”。正文顺序严格等于 body_candidate_ids；主卡必须进入正文；参考 ID 只融入主卡，不独立进入正文，除非也在 body_candidate_ids。\n4. 运行 python scripts/deep_observation_handoff.py lint-selection --selection <path> 至 0 error，再进入原有报告幂等检查与恢复流程。即使 09:00 已生成一份无深度栏且两道报告校验通过，只要随后收到目标 ID 的有效回执，也不得直接判定“原任务已完成”；必须把 selection 与第五栏补齐后重新校验。\n5. 若无目标 ID 的有效回执且 selection 不存在，允许省略深度栏继续周报，不自动代选；若已有有效回执但 selection 整理或 lint 仍失败，必须明确失败并保留回执，不得降级成“无选择”。\n\n先按 Asia/Shanghai 当前日期独立计算当天目标：周二/周三/周四为昨天的日报；周五为今天前 7 天至前 1 天的周报；周一为前 3 天至前 1 天的周末报；周末误触发直接结束。\n\n这是容量失败后的幂等兜底任务，不得无条件重做：\n1. 定位当天目标目录、最终 Markdown、sources_used.md，以及 _intermediate/report_inputs.jsonl、report_items.json、selection_decisions.json、release_calendar_audit.json、industry_history_14d.json。\n2. 如果这些文件全部存在，运行 C:\\Users\\Admin\\.codex\\skills\\game-industry-report\\scripts\\report_lint.py 和 report_artifacts.py validate --require-artifacts 两道校验；两道均为 0 error 时，记录“原任务已完成，无需重试”并立即结束，不修改任何报告文件。\n3. 如果文件缺失、存在半成品，或任一道校验失败，则从现有可用审计产物继续完成当天报告；不得依赖旧对话记忆补写事实。缺失输入时重新运行 extract_report_inputs.py；缺失双周历史时运行 python scripts/build_industry_history.py --workspace . --target-start <本期窗口开始日> --output <本期目录>/_intermediate/industry_history_14d.json。\n4. 恢复生成时完整执行09:00原任务的双周行业新闻与卡片曝光双层去重：读取历史事件及 card_exposed/card_rank/card_limit/card_exposure_source。每个行业候选记录 history_check 的 history_match、novelty、prior_occurrences、new_facts、prior_card_exposed；无历史匹配时 prior_card_exposed=null。有历史任一匹配项 card_exposed=true 时，换来源、转载、补背景或状态不变均为 repeat_only 并排除；只有来源正文直接证明的实质状态变化才可 material_update 再次入选。\n5. 若同一事件所有历史匹配项均 card_exposed=false、本期再次召回且达到分数线，可按当前总分、R、正文顺序选择至多1条 card_carryover。入选项必须 novelty=card_carryover、prior_card_exposed=false、顶层 card_carryover=true；selection_decisions.md 写“卡片曝光去重”。补位不降低分数线，也不得伪装成新状态。card_carryover 只写内部审计；最终 Markdown、网页、飞书卡片和飞书文档不得显示“补位”“上期卡片未展示”、card_carryover 或任何区别性标记，标题、正文与样式须和普通新闻完全一致。周报仍可对本周日报事件合并一次，但不得拆分重复。\n6. 周报必须按目标 weekly ID 查找并消费精确的 deep observation selection；周末报不消费 weekly selection。遵守原生成任务的所有分区、证据、禁词、产品日历和来源映射规则。\n7. 只生成或修复报告 Markdown、sources_used.md 与所需 _intermediate 审计产物；不推送飞书、不生成网页、不执行 git add/commit/push。\n8. 最终摘要说明：目标报告类型与 ID、是无需重试还是执行恢复、双周历史窗口、repeat_only 排除、material_update 入选、card_carryover 补位及此前卡片排名、从哪一步续跑、两道校验结果及 warning。"
