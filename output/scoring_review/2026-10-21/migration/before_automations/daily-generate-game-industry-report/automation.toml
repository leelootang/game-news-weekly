version = 1
id = "daily-generate-game-industry-report"
kind = "cron"
name = "游戏行业日报/周报生成"
prompt = "每个工作日 09:00 生成游戏行业报告终稿。工作目录 C:\\Users\\Admin\\Documents\\AI游戏行业周月报。严格读取并遵循 C:\\Users\\Admin\\.codex\\skills\\game-industry-report\\SKILL.md；生成完整报告时按其“必读路由”读取五个 references。只产出报告 Markdown、sources_used.md 和中间产物；不碰飞书、docs，不 git add/commit/push。所有 Python 命令设置 PYTHONUTF8=1。\n\n最高优先级：忽略历史上下文中的旧日期、旧报告和半成品，先按系统当前日期与 Asia/Shanghai 判定星期并声明锚点：“今天是<星期X>，应生成<报告类型>，窗口<start>_to_<end>（或 date=<date>）”。所有路径和参数只按该锚点。周末误触发直接结束。\n- 周二/三/四：日报，date=昨天；output/daily/<date>/game_industry_daily_<date>.md。\n- 周五：周报，start=今天-7天，end=今天-1天；output/weekly/<ID>/game_industry_weekly_<ID>.md。\n- 周一：周末报，start=今天-3天，end=今天-1天；output/weekend/<ID>/game_industry_weekend_<ID>.md；采用日报式逐条判断，Steam 用当日榜口径。\n\n最高优先级飞书回执交接（仅周五）：在抽取输入前运行 python scripts/feishu_deep_review.py status --weekly-id <ID> --json。若返回目标 ID 的 reply 且精确 selection 尚不存在，必须读取 data/feishu/deep_review/replies/<receipt_id>.json 的 raw_reply 与 output/deep_observation_review/<ID>_candidates.md，按用户原话先整理 selection：正文顺序严格等于 body_candidate_ids；card_base_candidate_id 是唯一★卡片且必须在正文；card_reference_candidate_ids 只用于把相应候选的已取证信息融入主卡，不独立进入正文，除非也在 body_candidate_ids。selection 头部必须写“选择来源: 飞书周四备选 Bot”“飞书回执ID”“正文候选ID”“指定卡片候选ID”，有融合时再写“卡片整合参考ID”。写完运行 python scripts/deep_observation_handoff.py lint-selection --selection <path>，0 error 才能继续。若没有目标 ID 的有效回执且 selection 不存在，不自动代选，允许省略第五栏继续生成，不能因此卡住整份周报；若已有有效回执但整理或 lint 失败，必须停止并保留回执供 09:40 兜底重试，不得静默忽略用户选择。\n\n步骤：\n1. git pull --ff-only，仅同步采集器提交的 news_data；news_data 只读。\n2. 运行 extract_report_inputs.py：日报 --report-type daily --date <date>；周末报 --report-type custom --start <start> --end <end> --output output/weekend/<ID>/_intermediate/report_inputs.jsonl。周报先定位 output/deep_observation_review/<ID>_selection.md：若存在，运行 --report-type weekly --start <start> --end <end> --deep-selection <该selection>；若不存在才不传 --deep-selection。该参数会把候选窗口中早一天但被人工选中的来源补入 deep-only 输入，禁止手工跳过。\n3. 在写行业新闻候选前，运行 python scripts/build_industry_history.py --workspace . --target-start <本期窗口开始日> --output <本期目录>/_intermediate/industry_history_14d.json；同时阅读生成的 JSON 与同名 Markdown。它覆盖本期开始日前14个自然日内已发布的日报、周末报和周报行业条目，旧式无结构化产物的报告也必须纳入。除标题、事件和事实外，必须读取每条历史项的 card_exposed、card_rank、card_limit、card_exposure_source；进入过完整报告不等于进入过订阅卡片。\n4. 阅读 summary、完整 index、全量 report_inputs.jsonl 和 industry_history_14d，生成 event_candidates.md、selection_decisions.md、report_items.json、selection_decisions.json。行业新闻多源仅在同一主体/产品、同一日期、同一事件时聚类。\n5. 每个行业候选都必须在 selection_decisions.json 记录 history_check：history_match（true/false）、novelty（new_event/repeat_only/material_update/card_carryover）、prior_occurrences（匹配的历史标题与报告窗口，未匹配为空数组）、new_facts（相对历史新增且由本期 source text 直接支持的事实，若无则为空数组）、prior_card_exposed（无历史匹配为 null，有匹配时为是否曾进入订阅卡片的布尔值）。同一事件换来源、晚到转载、补充旧背景、重新概括或仅增加媒体数量，若历史任一匹配项 card_exposed=true，一律 novelty=repeat_only 并 exclude；只有可验证的实质状态变化才可 material_update 再次入选。无法确定是否同一事件时保留候选并写明。\n6. 卡片曝光补位：若同一事件的所有历史匹配项均 card_exposed=false，本期来源再次召回且仍达到当前报告 E×R+M 分数线，可竞争一次 card_carryover；每份报告最多 include 1 条，按当前总分、R、正文顺序选择最高者。入选项必须 history_check.novelty=card_carryover、history_check.prior_card_exposed=false、顶层 card_carryover=true；new_facts 可为空，但正文不得伪装成新状态。card_carryover 只写入内部审计产物；最终 Markdown、网页、飞书卡片和飞书文档的标题、正文与样式必须和普通新闻一致，禁止出现“补位”“上期卡片未展示”、card_carryover 或任何同义标记。其余未曝光重复项仍 exclude。selection_decisions.md 顶部必须写“卡片曝光去重”自检。\n7. 周报的跨期去重也执行上述规则；但允许汇总本周窗口内尚未进入任何已发布周报的日报事件。若历史记录来自本周日报，周报可合并一次，prior_occurrences 必须列明；周报正文只保留一个合并条目，不得把同一事实拆成多条。日报与周末报不得因“周报尚未汇总”而重复旧闻，但允许符合第6步的唯一 card_carryover。\n8. 行业新闻按 E×R+M：日报、周末报（以及月报若运行）总分>=7才 include；周报总分>=8才 include。评分是必要条件，不因卡片补位而降分。只按分数线筛选并按总分降序，不设硬性条数上限。R判断国内主体、中国手游市场、优先赛道或全球竞争格局迁移点；其中普通海外PC／主机单机只有发售消息时默认R=1，不能仅因RPG、魂类或模拟经营等品类直接取R3。国内/重点主体或实质移动/全球竞争格局迁移点可按原规则例外，但必须有来源原文依据，不对所有PC产品一刀切降权。行业PC／主机发售候选按skill填写pc_release_scope分类、理由和逐字取证。\n9. 产品日历按 release-calendar.md：召回新品测试/上线、新品预下载/首次正式首曝/定档、老品跨平台上线/重启回归/重大更新；同产品+同日期聚类；必须多源才可 include；日报/周末报最多4条，周报最多7条，月报最多12条，include 必须是多源候选优先级前缀。行业新闻与产品日历不做跨栏去重：同一产品/事件可分别通过两栏门槛，不得因已入选行业新闻而排除日历，也不得因行业评分低而降低日历资格。日历内部同产品同日期聚类、独立来源去重与跨期重复检查仍保留，多源、日期证据、时间窗口、排序和上限不变。\n10. 社区按 community-discourse.md，不写免责尾注，不把玩家推测写成官方事实。\n11. 深度观察按 deep-observation.md。周五只消费 output/deep_observation_review/<周报ID>_selection.md；精确 selection 存在时，把用户选择全部写入第五栏、去掉★前缀、把唯一指定卡片标题写入 deep_card_choice.txt，并在 decision JSON 标 card_designated=true。若精确 selection 不存在，检查候选窗口旧错名文件；存在则停止，不能静默省略。\n12. 写终稿；正文禁止出现沐瞳/Moonton/MLBB/决胜巅峰；新闻用“### N. 标题”，产品日历用单产品 bullet，行业与AI、行业与社区同事件不重复，但行业新闻与产品日历允许同产品/事件分别入选，来源未写主体不得凭记忆补。\n13. 用 report_artifacts.py generate-sources 自动生成 sources_used.md；排除项只留 selection_decisions.md/json。\n14. 所有新报告完成两道零错误校验：C:\\Users\\Admin\\.codex\\skills\\game-industry-report\\scripts\\report_lint.py 显式传 --report、--sources、--inputs；以及 report_artifacts.py validate --require-artifacts。任何 error 必须修到零；失败时不得留下会被10:30任务误判为完成的新终稿。\n15. 摘要报告类型、ID、终稿路径、各分区条数、双周历史窗口、repeat_only 排除、material_update及新增事实、card_carryover 补位及此前卡片排名、深度交接、两道校验结果和 warning。"
status = "ACTIVE"
