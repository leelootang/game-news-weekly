<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏行业日报 | 2026-10-28</title>
  <style>
    :root {
      --ink:#1a2436; --ink-soft:#3a4862; --muted:#6b7993; --faint:#9aa6bd;
      --accent:#5b6ef5;
      --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78);
      --glass-border:rgba(255,255,255,.7); --line:rgba(31,45,75,.10); --line-strong:rgba(31,45,75,.16);
      --shadow-sm:0 3px 12px rgba(31,45,75,.05);
      --shadow:0 6px 28px rgba(31,45,75,.07);
      --shadow-lg:0 14px 40px rgba(31,45,75,.12);
      --industry:#4f7cff; --industry-soft:rgba(79,124,255,.12); --industry-ink:#2b53c4;
      --ai:#00b3d4; --ai-soft:rgba(0,179,212,.12); --ai-ink:#06748a;
      --release:#16b884; --release-soft:rgba(22,184,132,.13); --release-ink:#0b7a57;
      --discourse:#f0a02a; --discourse-soft:rgba(240,160,42,.15); --discourse-ink:#9a6206;
      --deep:#8b6df0; --deep-soft:rgba(139,109,240,.13); --deep-ink:#5a3fc0;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif; line-height:1.65; -webkit-font-smoothing:antialiased; }
    /* decorative gradient field behind the frosted glass */
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(circle at 12% 18%, rgba(91,110,245,.20), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(0,179,212,.16), transparent 40%),
        radial-gradient(circle at 78% 88%, rgba(139,109,240,.18), transparent 46%),
        radial-gradient(circle at 25% 92%, rgba(22,184,132,.13), transparent 44%),
        linear-gradient(135deg,#eef1fb 0%,#f3effb 48%,#eaf3fc 100%); }
    a { color:inherit; text-decoration:none; }
    button,input { font:inherit; }
    ::selection { background:rgba(91,110,245,.22); }
    .app { min-height:100vh; display:grid; grid-template-columns:264px minmax(0,1fr); transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
    .app.collapsed { grid-template-columns:0 minmax(0,1fr); }

    /* Sidebar — frosted glass */
    aside.sidebar { position:sticky; top:0; height:100vh; padding:24px 18px; color:var(--ink); display:flex; flex-direction:column;
      background:rgba(255,255,255,.48); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
      border-right:1px solid rgba(255,255,255,.55); overflow-y:auto; overflow-x:hidden; transition:transform .25s cubic-bezier(.4,0,.2,1), opacity .2s; }
    .app.collapsed aside.sidebar { transform:translateX(-100%); opacity:0; pointer-events:none; }

    /* Sidebar toggle button (in topbar, always visible) */
    .sidebar-toggle { width:40px; height:40px; border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; border-radius:12px; display:grid; place-items:center; font-size:16px; line-height:1; transition:all .14s; }
    .sidebar-toggle:hover { color:var(--accent); border-color:var(--accent); }
    .sidebar-toggle .icon-open { display:inline; }
    .sidebar-toggle .icon-close { display:none; }
    .app.collapsed .sidebar-toggle .icon-open { display:none; }
    .app.collapsed .sidebar-toggle .icon-close { display:inline; }
    .back-home { width:max-content; display:inline-flex; align-items:center; gap:7px; margin:0 2px 18px; padding:7px 10px; border-radius:9px; color:var(--ink-soft); text-decoration:none; font-size:13px; font-weight:600; transition:background .14s,color .14s,transform .14s; }
    .back-home:hover { background:rgba(255,255,255,.62); color:var(--accent); transform:translateX(-2px); }
    .back-home:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 2px 20px; border-bottom:1px solid var(--line); }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:11px; background:#fff; padding:7px; box-shadow:0 3px 10px rgba(31,45,75,.10); }
    .brand-mark img { width:100%; height:100%; display:block; object-fit:contain; }
    .brand strong { display:block; font-size:15px; line-height:1.1; letter-spacing:.2px; color:var(--ink); }
    .brand span { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
    .nav-title { margin:22px 0 10px; color:var(--faint); font-size:10px; letter-spacing:1.3px; text-transform:uppercase; font-weight:700; }
    .nav { display:grid; gap:3px; }
    .nav button { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; border:0; background:transparent; color:var(--ink-soft); padding:11px 14px; text-align:left; cursor:pointer; border-radius:11px; position:relative; font-size:14px; font-weight:500; transition:all .14s; }
    .nav button:hover { background:rgba(255,255,255,.55); color:var(--ink); }
    .nav button.active { background:rgba(91,110,245,.12); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px rgba(91,110,245,.18); }
    .nav button.active::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--accent2,var(--accent)); }
    .nav button[data-section="industry"] { --accent2:var(--industry); }
    .nav button[data-section="ai"] { --accent2:var(--ai); }
    .nav button[data-section="release"] { --accent2:var(--release); }
    .nav button[data-section="discourse"] { --accent2:var(--discourse); }
    .nav button[data-section="deep"] { --accent2:var(--deep); }
    .count { min-width:24px; padding:1px 9px; color:var(--muted); background:rgba(31,45,75,.07); text-align:center; border-radius:11px; font-size:12px; font-weight:600; }
    .nav button.active .count { background:var(--accent2,var(--accent)); color:#fff; }
    .sidebar-footer { margin:auto -18px -24px; padding:16px 22px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.65; }
    .sidebar-footer .made { color:var(--ink-soft); font-weight:600; }
    .sidebar-footer a { color:var(--accent); }
    .sidebar-footer .stat { margin-top:8px; color:var(--faint); }

    /* Main */
    main { padding:30px 40px 64px; min-width:0; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; line-height:1.25; letter-spacing:-.2px; font-weight:800; color:var(--ink); }
    .subtitle { margin-top:8px; color:var(--muted); font-size:13.5px; }
    .actions { display:flex; gap:10px; align-items:center; }
    .search { width:320px; display:flex; align-items:center; gap:8px; background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); padding:9px 14px; border-radius:12px; transition:border-color .15s, box-shadow .15s; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,110,245,.12); background:#fff; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:13.5px; }
    .search input::placeholder { color:var(--faint); }
    .icon-btn { border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-soft); cursor:pointer; width:40px; height:40px; border-radius:12px; transition:all .14s; }
    .icon-btn:hover { color:var(--accent); border-color:var(--accent); }

    /* Metrics */
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:30px; }
    .metric { background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); padding:18px 20px; border-radius:18px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden; }
    .metric::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent2,var(--industry)); }
    .metric:nth-child(1) { --accent2:var(--industry); }
    .metric:nth-child(2) { --accent2:var(--release); }
    .metric:nth-child(3) { --accent2:var(--discourse); }
    .metric:nth-child(4) { --accent2:var(--deep); }
    .metric span { color:var(--muted); font-size:12.5px; letter-spacing:.3px; }
    .metric strong { display:block; font-size:26px; line-height:1.1; margin-top:6px; font-weight:800; color:var(--ink); }

    /* Section-head (单 section 视图) */
    .section-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin:6px 0 20px; padding:16px 20px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); border-left:4px solid var(--accent2,var(--industry)); border-radius:18px; box-shadow:var(--shadow-sm); }
    .section-head[data-section="industry"] { --accent2:var(--industry); }
    .section-head[data-section="ai"] { --accent2:var(--ai); }
    .section-head[data-section="release"] { --accent2:var(--release); }
    .section-head[data-section="discourse"] { --accent2:var(--discourse); }
    .section-head[data-section="deep"] { --accent2:var(--deep); }
    h2 { margin:0; font-size:20px; font-weight:700; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .toggle { display:flex; border:1px solid var(--glass-border); background:var(--glass); border-radius:11px; overflow:hidden; }
    .toggle button { padding:8px 15px; border:0; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13px; transition:all .14s; }
    .toggle button.active { background:var(--accent); color:#fff; font-weight:600; }

    /* "全部" 视图下的 section 分块 */
    .section-block { margin-top:38px; min-width:0; }
    .section-block:first-child { margin-top:0; }
    .section-banner { display:flex; align-items:baseline; gap:14px; padding:13px 18px; margin-bottom:16px; background:var(--accent-soft,var(--industry-soft)); border-left:4px solid var(--accent2,var(--industry)); border-radius:14px; }
    .section-banner[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .section-banner[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .section-banner[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .section-banner[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .section-banner[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .section-banner h2 { color:var(--accent-ink); font-size:17px; margin:0; font-weight:700; }
    .section-banner .banner-count { color:var(--accent2); font-weight:700; font-size:13px; }
    .section-banner .banner-desc { color:var(--accent-ink); opacity:.7; font-size:13px; margin-left:auto; }

    /* Cards — glass */
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; min-width:0; }
    .grid.compact { grid-template-columns:1fr; }
    .item { min-width:0; background:var(--glass); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%); border:1px solid var(--glass-border); border-left:3px solid var(--accent2,var(--industry)); padding:20px 24px; border-radius:18px; box-shadow:var(--shadow-sm); transition:transform .18s, box-shadow .18s; display:flex; flex-direction:column; }
    .item:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
    .item[data-section="industry"] { --accent2:var(--industry); --accent-soft:var(--industry-soft); --accent-ink:var(--industry-ink); }
    .item[data-section="ai"] { --accent2:var(--ai); --accent-soft:var(--ai-soft); --accent-ink:var(--ai-ink); }
    .item[data-section="release"] { --accent2:var(--release); --accent-soft:var(--release-soft); --accent-ink:var(--release-ink); }
    .item[data-section="discourse"] { --accent2:var(--discourse); --accent-soft:var(--discourse-soft); --accent-ink:var(--discourse-ink); }
    .item[data-section="deep"] { --accent2:var(--deep); --accent-soft:var(--deep-soft); --accent-ink:var(--deep-ink); }
    .item-top { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:11px; }
    .tag { padding:3px 11px; font-size:12px; color:var(--accent-ink); background:var(--accent-soft); border-radius:8px; font-weight:700; letter-spacing:.2px; }
    h3 { margin:2px 0 10px; font-size:17.5px; line-height:1.45; font-weight:700; color:var(--ink); letter-spacing:.1px; }
    .item p { margin:0 0 14px; color:var(--ink-soft); font-size:14.5px; line-height:1.78; }
    .meta-row { display:flex; flex-wrap:wrap; gap:7px; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .meta-row span { padding:3px 10px; background:rgba(31,45,75,.06); border-radius:8px; }
    .item .meta-row span.borderline { background:rgba(240,160,42,.14); color:#a8680a; }
    .source-btn { margin-top:14px; padding:8px 14px; border:1px solid var(--glass-border); background:rgba(255,255,255,.5); color:var(--accent); cursor:pointer; border-radius:11px; font-size:13px; font-weight:600; align-self:flex-start; transition:all .14s; }
    .source-btn:hover { background:var(--accent-soft); border-color:var(--accent2); }
    .ranking-notes { margin:0 0 12px; padding-left:20px; color:var(--ink-soft); line-height:1.55; font-size:13.5px; }
    .ranking-table-wrap { width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.54); }
    .ranking-table { width:100%; min-width:680px; border-collapse:collapse; font-size:12.5px; }
    .ranking-table th,.ranking-table td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    .ranking-table th { color:var(--ink); background:rgba(208,95,63,.08); font-weight:700; }
    .ranking-table td:first-child,.ranking-table th:first-child { text-align:right; }
    .ranking-table tbody tr:last-child td { border-bottom:0; }
    .empty { display:none; padding:48px; border:1px dashed var(--line-strong); color:var(--muted); text-align:center; background:var(--glass); border-radius:18px; }
    .empty.visible { display:block; }

    /* Drawer */
    .overlay { position:fixed; inset:0; display:none; background:rgba(26,36,54,.3); backdrop-filter:blur(3px); }
    .overlay.open { display:block; }
    .drawer { position:fixed; top:0; right:0; width:min(440px,100vw); height:100vh; transform:translateX(100%); transition:.22s cubic-bezier(.4,0,.2,1); background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border-left:1px solid var(--glass-border); box-shadow:-18px 0 44px rgba(31,45,75,.16); padding:24px; overflow:auto; }
    .drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:8px; }
    .drawer h2 { font-size:17px; line-height:1.4; }
    #drawerNote { color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .source-card { border:1px solid var(--glass-border); padding:13px 15px; margin-top:10px; border-radius:12px; background:rgba(255,255,255,.55); }
    .source-card strong { font-size:13px; color:var(--ink); }
    .source-url { display:block; margin-top:6px; color:var(--accent); overflow-wrap:anywhere; user-select:text; font-size:12.5px; text-decoration:none; }
    a.source-url:hover { text-decoration:underline; }
    a.source-url:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

    @media (max-width:900px) {
      .app { grid-template-columns:1fr; }
      aside.sidebar { position:relative; height:auto; }
      .nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
      main { padding:22px 18px 36px; }
      .topbar,.section-head { align-items:stretch; flex-direction:column; }
      .search { width:100%; }
      .metrics,.grid { grid-template-columns:1fr; }
      .section-banner { flex-wrap:wrap; }
      .section-banner .banner-desc { margin-left:0; width:100%; }
    }
    @media print {
      body::before { display:none; }
      aside.sidebar,.actions,.toggle,.source-btn,.drawer,.overlay { display:none!important; }
      .app { display:block; }
      main { padding:0; }
      .item { break-inside:avoid; box-shadow:none; border-color:#bbb; backdrop-filter:none; background:#fff; }
      .section-banner { break-after:avoid; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <a class="back-home" href="../../" aria-label="返回情报站首页">← 返回首页</a>
      <div class="brand" aria-label="沐瞳科技">
        <div class="brand-mark" aria-hidden="true"><img src="../../assets/moonton_logo.png" alt=""></div>
        <div><strong>游戏行业情报站</strong><span>AI 生成 · 每日更新</span></div>
      </div>
      <div class="nav-title">Sections</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="made">Made by 沐瞳科技战略团队</div>
        <div>有问题请联系 <a href="mailto:leelootang@moonton.com">leelootang@moonton.com</a></div>
        <div class="stat">2026-10-28 · 29 条动态</div>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <div><h1>游戏行业日报</h1><div class="subtitle">2026-10-28 · 行业新闻、AI、产品日历、玩家舆论与精选观察</div></div>
        <div class="actions">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" title="折叠 / 展开侧栏" aria-label="切换侧栏">
            <span class="icon-open">«</span><span class="icon-close">»</span>
          </button>
          <label class="search">⌕<input id="search" type="search" placeholder="搜索条目、公司、产品"></label>
          <button class="icon-btn" id="printBtn" type="button" title="打印">⎙</button>
        </div>
      </div>
      <div class="metrics"><div class="metric"><span>行业新闻</span><strong>17</strong></div><div class="metric"><span>产品日历</span><strong>4</strong></div><div class="metric"><span>玩家舆论</span><strong>2</strong></div><div class="metric"><span>采集记录</span><strong>348</strong></div></div>
      <div class="section-head" id="sectionHead">
        <div><h2 id="sectionTitle"></h2><p id="sectionDesc"></p></div>
        <div class="toggle"><button id="viewGrid" class="active" type="button">双列</button><button id="viewList" type="button">列表</button></div>
      </div>
      <div id="content"></div>
      <div class="empty" id="empty">没有匹配的条目。</div>
    </main>
  </div>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="来源详情">
    <div class="drawer-head"><h2 id="drawerTitle"></h2><button class="icon-btn" id="closeDrawer" type="button">×</button></div>
    <p id="drawerNote"></p>
    <div id="sourceList"></div>
  </aside>
  <script>
    const sections = [{"id": "all", "label": "全部", "desc": "浏览全部内容，或从左侧选择单个板块。"}, {"id": "industry", "label": "行业新闻", "desc": "公司、产品、市场与资本动作。"}, {"id": "ai", "label": "AI 新闻", "desc": "游戏相关的 AI 与开发工具。"}, {"id": "release", "label": "产品日历", "desc": "上线、测试、新版本与重点节点。"}, {"id": "discourse", "label": "玩家舆论", "desc": "社区热点、争议与玩家情绪。"}, {"id": "deep", "label": "深度观察", "desc": "值得内部团队继续跟踪的结构性变化。"}];
    const items = [{"section": "industry", "title": "《宝可梦大集结》制作人杨思勤已转岗腾讯魔方", "body": "游戏新知报道，《宝可梦大集结》制作人杨思勤已转岗至腾讯魔方工作室群。他曾参与《元梦之星》大世界捉宠模式与《合金弹头：觉醒》开发，并在《魂斗罗：归来》担任助理制作人。", "body_html": "<p>游戏新知报道，《宝可梦大集结》制作人杨思勤已转岗至腾讯魔方工作室群。他曾参与《元梦之星》大世界捉宠模式与《合金弹头：觉醒》开发，并在《魂斗罗：归来》担任助理制作人。</p>", "meta": ["宝可梦大集结", "元梦之星", "腾讯"], "sources": [["S0160", "天美《宝可梦大集结》官宣停运，制作人已转岗至魔方工作室群", "https://new.qq.com/rain/a/20261028A0BKC000"]]}, {"section": "industry", "title": "Dan Ayoub升任威世智与孩之宝数字游戏负责人", "body": "Dan Ayoub从数字游戏高级副总裁升任Wizards of the Coast与Hasbro Digital Games负责人，接替7月离职的John Hight，职责覆盖《万智牌》《龙与地下城》《Duel Masters》及数字游戏。他将统筹在研科幻RPG《Exodus》和动作冒险游戏《Warlock: Dungeons and Dragons》。孩之宝称，他是首位内部晋升至该职位的人选。", "body_html": "<p>Dan Ayoub从数字游戏高级副总裁升任Wizards of the Coast与Hasbro Digital Games负责人，接替7月离职的John Hight，职责覆盖《万智牌》《龙与地下城》《Duel Masters》及数字游戏。他将统筹在研科幻RPG《Exodus》和动作冒险游戏《Warlock: Dungeons and Dragons》。孩之宝称，他是首位内部晋升至该职位的人选。</p>", "meta": ["万智牌", "龙与地下城"], "sources": [["S0239", "Former Halo boss is now in charge of Wizards of the Coast and Hasbro Digital Games", "https://www.pcgamer.com/gaming-industry/former-halo-boss-is-now-in-charge-of-wizards-of-the-coast-and-hasbro-digital-games/"]]}, {"section": "industry", "title": "据报《寂静岭》初代重制版以2027年发售为目标", "body": "科乐美与Bloober Team去年已确认重制初代《寂静岭》。据IGN中文转述MP1ST爆料，该项目自2022年起开发，以2027年发售为目标，选角代号为“Project Noise”。这些开发时间和目标档期来自报道，尚不能写成官方正式定档。", "body_html": "<p>科乐美与Bloober Team去年已确认重制初代《寂静岭》。据IGN中文转述MP1ST爆料，该项目自2022年起开发，以2027年发售为目标，选角代号为“Project Noise”。这些开发时间和目标档期来自报道，尚不能写成官方正式定档。</p>", "meta": ["寂静岭"], "sources": [["S0206", "曝《寂静岭》重制版拟于2027年发售", "https://www.ign.com.cn/jjlgame/63662/pu-ji-jing-ling-zhong-zhi-ban-ni-yu-2027nian-fa-shou"]]}, {"section": "industry", "title": "腾讯《王者荣耀：世界》4月移动版上线复盘：熟悉的英雄进入开放世界", "body": "游戏茶馆当期刊载的复盘回顾，《王者荣耀：世界》移动版于4月17日正式上线，补齐腾讯这一项目的移动端布局。文章认为，熟悉的英雄技能与角色故事被放入开放世界后，既降低了既有IP用户的理解成本，也让较长的叙事铺垫成为初期体验门槛。这是对当时产品结构的回看。", "body_html": "<p>游戏茶馆当期刊载的复盘回顾，《王者荣耀：世界》移动版于4月17日正式上线，补齐腾讯这一项目的移动端布局。文章认为，熟悉的英雄技能与角色故事被放入开放世界后，既降低了既有IP用户的理解成本，也让较长的叙事铺垫成为初期体验门槛。这是对当时产品结构的回看。</p>", "meta": ["王者荣耀：世界", "腾讯"], "sources": [["S0130", "Wer hätte das gedacht: Tencent hat einen späten Helden namens „Wang Shijie“ aus dem Ärmel gezaubert.", "https://youxichaguan.com/de/archives/216334"], ["S0131", "의외로, 텐센트가 후반형 영웅 ‘왕세제’를 선보였다.", "https://youxichaguan.com/ko/archives/216336"], ["S0132", "Quem diria que a Tencent iria apresentar um herói de fase tardia chamado «Wang Shijie»", "https://youxichaguan.com/pt/archives/216332"], ["S0133", "Quién lo hubiera dicho: Tencent ha sacado a relucir a un héroe de la fase final, «Wang Shijie».", "https://youxichaguan.com/es/archives/216330"], ["S0134", "まさか、テンセントが「王世傑」という後期ヒーローを投入するとは", "https://youxichaguan.com/ja/archives/216328"]]}, {"section": "industry", "title": "Shiyue Network复盘《Dream Guardians》3月上线，强化阵容与局内构筑", "body": "游戏茶馆当期译稿回顾，Shiyue Network的《Dream Guardians》于3月17日上线；据文中引用的点点数据，截至3月29日，iOS累计下载约360万次、收入超过1300万元。产品削减前作的随机召唤与融合设计，转向固定英雄阵容和技能模块搭配，并提供PvP对战。上述数据属于3月的早期表现。", "body_html": "<p>游戏茶馆当期译稿回顾，Shiyue Network的《Dream Guardians》于3月17日上线；据文中引用的点点数据，截至3月29日，iOS累计下载约360万次、收入超过1300万元。产品削减前作的随机召唤与融合设计，转向固定英雄阵容和技能模块搭配，并提供PvP对战。上述数据属于3月的早期表现。</p>", "meta": ["点点"], "sources": [["S0059", "After its previous title surpassed 400 million in revenue, has this Guangzhou-based company created a new hit using the same old formula?", "https://youxichaguan.com/en/archives/216144"], ["S0060", "前作が4億を突破した後、この広州の企業は定番の手法で新たなヒット作を生み出したのか？", "https://youxichaguan.com/ja/archives/216146"], ["S0061", "Tras superar los 400 millones en la entrega anterior, ¿esta empresa de Guangzhou ha conseguido un nuevo éxito con la misma fórmula de siempre?", "https://youxichaguan.com/es/archives/216148"], ["S0062", "Depois de o jogo anterior ter ultrapassado os 400 milhões, será que esta empresa de Guangzhou conseguiu criar um novo sucesso com a mesma fórmula de sempre?", "https://youxichaguan.com/pt/archives/216150"], ["S0063", "Nachdem der Vorgänger 400 Millionen umgesetzt hatte: Hat dieses Unternehmen aus Guangzhou mit altbewährten Methoden einen neuen Hit gelandet?", "https://youxichaguan.com/de/archives/216152"], ["S0064", "전작이 4억을 돌파한 후, 이 광저우 기업은 익숙한 전략으로 새로운 히트작을 만들어 냈을까?", "https://youxichaguan.com/ko/archives/216154"]]}, {"section": "industry", "title": "Discord拟于12月中旬开放部分公共服务器消息的网页搜索", "body": "Discord计划从12月中旬起，让指定“Discoverable Servers”频道中的问答出现在网页搜索中，涉及至少1000名用户的部分大型公共服务器。管理员可退出或限定可搜索频道，用户也可在隐私设置中退出；用户名与头像不会随消息显示。邀请制服务器和私信不在此次调整范围内，相关控制设置已开放。", "body_html": "<p>Discord计划从12月中旬起，让指定“Discoverable Servers”频道中的问答出现在网页搜索中，涉及至少1000名用户的部分大型公共服务器。管理员可退出或限定可搜索频道，用户也可在隐私设置中退出；用户名与头像不会随消息显示。邀请制服务器和私信不在此次调整范围内，相关控制设置已开放。</p>", "meta": [], "sources": [["S0241", "Messages in certain large public Discord servers will be searchable on the web after December", "https://www.pcgamer.com/software/platforms/messages-in-certain-large-public-discord-servers-will-be-searchable-on-the-web-after-december/"]]}, {"section": "industry", "title": "据报澳大利亚法院要求《堡垒之夜》重返当地iOS商店", "body": "GameDiscoverCo当期简报记载，澳大利亚法院已要求《堡垒之夜》重新进入当地iOS App Store。该信息描述的是法院要求，不能等同于游戏已完成重新上架。", "body_html": "<p>GameDiscoverCo当期简报记载，澳大利亚法院已要求《堡垒之夜》重新进入当地iOS App Store。该信息描述的是法院要求，不能等同于游戏已完成重新上架。</p>", "meta": ["堡垒之夜"], "sources": [["S0346", "Who ‘won’ October 2026’s Steam Next Fest?", "https://newsletter.gamediscover.co/p/who-won-october-2026s-steam-next"]]}, {"section": "industry", "title": "暴雪回顾《Project Titan》取消：七年研发后以六周重提新方案", "body": "暴雪回顾《守望先锋》的起点：MMO项目《Project Titan》在研发七年后被取消，团队随后只有六周提出新方案。Keller认为，这段经历从一开始就让团队形成谦逊与韧性，并延续到《守望先锋》十年的运营中。这是对历史项目取舍与组织经验的复盘。", "body_html": "<p>暴雪回顾《守望先锋》的起点：MMO项目《Project Titan》在研发七年后被取消，团队随后只有六周提出新方案。Keller认为，这段经历从一开始就让团队形成谦逊与韧性，并延续到《守望先锋》十年的运营中。这是对历史项目取舍与组织经验的复盘。</p>", "meta": ["守望先锋"], "sources": [["S0244", "Project Titan's end 'immediately instilled a culture of humility' in the Overwatch team which has helped them see the last decade through", "https://www.pcgamer.com/games/fps/project-titans-end-immediately-instilled-a-culture-of-humility-in-the-overwatch-team-which-has-helped-them-see-the-last-decade-through/"]]}, {"section": "industry", "title": "莉莉丝《塔塔冒险队》累计下载超1800万次，双平台收入估算超9500万美元", "body": "据罗斯基引用点点数据，莉莉丝《塔塔冒险队》自5月21日起量至本期发稿，累计下载超过1800万次，海外iOS、海外安卓及国内iOS合计收入超过9500万美元。文中另将国内安卓收入作推估后给出APP总收入约1.1亿美元，不能把这一推估与前述口径混用。产品以弹珠抽宠、塔防战斗和营地经营组成循环，近期投放仍在迭代素材。", "body_html": "<p>据罗斯基引用点点数据，莉莉丝《塔塔冒险队》自5月21日起量至本期发稿，累计下载超过1800万次，海外iOS、海外安卓及国内iOS合计收入超过9500万美元。文中另将国内安卓收入作推估后给出APP总收入约1.1亿美元，不能把这一推估与前述口径混用。产品以弹珠抽宠、塔防战斗和营地经营组成循环，近期投放仍在迭代素材。</p>", "meta": ["塔塔冒险队", "点点", "莉莉丝"], "sources": [["S0231", "莉莉丝这款新游《塔塔冒险队》，悄悄赚了7个多亿", "https://www.sohu.com/a/1094002134_100136645"]]}, {"section": "industry", "title": "世佳、朗新与AlipayHK合作，LumiGames承接海外钱包小游戏业务", "body": "世佳网络、朗新科技集团与AlipayHK在香港启动合作，联合品牌LumiGames成为内容与运营载体。AlipayHK提供流量入口、用户场景及支付能力，世佳负责游戏引入、发行运营与本地化，朗新提供钱包客户基础及平台商业化协同。项目计划先验证香港市场的内容需求与商业化，再扩大供给和用户规模。", "body_html": "<p>世佳网络、朗新科技集团与AlipayHK在香港启动合作，联合品牌LumiGames成为内容与运营载体。AlipayHK提供流量入口、用户场景及支付能力，世佳负责游戏引入、发行运营与本地化，朗新提供钱包客户基础及平台商业化协同。项目计划先验证香港市场的内容需求与商业化，再扩大供给和用户规模。</p>", "meta": ["小游戏"], "sources": [["S0030", "世佳与AlipayHK官宣合作，小游戏出海迈入「生态共建」阶段", "https://m.sohu.com/a/1094039408_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.3.1793232248602I2syOkV"]]}, {"section": "industry", "title": "Charu Desodt出任BAFTA游戏委员会主席", "body": "Interior Night工作室负责人Charu Desodt获任BAFTA游戏委员会主席，接替已加入Lego Digital Play的Tara Saunders。她拥有超过25年行业经验，曾在微软、索尼欧洲及Preloaded担任高级制作职务，也是英国电子游戏委员会成员。", "body_html": "<p>Interior Night工作室负责人Charu Desodt获任BAFTA游戏委员会主席，接替已加入Lego Digital Play的Tara Saunders。她拥有超过25年行业经验，曾在微软、索尼欧洲及Preloaded担任高级制作职务，也是英国电子游戏委员会成员。</p>", "meta": [], "sources": [["S0164", "Interior Night studio head Charu Desodt appointed chair of BAFTA Games Committee", "https://www.gamesindustry.biz/interior-night-studio-head-charu-desodt-appointed-chair-of-bafta-games-committee"]]}, {"section": "industry", "title": "GOG与Retrovibe联合发行，提供资金、营销与跨平台认证支持", "body": "GOG与独立发行商Retrovibe启动“Retrovibe by GOG”，面向PC商店和主机平台支持独立开发者。服务包括资金、营销、内容创作者与媒体沟通，以及发行认证；已列入阵容的作品有《Cop Bastard》和《Project Warlock: Lost Chapters》。两款游戏也有Steam页面，并非GOG独占。", "body_html": "<p>GOG与独立发行商Retrovibe启动“Retrovibe by GOG”，面向PC商店和主机平台支持独立开发者。服务包括资金、营销、内容创作者与媒体沟通，以及发行认证；已列入阵容的作品有《Cop Bastard》和《Project Warlock: Lost Chapters》。两款游戏也有Steam页面，并非GOG独占。</p>", "meta": ["Cop Bastard"], "sources": [["S0251", "GOG's getting into publishing in its new, post-CD-Projekt life, and it already has games on the way", "https://www.pcgamer.com/gaming-industry/gogs-getting-into-publishing-in-its-new-post-cd-projekt-life-and-it-already-has-games-on-the-way/"]]}, {"section": "industry", "title": "Zero Creation Games回顾《Ai Hong》首日回本，AVG投入上限仍受市场约束", "body": "游戏茶馆当期译稿刊载了一场清明假期后的访谈：Zero Creation Games制作人Ji Ling称，《Ai Hong》首日约售出4万份并收回成本，采访时累计销量已超过8万份；前作销量则已超过百万。尽管新作同期销售领先前作，他仍预计未来两年的销售总量会稍低，并认为高投入AVG可能只会尝试这一次。这里记录的是该次访谈时点的数据与判断。", "body_html": "<p>游戏茶馆当期译稿刊载了一场清明假期后的访谈：Zero Creation Games制作人Ji Ling称，《Ai Hong》首日约售出4万份并收回成本，采访时累计销量已超过8万份；前作销量则已超过百万。尽管新作同期销售领先前作，他仍预计未来两年的销售总量会稍低，并认为高投入AVG可能只会尝试这一次。这里记录的是该次访谈时点的数据与判断。</p>", "meta": ["Ai Hong"], "sources": [["S0135", "Recuperação do investimento logo no lançamento: o produtor de «Ai Hong» enfrenta tudo em meio à confusão: dá o seu melhor e mergulha de cabeça na controvérsia", "https://youxichaguan.com/pt/archives/216102"], ["S0136", "初版で元を取った。『哀鴻』のプロデューサーが混乱の中、すべてと向き合う：全力を尽くし、物議を醸す渦中へと突き進む", "https://youxichaguan.com/ja/archives/216098"], ["S0137", "Recuperación de la inversión tras el estreno: el productor de «Ai Hong» afronta todo en medio del caos: da lo mejor de sí mismo y se adentra en la polémica", "https://youxichaguan.com/es/archives/216100"], ["S0138", "Mit der Erstveröffentlichung die Kosten wieder hereinholen: Der Produzent von „Ai Hong“ stellt sich inmitten des Chaos allem: Er gibt sein Bestes und stürzt sich in die Kontroverse", "https://youxichaguan.com/de/archives/216104"], ["S0139", "첫 출시로 투자금 회수, 《애홍》 제작자가 혼란 속에서도 모든 것을 정면으로 마주하다: 온 힘을 다해 논란 속으로 뛰어들다", "https://youxichaguan.com/ko/archives/216106"], ["S0157", "Breaking Even on Day One: The Producer of *Aihong* Faces It All Head-On Amid the Chaos—Giving It His All and Charging Into the Controversy", "https://youxichaguan.com/en/archives/216096"]]}, {"section": "industry", "title": "《Raccoon Coin Pusher》发售复盘：三人团队首日销量10万份", "body": "游戏茶馆当期译稿回顾，《Raccoon Coin Pusher》由三名2024届毕业生组成的团队开发，发售首日销量10万份、同时在线峰值11500人。发行商Playstack此前发行过获得TGA最佳独立游戏奖的作品，此次是其首次与中国开发者合作。制作人表示，发售前约40万份愿望单中，美国地区占比最高；这些是稿件所记录的发售初期数据。", "body_html": "<p>游戏茶馆当期译稿回顾，《Raccoon Coin Pusher》由三名2024届毕业生组成的团队开发，发售首日销量10万份、同时在线峰值11500人。发行商Playstack此前发行过获得TGA最佳独立游戏奖的作品，此次是其首次与中国开发者合作。制作人表示，发售前约40万份愿望单中，美国地区占比最高；这些是稿件所记录的发售初期数据。</p>", "meta": [], "sources": [["S0140", "졸업생 3명이 출시 첫날 10만 건의 다운로드를 기록한 게임을 만들었다고? 《너구리 코인 슬롯머신》 팀과 이야기를 나눠보았다", "https://youxichaguan.com/ko/archives/216082"], ["S0141", "Ein Spiel, das drei Absolventen entwickelt haben und das am ersten Tag 100.000 Mal verkauft wurde? Wir haben uns mit dem Team von „Raccoon Coin Machine“ unterhalten.", "https://youxichaguan.com/de/archives/216080"], ["S0142", "Três recém-licenciados criaram um jogo que vendeu 100 mil cópias no primeiro dia? Conversámos com a equipa do «Raccoon Coin Pusher»", "https://youxichaguan.com/pt/archives/216078"], ["S0143", "¿Tres recién graduados han creado un juego que vendió 100 000 copias el primer día? Hemos hablado con el equipo de «Raccoon Coin Pusher».", "https://youxichaguan.com/es/archives/216076"], ["S0144", "たった3人の卒業生が、初日に10万本売れたゲームを作った？『アライグマのコインプッシャー』チームに話を聞いた", "https://youxichaguan.com/ja/archives/216074"], ["S0145", "Three Graduates Created a Game That Sold 100,000 Copies on Its First Day? We Chatted with the Team Behind *Raccoon Coin Pusher*", "https://youxichaguan.com/en/archives/216072"]]}, {"section": "industry", "title": "RocketWerkz开源BRUTAL框架，商业游戏可免版税使用", "body": "据indienova汇编，RocketWerkz与Ahwoo于10月20日宣布开源C#游戏开发框架BRUTAL，将C#、.NET、C++库和底层图形访问结合，供团队构建和维护自己的开发工具。框架可免费用于商业游戏、不收版税或分成，但需遵守开源许可并展示版权声明与标志。报道还以《边缘世界》迁移至基于BRUTAL的自研引擎为采用案例。", "body_html": "<p>据indienova汇编，RocketWerkz与Ahwoo于10月20日宣布开源C#游戏开发框架BRUTAL，将C#、.NET、C++库和底层图形访问结合，供团队构建和维护自己的开发工具。框架可免费用于商业游戏、不收版税或分成，但需遵守开源许可并展示版权声明与标志。报道还以《边缘世界》迁移至基于BRUTAL的自研引擎为采用案例。</p>", "meta": ["边缘世界"], "sources": [["S0229", "NOVA海外独立游戏见闻 Vol.158", "https://indienova.com/indie-game-news/news-of-overseas-indie-games-and-industry-vol-158/"]]}, {"section": "industry", "title": "Don't Nod工会警告年内清算风险，重组方案进入11月裁定节点", "body": "《奇异人生》早期作品开发商Don't Nod的工会员工于10月27日声明，公司处于避免无力偿债的保障程序中，管理层讨论的最坏财务情形包括2026年内清算。工会称，拟裁撤岗位覆盖多个研发职能，并质疑以外包承接工作是否可行。报道列出的下一节点是11月3日有关机构裁定；若方案获批，员工可能于11月25日收到解雇通知。", "body_html": "<p>《奇异人生》早期作品开发商Don't Nod的工会员工于10月27日声明，公司处于避免无力偿债的保障程序中，管理层讨论的最坏财务情形包括2026年内清算。工会称，拟裁撤岗位覆盖多个研发职能，并质疑以外包承接工作是否可行。报道列出的下一节点是11月3日有关机构裁定；若方案获批，员工可能于11月25日收到解雇通知。</p>", "meta": ["奇异人生"], "sources": [["S0211", "《奇异人生》开发商遭工会员工指控违法", "https://www.ign.com.cn/life-is-strange/63667/qi-yi-ren-sheng-kai-fa-shang-zao-gong-hui-yuan-gong-zhi-kong-wei-fa"]]}, {"section": "industry", "title": "《Witchbrook》定档2027年1月28日，生活模拟扩展到全平台", "body": "首次曝光八年后，生活模拟游戏《Witchbrook》确定于2027年1月28日登陆PS5、Xbox Series X|S、PC、Switch与Switch 2。玩家在魔法学校学习，与镇民建立关系，也可邀请三名朋友共同经营、布置房屋或参加扫帚竞速。此次发布明确了正式发售日与平台范围。", "body_html": "<p>首次曝光八年后，生活模拟游戏《Witchbrook》确定于2027年1月28日登陆PS5、Xbox Series X|S、PC、Switch与Switch 2。玩家在魔法学校学习，与镇民建立关系，也可邀请三名朋友共同经营、布置房屋或参加扫帚竞速。此次发布明确了正式发售日与平台范围。</p>", "meta": ["Witchbrook", "生活模拟"], "sources": [["S0201", "Witchbrook Is Stardew Valley Meets Kiki’s Delivery Service, And It Finally Has A Release Date", "https://www.gamespot.com/articles/witchbrook-is-stardew-valley-meets-kikis-delivery-service-and-it-finally-has-a-release-date/"]]}, {"section": "ai", "title": "《爱哩爱哩》以自主AI居民替代直接控制，付费对应内容生成频率", "body": "制作人Sea团队曝光AI新品《爱哩爱哩》：角色自行生活、发布图文或视频，玩家通过投喂道具与MOD间接影响行为，产品不提供直接打字聊天。团队用分层日志组织角色记忆，并称已建立多Agent循环审核的资产生产管线。Sea表示，视频生成成本使产品选择F2P，付费主要增加生活内容的产出频率；这些仍需通过早期测试验证。", "body_html": "<p>制作人Sea团队曝光AI新品《爱哩爱哩》：角色自行生活、发布图文或视频，玩家通过投喂道具与MOD间接影响行为，产品不提供直接打字聊天。团队用分层日志组织角色记忆，并称已建立多Agent循环审核的资产生产管线。Sea表示，视频生成成本使产品选择F2P，付费主要增加生活内容的产出频率；这些仍需通过早期测试验证。</p>", "meta": ["爱哩爱哩"], "sources": [["S0029", "做过畅销榜Top 1的制作人狂蹬AI两年，首曝了一款AI新品", "https://m.sohu.com/a/1094041153_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.2.1793232248602I2syOkV"]]}, {"section": "ai", "title": "Lumio AI游戏创作平台已有122款作品，开发者强调需求与验收仍需人掌握", "body": "游戏新知采访的程序员大崔离职后开发了AI游戏创作平台Lumio，平台已有122款创作者游戏，总游玩时长超过47小时。按其介绍，开发经历包括独自借助AI工作三个月，再与三名伙伴协作半个月。他同时认为，AI缩短编码时间后，需求并行扩张会增加程序员的心智负担，技术方案与需求理解不能只靠转达给模型。", "body_html": "<p>游戏新知采访的程序员大崔离职后开发了AI游戏创作平台Lumio，平台已有122款创作者游戏，总游玩时长超过47小时。按其介绍，开发经历包括独自借助AI工作三个月，再与三名伙伴协作半个月。他同时认为，AI缩短编码时间后，需求并行扩张会增加程序员的心智负担，技术方案与需求理解不能只靠转达给模型。</p>", "meta": [], "sources": [["S0161", "10年程序员离职做AI游戏平台，首月产出122款游戏", "https://new.qq.com/rain/a/20261028A0BKBS00"]]}, {"section": "ai", "title": "Epic称已用AI开发UE6与《堡垒之夜》，工程师保留架构与性能控制", "body": "Epic开发负责人Marcus Wassmer表示，工程师已不再编写大部分代码，而是指导AI工具并持续迭代，确保引擎满足内存、性能与扩展性约束。当前相关开发流连接《堡垒之夜》、UEFN和UE6，使用工具包括Claude Code与Codex。他举例称，原估单名工程师需三至六周的D3D12渲染层部分重写，实际约一周完成；这是厂商披露的具体任务结果。", "body_html": "<p>Epic开发负责人Marcus Wassmer表示，工程师已不再编写大部分代码，而是指导AI工具并持续迭代，确保引擎满足内存、性能与扩展性约束。当前相关开发流连接《堡垒之夜》、UEFN和UE6，使用工具包括Claude Code与Codex。他举例称，原估单名工程师需三至六周的D3D12渲染层部分重写，实际约一周完成；这是厂商披露的具体任务结果。</p>", "meta": ["堡垒之夜", "AI渲染"], "sources": [["S0247", "'Yes, we are vibe-coding things': Epic confirms it's using AI tools to code Unreal Engine 6, Fortnite, and more", "https://www.pcgamer.com/software/ai/yes-we-are-vibe-coding-things-epic-confirms-its-using-ai-tools-to-code-unreal-engine-6-fortnite-and-more/"]]}, {"section": "ai", "title": "Epic拟解除UE与MetaHuman输出的AI训练限制，具体游戏授权仍由开发者决定", "body": "Tim Sweeney表示，Epic正在推进修改许可条款，移除使用虚幻引擎与MetaHuman输出训练AI的限制，现行条款目前仍有限制。他同时强调，采用这些工具制作的每款游戏，仍可由开发者自行选择允许或禁止AI训练。工具许可的调整计划因此不等于所有游戏资产都已开放训练。", "body_html": "<p>Tim Sweeney表示，Epic正在推进修改许可条款，移除使用虚幻引擎与MetaHuman输出训练AI的限制，现行条款目前仍有限制。他同时强调，采用这些工具制作的每款游戏，仍可由开发者自行选择允许或禁止AI训练。工具许可的调整计划因此不等于所有游戏资产都已开放训练。</p>", "meta": [], "sources": [["S0025", "Epic宣布将允许AI使用虚幻引擎和MetaHuman输出训练", "https://www.gcores.com/articles/221590"], ["S0176", "Epic is updating its EULA to allow AI training on outputs from Unreal Engine and MetaHuman", "https://www.gamedeveloper.com/programming/epic-is-updating-the-eula-to-allow-ai-training-on-outputs-from-unreal-engine-and-metahuman"]]}, {"section": "ai", "title": "Roblox关闭误抓成人资产的AI代理，称数据未用于训练", "body": "Roblox向Game Developer确认，一名研究人员建立的3D资产采集代理未按预期运行，抓取了Open3DLab及关联站点的内容。公司表示已停用该代理，数据没有用于任何用途，包括模型训练，并正在强化代理构建与审查的防护。站方管理员则指控该抓取忽略robots.txt、服务条款及部分作者的非商业许可；两方陈述须分别理解。", "body_html": "<p>Roblox向Game Developer确认，一名研究人员建立的3D资产采集代理未按预期运行，抓取了Open3DLab及关联站点的内容。公司表示已停用该代理，数据没有用于任何用途，包括模型训练，并正在强化代理构建与审查的防护。站方管理员则指控该抓取忽略robots.txt、服务条款及部分作者的非商业许可；两方陈述须分别理解。</p>", "meta": ["Roblox"], "sources": [["S0181", "Roblox confirms no adult content used in AI training after scraping Open3DLab data", "https://www.gamedeveloper.com/business/roblox-confirms-no-adult-content-used-in-ai-training-after-scraping-open3dlab-data"]]}, {"section": "release", "title": "影之刃零", "body": "灵游坊自主研发及发行的武侠动作多平台游戏《影之刃零》定于10月29日正式发售；玩家将在六十六天生命倒计时中展开战斗与探索。", "body_html": "<p>灵游坊自主研发及发行的武侠动作多平台游戏《影之刃零》定于10月29日正式发售；玩家将在六十六天生命倒计时中展开战斗与探索。</p>", "meta": ["影之刃零"], "sources": [["S0020", "梁其伟长文致谢玩家，《影之刃零》明日上线！", "https://www.gcores.com/articles/221570"], ["S0028", "距上线不到20小时，《影之刃零》制作人梁其伟发文回顾20年生涯", "https://m.sohu.com/a/1094041150_204824?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334&spm=smwp.channel_247.block2_307_epwR4p_1_fd.6.1793232248602I2syOkV"], ["S0035", "梁其伟复盘《影之刃零》开发历程，砍掉其他项目、00后操盘重要战斗设计", "https://www.youxituoluo.com/535003.html"], ["S0232", "放弃多款手游，烧掉数亿做单机，这家腾讯投资的公司要交卷了", "https://www.sohu.com/a/1094013496_100136645"], ["S0243", "Here's the Phantom Blade Zero release time for your region", "https://www.pcgamer.com/games/action/phantom-blade-zero-release-date-launch-times/"], ["S0261", "观察丨梁其伟：砍掉其他项目，癫狂一次，00后立大功", "http://www.nadianshi.com/2026/10/423367"], ["S0230", "本周 Steam 值得关注的游戏 10.26 - 11.01（三）", "https://indienova.com/indie-game-news/guide-2026-1026-1101-part-3/"]]}, {"section": "release", "title": "Witchbrook", "body": "生活模拟多平台游戏《Witchbroo ction": "release", "title": "Raccoin: Chaos Max Edition", "body": "牌组构筑肉鸽主机游戏《Raccoin: Chaos Max Edition》定于11月10日在Switch 2正式发售；该版本提供专属机台外观与鼠标操作支持。", "body_html": "<p>牌组构筑肉鸽主机游戏《Raccoin: Chaos Max Edition》定于11月10日在Switch 2正式发售；该版本提供专属机台外观与鼠标操作支持。</p>", "meta": [], "sources": [["S0197", "Nintendo Indie World October 2026 Showcase: All The Biggest Announcements", "https://www.gamespot.com/articles/nintendo-indie-world-october-2026-showcase-all-the-biggest-announcements/"], ["S0203", "Every October 2026 Nintendo Indie World Game You Can Play Right Now", "https://www.gamespot.com/articles/every-october-2026-nintendo-indie-world-game-you-can-play-right-now/"], ["S0307", "RACCOIN: Chaos Max Edition for PS5, Xbox Series, and Switch 2 launches November 10", "https://news.google.com/rss/articles/CBMisAFBVV95cUxQN2xwdzZtV3ozVWx4cWJjRHVwSVFrYXFpMWZ5WGM5aWxsMDJ5LVpjQmI3bDJaQ1JsMjIyYjRYakh0M3FrT2JHb0ZlNVpaX3VRTnY5ZWhRUnpQX0JwMkNMOG45ZnA5REd1U1EwMEJZMThSNHRtS1F5WHBXNU1CYjJoTGR2NHZEWnk4V0JWTVJHdzZ1dV8yazFELVRjVHRZbjdIM3NTYWFPQ1Jjc0J5cTA3UA?oc=5"]]}, {"section": "discourse", "title": "玩家质疑米哈游游戏AI评测取样不对称，争论集中于可比性", "body": "米哈游游戏AI的评测展示被玩家质疑采用不对称取样：10月28日新帖称，自家模型取十轮最高分，其他模型取十轮最低分，并给出项目页面和代码位置作为复核线索。玩家担忧这种比较会放大性能优势，另有回复指出，暂停与实时模式、不同参数规模的结果并不一致。帖子也有用户表示自己尚未确认高低分取样，争议仍围绕比较口径与结论是否相称展开。", "body_html": "<p>米哈游游戏AI的评测展示被玩家质疑采用不对称取样：10月28日新帖称，自家模型取十轮最高分，其他模型取十轮最低分，并给出项目页面和代码位置作为复核线索。玩家担忧这种比较会放大性能优势，另有回复指出，暂停与实时模式、不同参数规模的结果并不一致。帖子也有用户表示自己尚未确认高低分取样，争议仍围绕比较口径与结论是否相称展开。</p>", "meta": ["米哈游"], "sources": [["S0334", "[米哈游] 米的游戏AI给其他模型取最低分对比，而且实际没打过qwen底模", "https://bbs.nga.cn/read.php?tid=47801147&forder_by=postdatedesc"]]}, {"section": "discourse", "title": "《三角洲行动》“惊喜渡鸦”随机复制收藏品，玩家争论收益差距", "body": "《三角洲行动》“惊喜渡鸦”活动被玩家描述为可使当局收藏品升级、降级、消失、不变或复制，稀有收藏品也可能进入这一循环。10月25日开启的讨论中，争议集中在随机收益是否放大玩家资产差距；支持者则认为触发机会和可用物资本就受限，不能用少数高收益视频代表常态。到10月28日，仍有玩家以资产消耗速度反驳“经济失衡”的判断。", "body_html": "<p>《三角洲行动》“惊喜渡鸦”活动被玩家描述为可使当局收藏品升级、降级、消失、不变或复制，稀有收藏品也可能进入这一循环。10月25日开启的讨论中，争议集中在随机收益是否放大玩家资产差距；支持者则认为触发机会和可用物资本就受限，不能用少数高收益视频代表常态。到10月28日，仍有玩家以资产消耗速度反驳“经济失衡”的判断。</p>", "meta": ["三角洲行动"], "sources": [["S0345", "[腾讯]话说回来瓜版这边没人讨论吗，三角洲那边出了个很逆天的活动", "https://bbs.nga.cn/read.php?tid=47783517&forder_by=postdatedesc"]]}, {"section": "deep", "title": "Steam新品节参展激增，已有热度比现场曝光更能决定结果", "body": "观察：GameDiscoverCo对10月Steam新品节的复盘显示，参展供给的增长快于可分配注意力，活动更像放大已有兴趣，而非普遍创造兴趣。其跟踪的Demo超过7300款，较6月约4400款明显增加。 分析：原先开发者可以把集中试玩活动当作一段较强的发现窗口，前提是平台曝光足以让中腰部作品获得可观的新关注。该机构用更可跨期比较的Steam关注者增量观察发现，10月排名前10%的门槛仅为新增63名关注者，6月为121名、去年10月为173名；这不是愿望单的精确换算，而是同类排名位置上的关注收益在下降。供给扩张后，同一百分位的可见度被摊薄，单凭“参加了活动”更难支撑发行预期。 多个靠前Demo在活动前就已积累玩家兴趣，新增愿望单前十的中位数也由6月约14.3万降至10月约8万。由此可以理解作者提出的“热度放大器”：场外传播、既有试玩与产品受众的积累，先形成进入活动的基础，再由活动集中转化。与此同时，文章强调不同细分品类的微趋势并存，不能把供给拥挤简单归因为某一种题材或把所有参展作品视为AI产物。", "body_html": "<p>观察：GameDiscoverCo对10月Steam新品节的复盘显示，参展供给的增长快于可分配注意力，活动更像放大已有兴趣，而非普遍创造兴趣。其跟踪的Demo超过7300款，较6月约4400款明显增加。</p><p>分析：原先开发者可以把集中试玩活动当作一段较强的发现窗口，前提是平台曝光足以让中腰部作品获得可观的新关注。该机构用更可跨期比较的Steam关注者增量观察发现，10月排名前10%的门槛仅为新增63名关注者，6月为121名、去年10月为173名；这不是愿望单的精确换算，而是同类排名位置上的关注收益在下降。供给扩张后，同一百分位的可见度被摊薄，单凭“参加了活动”更难支撑发行预期。</p><p>多个靠前Demo在活动前就已积累玩家兴趣，新增愿望单前十的中位数也由6月约14.3万降至10月约8万。由此可以理解作者提出的“热度放大器”：场外传播、既有试玩与产品受众的积累，先形成进入活动的基础，再由活动集中转化。与此同时，文章强调不同细分品类的微趋势并存，不能把供给拥挤简单归因为某一种题材或把所有参展作品视为AI产物。</p>", "meta": [], "sources": [["S0346", "Who ‘won’ October 2026’s Steam Next Fest?", "https://newsletter.gamediscover.co/p/who-won-october-2026s-steam-next"]]}];
    const sectionLabels = Object.fromEntries(sections.map(s => [s.id, s.label]));
    const sectionDescs = Object.fromEntries(sections.map(s => [s.id, s.desc]));
    const orderedSectionIds = sections.filter(s => s.id !== "all").map(s => s.id);
    let currentSection = "all";
    let compact = false;
    const nav = document.getElementById("nav");
    const content = document.getElementById("content");
    const sectionHead = document.getElementById("sectionHead");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    function matches(item, query) {
      if (!query) return true;
      const text = [item.title,item.body,item.meta.join(" "),item.sources.map(s => s.join(" ")).join(" ")].join(" ").toLowerCase();
      return text.includes(query.toLowerCase());
    }
    function isBorderline(m) {
      return /borderline/i.test(m);
    }
    function renderNav() {
      nav.innerHTML = "";
      sections.forEach(section => {
        const count = section.id === "all" ? items.length : items.filter(item => item.section === section.id).length;
        const button = document.createElement("button");
        button.dataset.section = section.id;
        if (section.id === currentSection) button.classList.add("active");
        button.innerHTML = `<span>${section.label}</span><span class="count">${count}</span>`;
        button.addEventListener("click", () => { currentSection = section.id; render(); });
        nav.appendChild(button);
      });
    }
    function renderItem(item) {
      const node = document.createElement("article");
      node.className = "item";
      node.dataset.section = item.section;
      const metaTags = item.meta.map(m => {
        const cls = isBorderline(m) ? "borderline" : "";
        return `<span class="${cls}">${m}</span>`;
      }).join("");
      const bodyMarkup = item.body_html || `<p>${item.body}</p>`;
      node.innerHTML = `<div class="item-top"><span class="tag">${sectionLabels[item.section]}</span></div><h3>${item.title}</h3>${bodyMarkup}<div class="meta-row">${metaTags}</div><button class="source-btn" type="button">查看来源 →</button>`;
      node.querySelector(".source-btn").addEventListener("click", () => openDrawer(item));
      return node;
    }
    function buildGrid(itemList) {
      const grid = document.createElement("section");
      grid.className = compact ? "grid compact" : "grid";
      itemList.forEach(item => grid.appendChild(renderItem(item)));
      return grid;
    }
    function buildSectionBlock(sectionId, itemList) {
      const block = document.createElement("div");
      block.className = "section-block";
      const banner = document.createElement("div");
      banner.className = "section-banner";
      banner.dataset.section = sectionId;
      banner.innerHTML = `<h2>${sectionLabels[sectionId]}</h2><span class="banner-count">${itemList.length} 条</span><span class="banner-desc">${sectionDescs[sectionId]}</span>`;
      block.appendChild(banner);
      block.appendChild(buildGrid(itemList));
      return block;
    }
    function render() {
      renderNav();
      const query = search.value.trim();
      const filtered = items.filter(item => (currentSection === "all" || item.section === currentSection) && matches(item, query));
      content.innerHTML = "";
      if (currentSection === "all") {
        sectionHead.style.display = "none";
        orderedSectionIds.forEach(sid => {
          const sectionItems = filtered.filter(it => it.section === sid);
          if (sectionItems.length > 0) content.appendChild(buildSectionBlock(sid, sectionItems));
        });
      } else {
        sectionHead.style.display = "flex";
        sectionHead.dataset.section = currentSection;
        document.getElementById("sectionTitle").textContent = sectionLabels[currentSection];
        document.getElementById("sectionDesc").textContent = sectionDescs[currentSection];
        content.appendChild(buildGrid(filtered));
      }
      empty.classList.toggle("visible", filtered.length === 0);
    }
    function openDrawer(item) {
      document.getElementById("drawerTitle").textContent = item.title;
      document.getElementById("drawerNote").textContent = item.body;
      document.getElementById("sourceList").innerHTML = item.sources.map(([id,name,url]) => {
        const safeUrl = String(url || "");
        const isHttp = /^https?:\/\//i.test(safeUrl);
        const linkAttrs = isHttp ? `href="${safeUrl}" target="_blank" rel="noopener noreferrer"` : "";
        const urlEl = isHttp
          ? `<a class="source-url" ${linkAttrs}>${safeUrl} ↗</a>`
          : `<span class="source-url">${safeUrl}</span>`;
        return `<div class="source-card"><strong>${id} · ${name}</strong>${urlEl}</div>`;
      }).join("");
      drawer.classList.add("open"); overlay.classList.add("open");
    }
    function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
    search.addEventListener("input", render);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    // Sidebar collapse — state persists in localStorage
    const app = document.getElementById("app");
    const SIDEBAR_KEY = "report-sidebar-collapsed";
    try { if (localStorage.getItem(SIDEBAR_KEY) === "1") app.classList.add("collapsed"); } catch (e) {}
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      app.classList.toggle("collapsed");
      try { localStorage.setItem(SIDEBAR_KEY, app.classList.contains("collapsed") ? "1" : "0"); } catch (e) {}
    });
    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("viewGrid").addEventListener("click", () => { compact = false; document.getElementById("viewGrid").classList.add("active"); document.getElementById("viewList").classList.remove("active"); render(); });
    document.getElementById("viewList").addEventListener("click", () => { compact = true; document.getElementById("viewList").classList.add("active"); document.getElementById("viewGrid").classList.remove("active"); render(); });
    render();
  </script>
